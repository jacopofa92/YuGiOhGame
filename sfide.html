<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Opt-in STATICO alla View Transitions API — deve stare qui, non iniettato via JS in ritardo (vedi js/audio/audio-manager.js per la storia completa del bug che questo risolve). -->

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<!-- Sfondo scuro applicato SUBITO, prima che gli script auth-gate/supabase
     sotto finiscano di scaricare (bloccanti) — evita un flash bianco
     prima del nero dell'overlay di auth-gate.js, vedi il commento
     completo in cartoteca.html dove è stato diagnosticato. -->
<style>html, body { background: #0b0d14; }</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Accesso obbligatorio (js/cloud/auth-gate.js) — vedi il commento lì:
     rimanda a index.html se non c'è una sessione approvata. -->
<script src="js/vendor/supabase.min.js"></script>
<script src="js/cloud/supabase-config.js"></script>
<script src="js/cloud/cloud-sync.js"></script>
<script src="js/cloud/auto-sync.js"></script>

<link rel="preload" href="audio/soundtracks/mainTheme.mp3" as="audio">

<link rel="stylesheet" href="js/ui/challenge-banner.css">
<title>Yu-Gi-Oh! Duel Arena — Sfide</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Niente selezione di testo/pressione lunga sul contenuto del gioco (nomi
       carte, personaggi, pulsanti...): su mobile un tocco prolungato apriva
       il menu di sistema "Cerca su Google"/copia invece di far scattare
       l'interazione del gioco. input/textarea/select restano selezionabili
       normalmente, altrimenti non si potrebbe più scrivere nei campi.
       -webkit-tap-highlight-color: via anche il rettangolo azzurrino che
       il browser mobile dipinge sopra QUALUNQUE elemento toccato —
       segnalato dall'utente tenendo premuto. Non toglie alcun riscontro
       al tocco: i pulsanti del gioco hanno il proprio stato ":active",
       che quel rettangolo si limitava a coprire con un colore di sistema
       estraneo alla tavolozza. Il contorno di messa a fuoco da tastiera
       resta intatto: quello NON passa da questa proprietà.
       overscroll-behavior: niente rimbalzo elastico quando si trascina
       la pagina oltre il bordo, e niente "tira per ricaricare" — su una
       pagina di gioco quel gesto e' a un dito di distanza dal ricaricare
       tutto a meta' duello. */
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overscroll-behavior-y: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { min-height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/ra.jpg') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.6) 0%, rgba(6,7,12,0.72) 60%, rgba(4,5,8,0.85) 100%);
        pointer-events: none;
    }

    :root {
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --ink: #cdd6ea;
        --ink-dim: #9aa5bd;
    }

    /* Topbar: markup/CSS generati da js/ui/topbar.js + js/ui/topbar.css. */

    .main {
        position: relative;
        z-index: 1;
        padding: 30px 22px 60px;
        max-width: 760px;
        margin: 0 auto;
    }

    /* Le quattro sezioni. Una riga sola che scorre di lato su schermi
       stretti invece di andare a capo: così si legge come una fila di
       schede e non come un blocco di pulsanti. */
    .sezioni {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
    }
    .sezioni::-webkit-scrollbar { display: none; }
    .sezione-tab {
        flex: none;
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid rgba(247,215,116,0.28);
        background: rgba(0,0,0,0.35);
        color: #e8e2d0;
        font: inherit;
        font-size: 0.86rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
    }
    .sezione-tab:active { transform: scale(0.97); }
    .sezione-tab.is-attiva {
        background: linear-gradient(145deg, rgba(247,215,116,0.22), rgba(243,156,18,0.12));
        border-color: rgba(247,215,116,0.75);
        color: #f7d774;
    }
    /* Quanto manca al prossimo cambio: una riga sotto il riepilogo, tono
       da nota e non da titolo — è un'informazione di contorno. */
    .rotazione {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: -14px 0 20px;
        font-size: 0.78rem;
        color: rgba(247,215,116,0.85);
    }
    .rotazione-avviso { color: #ffcf8a; opacity: 0.85; font-size: 0.74rem; }

    .progress-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: linear-gradient(150deg, rgba(40,32,20,0.82), rgba(18,16,22,0.86));
        border: 2px solid rgba(247,215,116,0.3);
        border-radius: 16px;
        padding: 16px 20px;
        margin-bottom: 24px;
    }
    .progress-summary-label { font-size: 0.85rem; color: var(--ink-dim); }
    .progress-summary-value { font-size: 1.4rem; font-weight: 900; color: var(--gold); }

    /* Una sfida per riga: più leggibile di una griglia, e lascia spazio a
       una barra di progresso vera per ciascuna invece di una sola cifra. */
    /* Titolo di gruppo: divide la lista in famiglie, con quante ne hai
       già fatte di quel gruppo. Serve da quando le sfide sono una
       sessantina — prima erano poche e una lista piatta bastava. */
    .challenge-group {
        margin: 22px 0 6px;
        font-size: 0.68rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--gold, #f7d774);
        opacity: 0.85;
    }
    .challenge-group:first-child { margin-top: 0; }

    .challenge-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .challenge-card {
        position: relative;
        display: flex;
        gap: 16px;
        align-items: flex-start;
        background: linear-gradient(150deg, rgba(40,32,20,0.82), rgba(18,16,22,0.86));
        border: 2px solid rgba(247,215,116,0.28);
        border-radius: 18px;
        padding: 18px 22px;
        box-shadow: 0 14px 34px rgba(0,0,0,0.4);
        overflow: hidden;
    }
    .challenge-card.completed {
        border-color: rgba(247,215,116,0.75);
        box-shadow: 0 14px 34px rgba(0,0,0,0.4), 0 0 22px rgba(243,156,18,0.25);
    }
    .challenge-icon {
        flex-shrink: 0;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        background: linear-gradient(150deg, #3a2f22, #1c1620);
        border: 1px solid rgba(247,215,116,0.4);
    }
    .challenge-body { flex: 1; min-width: 0; }
    .challenge-name-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 4px;
    }
    .challenge-name { font-size: 1.02rem; font-weight: 900; color: #fff; }
    .challenge-done-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #1c1620;
        background: linear-gradient(135deg, #f7d774, #f39c12);
        border-radius: 999px;
        padding: 3px 10px;
    }
    .challenge-desc { color: var(--ink); font-size: 0.84rem; line-height: 1.5; margin-bottom: 10px; }
    .challenge-progress-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .challenge-bar {
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(247,215,116,0.25);
        overflow: hidden;
    }
    .challenge-bar-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #c9770a, #f39c12 55%, #fff6dc);
    }
    .challenge-progress-text {
        flex-shrink: 0;
        font-size: 0.76rem;
        font-weight: 800;
        color: var(--ink-dim);
        min-width: 46px;
        text-align: right;
    }
    .challenge-card.completed .challenge-progress-text { color: var(--gold); }

    /* Riga "cosa dà questa Sfida": separata dal resto da un filo dorato,
       perché è informazione di natura diversa dal progresso — quello dice
       a che punto sei, questa dice perché vale la pena arrivarci. */
    .challenge-reward-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
        margin-top: 9px;
        padding-top: 8px;
        border-top: 1px solid rgba(247,215,116,0.22);
    }
    .challenge-reward-label {
        font-size: 0.66rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ink-dim);
    }
    .challenge-reward-item {
        font-size: 0.82rem;
        font-weight: 800;
        color: var(--gold);
        white-space: nowrap;
    }
    /* A sfida completata il premio è già stato incassato: resta scritto
       (serve a ricordare cosa ha fruttato) ma smette di "chiamare". */
    .challenge-card.completed .challenge-reward-item { opacity: 0.72; }

    .reward-note {
        text-align: center;
        color: var(--ink-dim);
        font-size: 0.78rem;
        line-height: 1.6;
        margin-top: 22px;
    }

    @media (max-width: 480px) {
        .main { padding: 14px 8px 40px; }
        .challenge-card { padding: 12px; gap: 10px; }
        .challenge-icon { width: 40px; height: 40px; font-size: 1.15rem; }
        .progress-summary { padding: 12px 14px; }
        .progress-summary-value { font-size: 1.15rem; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
        .main { padding: 8px 14px 24px; }
        .challenge-card { padding: 10px 14px; gap: 10px; }
        .challenge-icon { width: 36px; height: 36px; font-size: 1.05rem; }
    }
</style>
</head>
<body>
    <script src="js/ui/page-loader.js"></script>
    <div id="topbarMount"></div>

    <main class="main">
        <!-- Le quattro sezioni. Una riga di schede invece di una lista
             unica: con sessantasei Sfide permanenti più le missioni del
             giorno e della settimana, un elenco solo sarebbe alto quindici
             schermate e non si troverebbe più niente. -->
        <div class="sezioni" id="sezioniTabs" role="tablist">
            <button type="button" class="sezione-tab is-attiva" data-sezione="giornaliere" role="tab">☀️ Oggi</button>
            <button type="button" class="sezione-tab" data-sezione="settimanali" role="tab">📅 Settimana</button>
            <button type="button" class="sezione-tab" data-sezione="generiche" role="tab">🏆 Sfide</button>
            <button type="button" class="sezione-tab" data-sezione="storie" role="tab">📖 Storie</button>
        </div>

        <div class="progress-summary">
            <span class="progress-summary-label" id="progressSummaryLabel">Sfide completate</span>
            <span class="progress-summary-value" id="progressSummaryValue">0/0</span>
        </div>

        <!-- Quanto manca al prossimo cambio: visibile solo nelle due
             sezioni a rotazione, dove è un'informazione e non un ornamento
             (fra due ore le missioni saranno altre). -->
        <div class="rotazione" id="rotazioneInfo" hidden>
            <span id="rotazioneTesto"></span>
            <span class="rotazione-avviso" id="rotazioneAvviso" hidden>⚠️ Orario dal dispositivo: senza rete la rotazione potrebbe non essere quella giusta.</span>
        </div>

        <div class="challenge-list" id="challengeList"></div>

        <p class="reward-note" id="notaPremi">Ogni Sfida paga <strong>una volta sola</strong>, nel momento in cui la completi: il premio ti viene accreditato subito e te lo dice un avviso, ovunque tu sia quando succede.</p>
    </main>

<script src="js/save-manager.js"></script>
<!-- rewards.js DOPO save-manager.js (da cui dipende) e PRIMA del tracker:
     è lui che accredita il premio di una Sfida completata, ed è l'unico
     punto del gioco autorizzato a toccare le valute. Senza questo tag la
     pagina mostrava le Sfide ma non sapeva dire cosa danno, e una sfida
     completata qui sopra non avrebbe pagato nulla. -->
<script src="js/economy/rewards.js"></script>
<script src="js/data/challenges-db.js"></script>
<!-- Il pool delle missioni a rotazione, e il catalogo delle campagne: la
     prima sezione ne ha bisogno per sorteggiarle, l'ultima per dare a
     ogni gruppo il nome e l'icona della sua storia invece dell'id. -->
<script src="js/data/missions-db.js"></script>
<script src="js/data/story-campaigns.js"></script>
<!-- L'orario del SERVER decide quali missioni sono di oggi e di questa
     settimana: senza, basterebbe spostare l'ora del telefono per farne
     comparire di nuove (vedi js/cloud/server-date.js). -->
<script src="js/cloud/server-date.js"></script>
<script src="js/challenges/challenge-tracker.js"></script>
<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/deck-switcher.js"></script>
<script src="js/ui/topbar.js"></script>
<script src="js/ui/challenge-banner.js"></script>
<script>
    PageTopbar.render('#topbarMount', { icon: 'tournament', title: 'Sfide' });

    // Colonna sonora condivisa tra le pagine, come nelle altre schermate
    // fuori dal duello vero e proprio (vedi commento in index.html).
    initAudioManager();
    Icons.hydrate();

    /**
     * La riga "cosa dà questa Sfida", mostrata PRIMA di averla vinta.
     * Un obiettivo va scelto sapendo che cosa frutta: senza, il premio si
     * scoprirebbe solo a cose fatte — e non si potrebbe decidere quale
     * sfida vale la pena inseguire.
     *
     * Usa Rewards.previewChallenge, che legge il premio senza accreditare
     * nulla (a differenza di forChallenge, che paga). I testi arrivano da
     * js/data/challenges-db.js e js/economy/rewards.js, mai dall'utente.
     */
    function premiHtml(challenge) {
        if (!window.Rewards || typeof Rewards.previewChallenge !== 'function') return '';
        const voci = Rewards.previewChallenge(challenge);
        if (voci.length === 0) return '';
        const etichetta = challenge.completed ? 'Ottenuto' : 'Ricompensa';
        return `<div class="challenge-reward-row">
            <span class="challenge-reward-label">${etichetta}</span>
            ${voci.map((v) => `<span class="challenge-reward-item">${v.icon} +${v.amount} ${v.nome}</span>`).join('')}
        </div>`;
    }

    /**
     * Le sfide raggruppate per tipo, con un titolo per gruppo. Finché
     * erano una quindicina una lista piatta bastava; a una sessantina la
     * pagina diventa alta undici schermate e non si trova più niente.
     *
     * L'ordine è quello dell'elenco qui sotto, non quello del catalogo:
     * si comincia da ciò che si ottiene giocando normalmente e si finisce
     * con i traguardi rari. Un tipo non elencato (una famiglia nuova
     * aggiunta a challenges-db.js e dimenticata qui) finisce in fondo con
     * un titolo generico invece di sparire.
     */
    const GRUPPI = [
        { type: 'winDuels', titolo: '🏆 Traguardi' },
        { type: 'defeatCharacter', titolo: '⚔️ Duellanti da battere' },
        { type: 'summonMonster', titolo: '✨ Mostri da evocare' },
        { type: 'activateCard', titolo: '🎴 Carte da attivare' },
        { type: 'perfectWin', titolo: '💎 Vittorie perfette' },
        { type: 'winInstantly', titolo: '🧩 Vittorie alternative' },
        { type: 'completeTournament', titolo: '🏟️ Tornei' },
        { type: 'winMillenniumItem', titolo: '🔱 Oggetti del Millennio' }
    ];

    function ordinaInGruppi(challenges) {
        const gruppi = [];
        const usate = new Set();
        GRUPPI.forEach((g) => {
            const voci = challenges.filter((c) => c.type === g.type);
            voci.forEach((c) => usate.add(c.id));
            if (voci.length > 0) gruppi.push({ titolo: g.titolo, voci: voci });
        });
        const avanzate = challenges.filter((c) => !usate.has(c.id));
        if (avanzate.length > 0) gruppi.push({ titolo: '🎯 Altre sfide', voci: avanzate });
        return gruppi;
    }

    // ================================================================
    // Le quattro sezioni
    // ================================================================
    let sezioneAttiva = 'giornaliere';

    /** "2h 14m" — quanto manca al prossimo cambio, senza i secondi che ballerebbero. */
    function formattaAttesa(ms) {
        const totMin = Math.max(0, Math.round(ms / 60000));
        const giorni = Math.floor(totMin / 1440);
        const ore = Math.floor((totMin % 1440) / 60);
        const min = totMin % 60;
        if (giorni > 0) return `${giorni}g ${ore}h`;
        if (ore > 0) return `${ore}h ${min}m`;
        return `${min}m`;
    }

    function renderRotazione() {
        const box = document.getElementById('rotazioneInfo');
        const testo = document.getElementById('rotazioneTesto');
        const avviso = document.getElementById('rotazioneAvviso');
        const aRotazione = sezioneAttiva === 'giornaliere' || sezioneAttiva === 'settimanali';
        box.hidden = !aRotazione;
        if (!aRotazione || !window.ServerDate) return;
        const ms = sezioneAttiva === 'giornaliere' ? ServerDate.msToNextDay() : ServerDate.msToNextWeek();
        testo.textContent = sezioneAttiva === 'giornaliere'
            ? `Nuove missioni fra ${formattaAttesa(ms)}`
            : `Nuove missioni settimanali fra ${formattaAttesa(ms)}`;
        // Lo si DICE quando l'orario non viene dal server, invece di
        // fingere che sia tutto a posto: è la stessa onestà che il Negozio
        // usa per le sue offerte a rotazione.
        avviso.hidden = ServerDate.isTrusted();
    }

    function renderChallenges() {
        renderRotazione();
        if (sezioneAttiva === 'giornaliere' || sezioneAttiva === 'settimanali') {
            renderMissioni(sezioneAttiva === 'giornaliere' ? 'daily' : 'weekly');
            return;
        }
        if (sezioneAttiva === 'storie') { renderStorie(); return; }

        const challenges = ChallengeTracker.getSezioni().generiche;
        const completedCount = challenges.filter((c) => c.completed).length;
        document.getElementById('progressSummaryLabel').textContent = 'Sfide completate';
        document.getElementById('progressSummaryValue').textContent = `${completedCount}/${challenges.length}`;

        const list = document.getElementById('challengeList');
        list.innerHTML = '';
        ordinaInGruppi(challenges).forEach((gruppo) => {
            const intestazione = document.createElement('div');
            intestazione.className = 'challenge-group';
            const completate = gruppo.voci.filter((c) => c.completed).length;
            // textContent e non innerHTML: qui non c'e' niente da
            // interpretare, e il titolo lo scrive questo file.
            intestazione.textContent = `${gruppo.titolo} · ${completate}/${gruppo.voci.length}`;
            list.appendChild(intestazione);
            gruppo.voci.forEach((challenge) => disegnaSfida(list, challenge));
        });
    }

    function disegnaSfida(list, challenge) {
        const percent = Math.round((challenge.count / challenge.target) * 100);
        const card = document.createElement('div');
        card.className = 'challenge-card' + (challenge.completed ? ' completed' : '');
        card.innerHTML = `
            <div class="challenge-icon">${challenge.icon || '🏆'}</div>
            <div class="challenge-body">
                <div class="challenge-name-row">
                    <span class="challenge-name">${challenge.label}</span>
                    ${challenge.completed ? '<span class="challenge-done-badge">✅ Completata</span>' : ''}
                </div>
                <div class="challenge-desc">${challenge.description}</div>
                <div class="challenge-progress-row">
                    <div class="challenge-bar"><div class="challenge-bar-fill" style="width:${percent}%;"></div></div>
                    <div class="challenge-progress-text">${challenge.count}/${challenge.target}</div>
                </div>
                ${premiHtml(challenge)}
            </div>
        `;
        list.appendChild(card);
    }

    /** Le missioni del periodo: stessa scheda delle Sfide, altro elenco. */
    function renderMissioni(ambito) {
        const missioni = ChallengeTracker.getMissions(ambito);
        const fatte = missioni.filter((m) => m.completed).length;
        document.getElementById('progressSummaryLabel').textContent =
            ambito === 'daily' ? 'Missioni di oggi' : 'Missioni della settimana';
        document.getElementById('progressSummaryValue').textContent = `${fatte}/${missioni.length}`;

        const list = document.getElementById('challengeList');
        list.innerHTML = '';
        if (missioni.length === 0) {
            const vuoto = document.createElement('div');
            vuoto.className = 'challenge-group';
            vuoto.textContent = 'Nessuna missione disponibile.';
            list.appendChild(vuoto);
            return;
        }
        missioni.forEach((m) => disegnaSfida(list, m));
    }

    /** Una sezione per campagna, nell'ordine in cui le storie si giocano. */
    function renderStorie() {
        const perStoria = ChallengeTracker.getSezioni().storie;
        const campagne = (typeof storyCampaignsDatabase !== 'undefined') ? storyCampaignsDatabase : [];
        const list = document.getElementById('challengeList');
        list.innerHTML = '';

        let totali = 0;
        let fatte = 0;
        // L'ordine è quello del catalogo delle campagne, non quello delle
        // chiavi dell'oggetto: le storie hanno una successione voluta, e
        // mostrarle in ordine di inserimento sarebbe casuale.
        const ordinate = campagne.length
            ? campagne.map((c) => c.id).filter((id) => perStoria[id])
            : Object.keys(perStoria);
        ordinate.forEach((id) => {
            const voci = perStoria[id];
            const campagna = campagne.find((c) => c.id === id);
            const completate = voci.filter((c) => c.completed).length;
            totali += voci.length;
            fatte += completate;
            const intestazione = document.createElement('div');
            intestazione.className = 'challenge-group';
            intestazione.textContent = `${(campagna && campagna.icona) || '📖'} ${(campagna && campagna.nome) || id} · ${completate}/${voci.length}`;
            list.appendChild(intestazione);
            voci.forEach((c) => disegnaSfida(list, c));
        });

        document.getElementById('progressSummaryLabel').textContent = 'Sfide delle storie';
        document.getElementById('progressSummaryValue').textContent = `${fatte}/${totali}`;
    }

    document.getElementById('sezioniTabs').addEventListener('click', (e) => {
        const tab = e.target.closest('.sezione-tab');
        if (!tab) return;
        sezioneAttiva = tab.dataset.sezione;
        document.querySelectorAll('.sezione-tab').forEach((b) => b.classList.toggle('is-attiva', b === tab));
        if (window.NativeHaptics) NativeHaptics.light();
        renderChallenges();
    });

    // La rotazione si appoggia all'orario del SERVER: si chiede subito, e
    // si ridisegna quando la risposta arriva — prima di allora la pagina
    // mostra comunque qualcosa, usando l'orologio locale e dicendolo.
    renderChallenges();
    if (window.ServerDate) ServerDate.sync().then(renderChallenges);
</script>
</body>
</html>
