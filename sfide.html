<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Opt-in STATICO alla View Transitions API — deve stare qui, non iniettato via JS in ritardo (vedi js/audio/audio-manager.js per la storia completa del bug che questo risolve). -->
<style>@view-transition { navigation: auto; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<!-- Sfondo scuro applicato SUBITO, prima che gli script auth-gate/supabase
     sotto finiscano di scaricare (bloccanti) — evita un flash bianco
     prima del nero dell'overlay di auth-gate.js, vedi il commento
     completo in cartoteca.html dove è stato diagnosticato. -->
<style>html, body { background: #0b0d14; }</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel Arena">
<script src="js/ui/error-recovery.js"></script>
<!-- Accesso obbligatorio (js/cloud/auth-gate.js) — vedi il commento lì:
     rimanda a index.html se non c'è una sessione approvata. -->
<script src="js/vendor/supabase.min.js"></script>
<script src="js/cloud/supabase-config.js"></script>
<script src="js/cloud/cloud-sync.js"></script>
<script src="js/cloud/auto-sync.js"></script>
<script src="js/cloud/auth-gate.js"></script>
<script src="js/pwa-register.js"></script>
<link rel="stylesheet" href="js/ui/page-loader.css">
<link rel="preload" href="audio/soundtracks/56. Battle for the Millennium.mp3" as="audio">
<link rel="stylesheet" href="js/ui/topbar.css">
<!-- Ritratto del giocatore in fondo alla topbar: lo monta PageTopbar. -->
<link rel="stylesheet" href="js/ui/deck-switcher.css">
<link rel="stylesheet" href="js/ui/challenge-banner.css">
<!-- La schermata vera e propria: è un componente condiviso con la vista
     Sfide del menu (index.html). Vedi js/ui/sfide-view.js. -->
<link rel="stylesheet" href="js/ui/sfide-view.css">
<title>Yu-Gi-Oh! Duel Arena — Sfide</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Niente selezione di testo/pressione lunga sul contenuto del gioco (nomi
       carte, personaggi, pulsanti...): su mobile un tocco prolungato apriva
       il menu di sistema "Cerca su Google"/copia invece di far scattare
       l'interazione del gioco. input/textarea/select restano selezionabili
       normalmente, altrimenti non si potrebbe più scrivere nei campi.
       -webkit-tap-highlight-color: via anche il rettangolo azzurrino che
       il browser mobile dipinge sopra QUALUNQUE elemento toccato —
       segnalato dall'utente tenendo premuto. Non toglie alcun riscontro
       al tocco: i pulsanti del gioco hanno il proprio stato ":active",
       che quel rettangolo si limitava a coprire con un colore di sistema
       estraneo alla tavolozza. Il contorno di messa a fuoco da tastiera
       resta intatto: quello NON passa da questa proprietà.
       overscroll-behavior: niente rimbalzo elastico quando si trascina
       la pagina oltre il bordo, e niente "tira per ricaricare" — su una
       pagina di gioco quel gesto e' a un dito di distanza dal ricaricare
       tutto a meta' duello. */
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overscroll-behavior-y: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { min-height: 100%; }
    /* Lo sfondo è della PAGINA; la schermata (griglia, schede, dettaglio)
       è del componente e ha il suo stile in js/ui/sfide-view.css. */
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/ra.jpg') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.6) 0%, rgba(6,7,12,0.72) 60%, rgba(4,5,8,0.85) 100%);
        pointer-events: none;
    }
</style>
</head>
<body>
    <script src="js/ui/page-loader.js"></script>
    <div id="topbarMount"></div>

    <main id="sfideMount"></main>

<script src="js/save-manager.js"></script>
<!-- rewards.js DOPO save-manager.js (da cui dipende) e PRIMA del tracker:
     è lui che accredita il premio di una Sfida completata, ed è l'unico
     punto del gioco autorizzato a toccare le valute. Senza, la schermata
     mostrerebbe le Sfide ma non saprebbe dire cosa danno. -->
<script src="js/economy/card-acquisition.js"></script>
<script src="js/economy/rewards.js"></script>
<script src="js/data/challenges-db.js"></script>
<!-- Il pool delle missioni a rotazione, e il catalogo delle campagne: la
     prima sezione ne ha bisogno per sorteggiarle, l'ultima per dare a
     ogni gruppo il nome e l'icona della sua storia invece dell'id. -->
<script src="js/data/missions-db.js"></script>
<script src="js/data/story-campaigns.js"></script>
<!-- I ritocchi dell'Editor Mappa (js/story/story-ritocchi.js): subito dopo il catalogo. -->
<script src="js/data/story-ritocchi.js"></script>
<script src="js/story/story-ritocchi.js"></script>
<!-- L'orario del SERVER decide quali missioni sono di oggi e di questa
     settimana: senza, basterebbe spostare l'ora del telefono per farne
     comparire di nuove (vedi js/cloud/server-date.js). -->
<script src="js/cloud/server-date.js"></script>
<script src="js/challenges/challenge-tracker.js"></script>
<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/deck-switcher.js"></script>
<script src="js/ui/topbar.js"></script>
<script src="js/ui/challenge-banner.js"></script>
<script src="js/ui/sfide-view.js"></script>
<script>
    PageTopbar.render('#topbarMount', { icon: 'tournament', title: 'Sfide' });

    // Colonna sonora condivisa tra le pagine, come nelle altre schermate
    // fuori dal duello vero e proprio (vedi commento in index.html).
    initAudioManager();
    Icons.hydrate();

    SfideView.mount('#sfideMount');
</script>
</body>
</html>
