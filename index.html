<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel Arena">
<script src="js/pwa-register.js"></script>
<title>Yu-Gi-Oh! Duel Arena — Menu</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/backgroundMainMenu.png') center/cover no-repeat;
        position: relative;
    }

    /* ============================================================
       Sfondo atmosferico: velo scuro + bagliore pulsante + raggi lenti
       ============================================================ */
    .menu-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
    }
    .menu-bg::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(5,6,10,0.55) 0%, rgba(5,6,10,0.86) 68%, rgba(4,5,8,0.96) 100%);
    }
    .menu-bg-flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 38%, rgba(243,156,18,0.20), transparent 60%);
        animation: menuFlashPulse 6s ease-in-out infinite;
    }
    @keyframes menuFlashPulse {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
    }
    .menu-bg-rays {
        position: absolute;
        inset: -35%;
        background: repeating-conic-gradient(from 0deg, rgba(247,215,116,0.05) 0deg 4deg, transparent 4deg 14deg);
        animation: menuRaysSpin 70s linear infinite;
        mix-blend-mode: screen;
    }
    @keyframes menuRaysSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }
    .menu-particles {
        position: absolute;
        inset: 0;
        overflow: hidden;
    }
    .menu-particle {
        position: absolute;
        bottom: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff8df 0%, #f7d774 55%, transparent 78%);
        opacity: 0;
        animation-name: menuParticleRise;
        animation-timing-function: ease-in;
        animation-iteration-count: infinite;
    }
    @keyframes menuParticleRise {
        0%   { transform: translateY(0) scale(1); opacity: 0; }
        10%  { opacity: 0.9; }
        88%  { opacity: 0.45; }
        100% { transform: translateY(-108vh) scale(0.4); opacity: 0; }
    }

    /* ============================================================
       Contenuto del menu
       ============================================================ */
    .menu-shell {
        position: relative;
        z-index: 2;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 3.5vh, 34px);
        padding: 16px;
    }

    .menu-logo {
        text-align: center;
    }
    .menu-logo-eyecatch {
        font-size: clamp(1.3rem, 2.6vh, 1.9rem);
        color: #f7d774;
        text-shadow: 0 0 24px rgba(247,215,116,0.8);
        animation: menuEyecatchPulse 2.4s ease-in-out infinite;
    }
    @keyframes menuEyecatchPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50%      { opacity: 1; transform: scale(1.18); }
    }
    .menu-title {
        margin-top: 4px;
        line-height: 1;
    }
    .menu-title-line1 {
        display: block;
        font-size: clamp(1rem, 2vh, 1.5rem);
        font-weight: 700;
        letter-spacing: 0.5em;
        color: #dfe7f7;
        text-shadow: 0 0 12px rgba(125,211,252,0.5);
    }
    .menu-title-line2 {
        display: block;
        margin-top: 6px;
        font-size: clamp(2.4rem, 6vh, 4rem);
        font-weight: 900;
        letter-spacing: 0.1em;
        background: linear-gradient(180deg, #fff6dc 0%, #f7d774 35%, #f39c12 68%, #c9770a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 40px rgba(243,156,18,0.5);
    }
    .menu-subtitle {
        margin-top: clamp(6px, 1.4vh, 12px);
        font-size: clamp(0.7rem, 1.4vh, 0.95rem);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #7dd3fc;
        text-shadow: 0 0 10px rgba(125,211,252,0.5);
    }

    .menu-list {
        display: flex;
        flex-direction: column;
        gap: clamp(8px, 1.4vh, 12px);
        width: min(92vw, 420px);
    }
    .menu-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: clamp(10px, 1.8vh, 14px) 20px;
        border-radius: 10px;
        border: 1px solid rgba(247,215,116,0.25);
        background: linear-gradient(135deg, rgba(20,20,30,0.75), rgba(35,30,20,0.55));
        color: #eef2fb;
        font-size: clamp(0.9rem, 1.9vh, 1.05rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .menu-item:hover {
        transform: translateX(6px);
        border-color: rgba(247,215,116,0.65);
        box-shadow: 0 0 24px rgba(243,156,18,0.35);
        background: linear-gradient(135deg, rgba(40,32,20,0.85), rgba(55,42,20,0.65));
    }
    .menu-item-icon {
        font-size: 1.25rem;
        filter: drop-shadow(0 0 6px rgba(243,156,18,0.5));
    }
    .menu-item-label { flex: 1; }
    .menu-item-arrow {
        opacity: 0.6;
        font-size: 1.3rem;
        transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .menu-item:hover .menu-item-arrow {
        transform: translateX(4px);
        opacity: 1;
    }
    .menu-item-tag {
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9aa5bd;
        background: rgba(255,255,255,0.08);
        padding: 3px 8px;
        border-radius: 999px;
        white-space: nowrap;
    }

    .menu-item--active {
        border-color: rgba(247,215,116,0.65);
        background: linear-gradient(135deg, rgba(58,40,10,0.85), rgba(80,52,10,0.65));
        animation: menuActivePulse 2.4s ease-in-out infinite;
    }
    @keyframes menuActivePulse {
        0%, 100% { box-shadow: 0 0 22px rgba(243,156,18,0.28); }
        50%      { box-shadow: 0 0 36px rgba(243,156,18,0.55); }
    }

    .menu-item--exit {
        border-color: rgba(231,76,60,0.3);
        margin-top: 4px;
    }
    .menu-item--exit:hover {
        border-color: rgba(231,76,60,0.75);
        box-shadow: 0 0 24px rgba(231,76,60,0.35);
        background: linear-gradient(135deg, rgba(50,18,15,0.85), rgba(60,20,15,0.6));
    }

    .menu-footer {
        position: absolute;
        bottom: clamp(10px, 2vh, 18px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.72rem;
        letter-spacing: 0.15em;
        color: rgba(255,255,255,0.35);
        text-transform: uppercase;
        z-index: 2;
    }


    /* ============================================================
       Toast "in arrivo"
       ============================================================ */
    .menu-toast {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translate(-50%, 16px);
        z-index: 20;
        padding: 12px 22px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(20,20,30,0.96), rgba(35,30,20,0.94));
        border: 1px solid rgba(247,215,116,0.45);
        box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        font-weight: 700;
        font-size: 0.9rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
        white-space: nowrap;
    }
    .menu-toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }

    /* ============================================================
       Modale conferma uscita
       ============================================================ */
    .menu-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
    }
    .menu-modal-backdrop.open { display: flex; }
    .menu-modal-card {
        background: linear-gradient(145deg, #1f2a44, #304060);
        border: 2px solid #f39c12;
        border-radius: 20px;
        width: min(92vw, 380px);
        padding: 24px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .menu-modal-card h3 { margin-bottom: 10px; font-size: 1.25rem; }
    .menu-modal-card p { color: #dbe6ff; margin-bottom: 16px; }
    .menu-modal-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .menu-modal-btn {
        border: none;
        border-radius: 999px;
        padding: 12px 20px;
        font-weight: 700;
        color: white;
        cursor: pointer;
        min-width: 120px;
        font-family: inherit;
        font-size: 0.95rem;
        transition: transform 0.2s ease;
    }
    .menu-modal-btn:hover { transform: translateY(-2px); }
    .menu-modal-btn.confirm { background: linear-gradient(145deg, #e74c3c, #c0392b); }
    .menu-modal-btn.cancel { background: linear-gradient(145deg, #7f8c8d, #5d6d6e); }

    /* ============================================================
       Input di testo dentro i modali (nome giocatore)
       ============================================================ */
    .menu-name-input {
        width: 100%;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.08);
        color: #fff;
        font-family: inherit;
        font-size: 0.95rem;
        margin-bottom: 16px;
        outline: none;
    }
    .menu-name-input:focus { border-color: #f39c12; }

    /* ============================================================
       Schermi bassi (telefono in orizzontale — l'orientamento che il
       duello stesso forza, quindi molto probabile arrivarci già
       ruotati): con .menu-shell a height:100vh e contenuto centrato,
       un'altezza di ~350-450px non basta per titolo + 7 voci di menu +
       footer, e siccome body ha overflow:hidden il fondo (Impostazioni,
       Esci) restava semplicemente irraggiungibile, tagliato fuori dallo
       schermo. Qui si comprime tutto E si aggiunge uno scroll di
       sicurezza, così anche se qualcosa non entra resta comunque
       raggiungibile invece di sparire.
       ============================================================ */
    @media (max-height: 500px) {
        body { overflow-y: auto; overflow-x: hidden; }
        .menu-shell {
            height: auto;
            min-height: 100%;
            justify-content: flex-start;
            gap: 4px;
            padding: 10px 16px 18px;
        }
        .menu-logo-eyecatch { font-size: 1rem; }
        .menu-title-line1 { font-size: 0.7rem; letter-spacing: 0.4em; }
        .menu-title-line2 { font-size: clamp(1.4rem, 5vh, 2.2rem); }
        .menu-subtitle { margin-top: 4px; font-size: 0.6rem; }
        .menu-list { gap: 5px; }
        .menu-item { padding: 6px 14px; font-size: 0.78rem; gap: 10px; }
        .menu-item-icon { font-size: 1rem; }
        .menu-item-arrow { font-size: 1rem; }
        .menu-footer { position: static; margin-top: 10px; transform: none; }
    }
</style>
</head>
<body>
    <!--
        Colonna sonora condivisa tra le pagine (audio/soundtracks/mainTheme.mp3
        in loop), gestita da js/audio-manager.js per restare in continuità
        anche navigando tra menu, Cartoteca, Duello Libero, ecc. Il controllo
        mute/volume vive solo in impostazioni.html, non su ogni pagina.
    -->

    <div class="menu-bg">
        <div class="menu-bg-flash"></div>
        <div class="menu-bg-rays"></div>
        <div class="menu-particles" id="menuParticles"></div>
    </div>

    <div class="menu-shell">
        <div class="menu-logo">
            <div class="menu-logo-eyecatch">✦</div>
            <h1 class="menu-title">
                <span class="menu-title-line1">YU-GI-OH!</span>
                <span class="menu-title-line2">DUEL ARENA</span>
            </h1>
            <p class="menu-subtitle">Battle for the Millennium</p>
        </div>

        <!-- Popolata dinamicamente da renderMenu(): menu ridotto (Nuova
             Partita/Impostazioni/Esci) se non esiste ancora un salvataggio,
             menu completo altrimenti — vedi js/save-manager.js. -->
        <nav class="menu-list" id="menuList"></nav>

        <div class="menu-footer">1.0.0-beta.2</div>
    </div>

    <div class="menu-toast" id="menuToast"></div>

    <div class="menu-modal-backdrop" id="exitModal">
        <div class="menu-modal-card">
            <h3>🚪 Uscire dal gioco?</h3>
            <p>Stai per lasciare Duel Arena.</p>
            <div class="menu-modal-actions">
                <button class="menu-modal-btn confirm" id="exitConfirmBtn">Sì, esci</button>
                <button class="menu-modal-btn cancel" id="exitCancelBtn">Annulla</button>
            </div>
        </div>
    </div>

    <!-- Primo avvio senza salvataggio: crea il salvataggio con il nome
         del giocatore, poi il menu si aggiorna da solo (renderMenu()). -->
    <div class="menu-modal-backdrop" id="newGameModal">
        <div class="menu-modal-card">
            <h3>✨ Nuova Partita</h3>
            <p>Come ti chiami, Duellante?</p>
            <input type="text" id="newGameNameInput" class="menu-name-input" placeholder="Il tuo nome" maxlength="24">
            <div class="menu-modal-actions">
                <button class="menu-modal-btn confirm" id="newGameConfirmBtn">Inizia</button>
                <button class="menu-modal-btn cancel" id="newGameCancelBtn">Annulla</button>
            </div>
        </div>
    </div>

    <script src="js/audio-manager.js"></script>
    <script src="js/save-manager.js"></script>
    <script src="js/characters-db.js"></script>
    <script>
        // Particelle luminose fluttuanti sullo sfondo del menu
        (function initMenuParticles() {
            const container = document.getElementById('menuParticles');
            const count = 26;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'menu-particle';
                const size = 2 + Math.random() * 3;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}%`;
                const duration = 9 + Math.random() * 10;
                p.style.animationDuration = `${duration}s`;
                p.style.animationDelay = `-${Math.random() * duration}s`;
                container.appendChild(p);
            }
        })();

        // ============================================================
        // Musica di sottofondo (condivisa tra le pagine, vedi js/audio-manager.js)
        // ============================================================
        initAudioManager();

        let toastTimeout = null;
        function showMenuToast(text) {
            const toast = document.getElementById('menuToast');
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function openExitModal() {
            document.getElementById('exitModal').classList.add('open');
        }
        function closeExitModal() {
            document.getElementById('exitModal').classList.remove('open');
        }

        // ============================================================
        // Menu dinamico: ridotto (Nuova Partita/Impostazioni/Esci) senza
        // un salvataggio, completo (con Profilo, senza più Duello Demo)
        // appena ne esiste uno — vedi js/save-manager.js.
        // ============================================================
        const IMPOSTAZIONI_ITEM = { icon: '⚙️', label: 'Impostazioni', action: 'link', href: 'impostazioni.html' };
        const ESCI_ITEM = { icon: '🚪', label: 'Esci', action: 'exit', extraClass: 'menu-item--exit' };
        const FULL_MENU_ITEMS = [
            { icon: '🎴', label: 'Duello Libero', action: 'link', href: 'duello-libero.html' },
            { icon: '🌐', label: 'Multiplayer', action: 'link', href: 'multiplayer.html' },
            { icon: '🛠️', label: 'Creazione Deck', action: 'link', href: 'creazione-deck.html' },
            { icon: '📖', label: 'Cartoteca', action: 'link', href: 'cartoteca.html' },
            { icon: '🏪', label: 'Negozio', action: 'link', href: 'negozio.html' },
            { icon: '🏆', label: 'Tornei', action: 'link', href: 'tornei.html' },
            { icon: '🧑', label: 'Profilo', action: 'link', href: 'profilo.html' },
            { icon: '📜', label: 'Regole', action: 'link', href: 'regole.html' },
            IMPOSTAZIONI_ITEM,
            ESCI_ITEM
        ];
        const NEW_PLAYER_MENU_ITEMS = [
            { icon: '✨', label: 'Nuova Partita', action: 'newgame', extraClass: 'menu-item--active' },
            IMPOSTAZIONI_ITEM,
            ESCI_ITEM
        ];

        function buildMenuButton(item) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'menu-item' + (item.extraClass ? ' ' + item.extraClass : '');
            btn.innerHTML = `
                <span class="menu-item-icon">${item.icon}</span>
                <span class="menu-item-label">${item.label}</span>
                ${item.tag ? `<span class="menu-item-tag">${item.tag}</span>` : '<span class="menu-item-arrow">›</span>'}
            `;
            btn.addEventListener('click', () => handleMenuAction(item));
            return btn;
        }

        function handleMenuAction(item) {
            if (item.action === 'link') {
                window.location.href = item.href;
            } else if (item.action === 'soon') {
                showMenuToast(`🔒 ${item.dataLabel}: funzionalità in arrivo!`);
            } else if (item.action === 'exit') {
                openExitModal();
            } else if (item.action === 'newgame') {
                openNewGameModal();
            }
        }

        function renderMenu() {
            const list = document.getElementById('menuList');
            list.innerHTML = '';
            const items = (window.SaveManager && SaveManager.hasSave()) ? FULL_MENU_ITEMS : NEW_PLAYER_MENU_ITEMS;
            items.forEach((item) => list.appendChild(buildMenuButton(item)));
        }
        renderMenu();

        // ============================================================
        // Nuova Partita: crea il salvataggio (nome + deck iniziale), poi
        // il menu si aggiorna da solo nella versione completa.
        // ============================================================
        function openNewGameModal() {
            const input = document.getElementById('newGameNameInput');
            input.value = '';
            document.getElementById('newGameModal').classList.add('open');
            input.focus();
        }
        function closeNewGameModal() {
            document.getElementById('newGameModal').classList.remove('open');
        }
        function confirmNewGame() {
            const name = document.getElementById('newGameNameInput').value;
            SaveManager.createNew(name);
            closeNewGameModal();
            renderMenu();
            showMenuToast(`👋 Benvenuto, ${SaveManager.getPlayerName()}!`);
        }
        document.getElementById('newGameConfirmBtn').onclick = confirmNewGame;
        document.getElementById('newGameCancelBtn').onclick = closeNewGameModal;
        document.getElementById('newGameNameInput').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') confirmNewGame();
        });
        document.getElementById('newGameModal').addEventListener('click', (event) => {
            if (event.target.id === 'newGameModal') closeNewGameModal();
        });

        // Il Profilo (nome, deck, record, esporta/importa salvataggio) ora
        // vive in una pagina dedicata, profilo.html, come Cartoteca e
        // Creazione Deck — non più in un modale qui.

        document.getElementById('exitCancelBtn').onclick = closeExitModal;
        document.getElementById('exitConfirmBtn').onclick = () => {
            window.close();
            // Se il browser blocca la chiusura (scheda non aperta via script),
            // avvisiamo l'utente con un messaggio invece di lasciare il modale bloccato.
            setTimeout(() => {
                closeExitModal();
                showMenuToast('Puoi chiudere questa scheda per uscire dal gioco.');
            }, 250);
        };
        document.getElementById('exitModal').addEventListener('click', (event) => {
            if (event.target.id === 'exitModal') closeExitModal();
        });
    </script>
</body>
</html>
