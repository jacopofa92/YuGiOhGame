name: Test suite

# La suite in tests/ (Playwright, npm test) esisteva solo come comando
# manuale: nessuna pipeline la eseguiva mai da sola, quindi una modifica
# che rompe qualcosa poteva restare invisibile finché qualcuno non
# rilancia i test a mano. Questo job la esegue automaticamente ad ogni
# push/PR su main, così un fallimento appare direttamente su GitHub.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Controllo di sintassi: gira PRIMA della suite, e in pochi secondi.
  # Un errore di sintassi in un file .js non rompe una funzione, rompe
  # l'intero file e con lui ogni pagina che lo carica — e la suite
  # Playwright impiegherebbe ~8 minuti per dire soltanto che tutto è
  # rotto, con un messaggio criptico. Vedi scripts/check-syntax.js per
  # il guasto reale che ha reso evidente questo bisogno.
  # Nessuna dipendenza da installare: usa solo `node --check`.
  sintassi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Controlla la sintassi di tutti i file .js
        run: npm run check

  test:
    runs-on: ubuntu-latest
    # Se la sintassi è rotta la suite non può che fallire: inutile
    # accendere un browser e aspettare otto minuti per scoprirlo.
    needs: sintassi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installa dipendenze (solo per la suite di test — il gioco non ne ha bisogno)
        run: npm ci
      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium
      - name: Esegue la suite di regressione
        run: npm test
