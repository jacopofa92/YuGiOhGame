<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel Arena">
<script src="js/ui/error-recovery.js"></script>
<script src="js/pwa-register.js"></script>
<link rel="preload" href="audio/soundtracks/mainTheme.mp3" as="audio">
<link rel="stylesheet" href="js/ui/topbar.css">
<title>Yu-Gi-Oh! Duel Arena — Regno dei Duellanti</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { min-height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/ra.jpg') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.65) 0%, rgba(6,7,12,0.78) 60%, rgba(4,5,8,0.9) 100%);
        pointer-events: none;
    }

    :root {
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --ink: #cdd6ea;
        --ink-dim: #9aa5bd;
        --bad: #e74c3c;
        --good: #2ecc71;
    }

    .main {
        position: relative;
        z-index: 1;
        padding: 20px 18px 60px;
        max-width: 760px;
        margin: 0 auto;
    }

    /* --- Barra Stelle, sempre visibile una volta iniziato il torneo --- */
    .stars-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 1.3rem;
        font-weight: 900;
        color: var(--gold);
        text-shadow: 0 0 16px rgba(247,215,116,0.5);
        margin-bottom: 8px;
    }
    .stars-bar .stars-count { font-size: 1.6rem; }
    .stars-hint {
        text-align: center;
        color: var(--ink-dim);
        font-size: 0.78rem;
        margin-bottom: 20px;
    }

    /* =====================================================================
       MAPPA — sostituisce le vecchie "card" testuali dei percorsi: una
       vera mappa a scorrimento verticale (stile "isola vista dall'alto",
       terreno boschivo simulato in puro CSS con gradienti radiali
       ripetuti — nessuna immagine reale necessaria) con un sentiero di
       pallini collegati da linee (SVG), esattamente come descritto:
       "muoversi in una mappa... percorsi (linee)... pallini (sfidanti,
       premi, malus)". Cresce verso il basso man mano che si avanza (il
       viewport scorre da solo fino in fondo ad ogni render) invece di
       essere un elenco di card usa-e-getta.
       ===================================================================== */
    .map-viewport {
        position: relative;
        width: 100%;
        height: 420px;
        margin-bottom: 20px;
        border-radius: 18px;
        border: 2px solid rgba(247,215,116,0.28);
        box-shadow: 0 16px 40px rgba(0,0,0,0.4), inset 0 0 60px rgba(0,0,0,0.5);
        overflow-y: auto;
        overflow-x: hidden;
        /* "Terreno boschivo dall'alto": due toni di verde a chiazze
           irregolari (le "chiome" degli alberi viste dall'alto) sopra un
           verde-terra di base — puro CSS, nessuna immagine. */
        background-color: #1f2e1a;
        background-image:
            radial-gradient(circle at 15% 20%, rgba(30,58,26,0.9) 0%, transparent 40%),
            radial-gradient(circle at 70% 10%, rgba(38,66,30,0.85) 0%, transparent 35%),
            radial-gradient(circle at 40% 45%, rgba(22,44,20,0.9) 0%, transparent 38%),
            radial-gradient(circle at 85% 55%, rgba(35,60,28,0.85) 0%, transparent 42%),
            radial-gradient(circle at 10% 75%, rgba(28,50,24,0.9) 0%, transparent 36%),
            radial-gradient(circle at 60% 85%, rgba(40,68,32,0.85) 0%, transparent 40%),
            radial-gradient(circle at 90% 95%, rgba(24,46,20,0.9) 0%, transparent 38%),
            linear-gradient(180deg, rgba(6,7,12,0.35) 0%, rgba(6,7,12,0.55) 100%);
        background-size: 340px 340px, 300px 300px, 320px 320px, 280px 280px, 300px 300px, 320px 320px, 300px 300px, 100% 100%;
    }
    .map-canvas { position: relative; width: 100%; }
    .map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 74px;
    }
    .map-node-dot {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        background: linear-gradient(150deg, rgba(40,32,20,0.92), rgba(18,16,22,0.95));
        border: 2px solid rgba(255,255,255,0.25);
        box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }
    .map-node-label {
        font-size: 0.62rem;
        font-weight: 800;
        color: var(--ink-dim);
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        text-align: center;
        white-space: nowrap;
    }
    .map-node.start .map-node-dot { border-color: rgba(247,215,116,0.6); }
    .map-node.win .map-node-dot { border-color: rgba(46,204,113,0.7); background: linear-gradient(150deg, rgba(20,50,28,0.92), rgba(15,30,20,0.95)); }
    .map-node.lose .map-node-dot { border-color: rgba(231,76,60,0.7); background: linear-gradient(150deg, rgba(55,20,20,0.92), rgba(30,15,15,0.95)); }
    .map-node.prize .map-node-dot { border-color: rgba(247,215,116,0.7); background: linear-gradient(150deg, rgba(55,45,15,0.92), rgba(30,25,10,0.95)); }
    .map-node.malus .map-node-dot { border-color: rgba(180,120,60,0.7); background: linear-gradient(150deg, rgba(45,30,15,0.92), rgba(25,18,10,0.95)); }
    .map-node.current .map-node-dot {
        width: 52px; height: 52px;
        border-color: var(--gold-strong);
        box-shadow: 0 0 0 6px rgba(243,156,18,0.22), 0 6px 20px rgba(0,0,0,0.6);
        animation: mapCurrentPulse 1800ms ease-in-out infinite;
    }
    @keyframes mapCurrentPulse {
        0%, 100% { box-shadow: 0 0 0 6px rgba(243,156,18,0.22), 0 6px 20px rgba(0,0,0,0.6); }
        50% { box-shadow: 0 0 0 10px rgba(243,156,18,0.1), 0 6px 20px rgba(0,0,0,0.6); }
    }
    .map-node.choice {
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
        color: inherit;
    }
    .map-node.choice .map-node-dot {
        border-style: dashed;
        border-color: rgba(255,255,255,0.4);
        animation: mapChoiceBeckon 1400ms ease-in-out infinite;
    }
    @keyframes mapChoiceBeckon {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
    .map-node.choice.castle .map-node-dot { border-color: rgba(155, 89, 182, 0.7); }
    .map-node.choice:hover .map-node-dot { border-color: var(--gold); }
    .map-line {
        stroke: rgba(255,255,255,0.32);
        stroke-width: 3;
        stroke-dasharray: 2 8;
        stroke-linecap: round;
        fill: none;
    }
    .map-line.choice-line { stroke: rgba(247,215,116,0.55); }

    /* --- Schermata centrale generica (inizio/eliminazione/castello) --- */
    .center-panel {
        text-align: center;
        background: linear-gradient(150deg, rgba(40,32,20,0.82), rgba(18,16,22,0.86));
        border: 2px solid rgba(247,215,116,0.28);
        border-radius: 18px;
        padding: 34px 24px;
        box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .center-panel .cp-icon { font-size: 3rem; margin-bottom: 14px; }
    .center-panel h2 { font-size: 1.3rem; margin-bottom: 10px; color: var(--gold); }
    .center-panel p { color: var(--ink); font-size: 0.92rem; line-height: 1.6; margin-bottom: 22px; }

    .big-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 30px;
        border: none;
        border-radius: 12px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: 0.03em;
        cursor: pointer;
        color: #21160a;
        background: linear-gradient(145deg, #f7d774, #f39c12);
        box-shadow: 0 10px 26px rgba(243,156,18,0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .big-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(243,156,18,0.5); }
    .big-btn.secondary {
        color: #f2f6ff;
        background: linear-gradient(145deg, #4a5a72, #2f3b4d);
        box-shadow: 0 10px 26px rgba(0,0,0,0.4);
    }

    /* --- Toast di risultato (prize/malus/duello) --- */
    .result-toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 0);
        z-index: 500;
        max-width: min(92vw, 420px);
        background: linear-gradient(150deg, rgba(20,20,26,0.96), rgba(12,12,16,0.97));
        border: 1px solid rgba(247,215,116,0.4);
        border-radius: 14px;
        padding: 14px 18px;
        text-align: center;
        font-size: 0.9rem;
        box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        opacity: 0;
        transition: opacity 250ms ease, transform 250ms ease;
        pointer-events: none;
    }
    .result-toast.show { opacity: 1; transform: translate(-50%, -6px); }

    /* --- Modale di puntata --- */
    .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(4,5,8,0.78);
        padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
        width: 100%;
        max-width: 380px;
        background: linear-gradient(150deg, rgba(30,26,20,0.97), rgba(16,15,20,0.98));
        border: 2px solid rgba(247,215,116,0.35);
        border-radius: 18px;
        padding: 26px 22px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    }
    .modal-card .opponent-portrait {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        margin: 0 auto 12px;
        background: linear-gradient(150deg, #3a2f22, #1c1620);
        border: 2px solid rgba(247,215,116,0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        overflow: hidden;
        position: relative;
    }
    .modal-card .opponent-portrait img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.25s ease;
    }
    .modal-card .opponent-portrait.has-image img { opacity: 1; }
    .modal-card h3 { font-size: 1.1rem; margin-bottom: 4px; color: #fff; }
    .modal-card .opponent-title { color: var(--ink-dim); font-size: 0.78rem; margin-bottom: 18px; }
    .wager-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
    }
    .wager-btn {
        flex: 1;
        padding: 12px 0;
        border-radius: 10px;
        border: 2px solid rgba(247,215,116,0.3);
        background: rgba(255,255,255,0.05);
        color: #fff;
        font-family: inherit;
        font-weight: 900;
        font-size: 1rem;
        cursor: pointer;
    }
    .wager-btn.selected { border-color: var(--gold-strong); background: rgba(243,156,18,0.22); color: var(--gold); }
    .wager-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-actions .big-btn { flex: 1; justify-content: center; }

    @media (max-width: 480px) {
        .main { padding: 14px 10px 40px; }
        .map-viewport { height: 360px; }
    }
</style>
</head>
<body>
    <div id="topbarMount"></div>

    <main class="main">
        <div class="stars-bar" id="starsBar" style="display:none;">
            <span>⭐</span><span class="stars-count" id="starsCount">0</span><span>Stelle</span>
        </div>
        <p class="stars-hint" id="starsHint" style="display:none;">Raccogli 10 Stelle per tentare l'accesso al Castello di Pegasus.</p>

        <div id="content"></div>
    </main>

    <div class="result-toast" id="resultToast"></div>

    <!-- Modale di puntata prima di un duello -->
    <div class="modal-backdrop" id="wagerModal">
        <div class="modal-card">
            <div class="opponent-portrait" id="wagerPortrait">🧑‍🎤</div>
            <h3 id="wagerName">—</h3>
            <div class="opponent-title" id="wagerTitle">—</div>
            <p style="color:var(--ink-dim); font-size:0.8rem; margin-bottom:12px;">Quante Stelle vuoi puntare?</p>
            <div class="wager-row" id="wagerRow">
                <button type="button" class="wager-btn" data-wager="2">2</button>
                <button type="button" class="wager-btn" data-wager="3">3</button>
                <button type="button" class="wager-btn" data-wager="5">5</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="big-btn secondary" id="wagerCancelBtn">Annulla</button>
                <button type="button" class="big-btn" id="wagerConfirmBtn">Sfida!</button>
            </div>
        </div>
    </div>

<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<script src="js/save-manager.js"></script>
<script src="js/data/characters-db.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/topbar.js"></script>
<script>
    PageTopbar.render('#topbarMount', { icon: 'tournament', title: 'Regno dei Duellanti', subtitle: 'Duelist Kingdom', backHref: 'tornei.html' });
    initAudioManager();
    Icons.hydrate();

    // ================================================================
    // Regno dei Duellanti — mappa a bivi generata "man mano" (non un
    // grafo intero precalcolato): ad ogni passo si offrono 2-3 percorsi
    // (o un 4° "verso il Castello" oltre le 10 Stelle), il TIPO di ogni
    // percorso resta nascosto finché non lo si sceglie. Stato persistito
    // in SaveManager.getTournamentState('duelistKingdom') — sopravvive a
    // chiusura app/ricarica pagina, esattamente come deck/record.
    // ================================================================
    const TOURNAMENT_ID = 'duelistKingdom';
    const STARTING_STARS = 2;
    const CASTLE_THRESHOLD = 10;
    const WAGER_OPTIONS = [2, 3, 5];
    // Solo i Duellanti del vero Regno dei Duellanti (Duelist Kingdom) —
    // MAI Kaiba o Pegasus, che compaiono solo tramite il percorso
    // speciale "verso il Castello" più sotto, mai come incontro casuale
    // prima di quella soglia (richiesta esplicita dell'utente).
    const ROSTER_IDS = ['rex', 'weevil', 'mako', 'panik', 'bonz', 'paradoxBrothers', 'mai', 'bandit_keith'];

    function getRosterCharacter(id) {
        return characterDatabase.find((c) => c.id === id);
    }

    function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    /** Stato di default per un torneo mai iniziato (in memoria finché non si preme "Inizia"). */
    function makeInitialState() {
        return {
            step: 0,
            pendingRoutes: null,
            pendingEncounter: null,
            history: [],
            castleReached: false,
            eliminated: false
        };
    }

    function loadState() {
        return SaveManager.getTournamentState(TOURNAMENT_ID);
    }
    function saveState(state) {
        SaveManager.setTournamentState(TOURNAMENT_ID, state);
    }

    function currentStars() {
        return SaveManager.getCurrency().starChips || 0;
    }
    /** Somma (o sottrae) Stelle, mai sotto zero — vedi SaveManager.addCurrency. */
    function addStars(amount) {
        return SaveManager.addCurrency('starChips', amount).starChips;
    }

    // ----------------------------------------------------------------
    // Generazione dei percorsi: 2 o 3 scelte, ciascuna 'opponent' (55%),
    // 'prize' (25%) o 'malus' (20%) — pesi scelti per rendere gli
    // incontri con un Duellante il caso più comune senza eliminare mai
    // del tutto la varietà. Nessun Duellante ripetuto nello stesso set
    // di scelte (mero polish, non una regola del gioco reale).
    // ----------------------------------------------------------------
    function rollRouteKind() {
        const r = Math.random();
        if (r < 0.55) return 'opponent';
        if (r < 0.80) return 'prize';
        return 'malus';
    }
    function generateRoutes(state) {
        const count = Math.random() < 0.5 ? 2 : 3;
        const usedCharacters = new Set();
        const routes = [];
        for (let i = 0; i < count; i++) {
            const kind = rollRouteKind();
            if (kind === 'opponent') {
                let pool = ROSTER_IDS.filter((id) => !usedCharacters.has(id));
                if (pool.length === 0) pool = ROSTER_IDS;
                const characterId = pickRandom(pool);
                usedCharacters.add(characterId);
                routes.push({ kind: 'opponent', characterId: characterId });
            } else if (kind === 'prize') {
                routes.push({ kind: 'prize', amount: 1 + Math.floor(Math.random() * 2) });
            } else {
                routes.push({ kind: 'malus', amount: 1 + Math.floor(Math.random() * 2) });
            }
        }
        // Oltre la soglia, il percorso verso il Castello resta SEMPRE
        // disponibile in aggiunta alle scelte normali (non le sostituisce):
        // il giocatore può continuare a raccogliere Stelle se preferisce.
        if (currentStars() >= CASTLE_THRESHOLD) {
            routes.push({ kind: 'castle' });
        }
        state.pendingRoutes = routes;
        saveState(state);
    }

    // ----------------------------------------------------------------
    // Render
    // ----------------------------------------------------------------
    const content = document.getElementById('content');
    const starsBar = document.getElementById('starsBar');
    const starsHint = document.getElementById('starsHint');

    function showToast(text) {
        const toast = document.getElementById('resultToast');
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function renderStartScreen() {
        starsBar.style.display = 'none';
        starsHint.style.display = 'none';
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">🏝️</div>
                <h2>Il Regno dei Duellanti ti aspetta</h2>
                <p>Parti con ${STARTING_STARS} Stelle dell'Esagono. Sfida i Duellanti dell'isola puntando le tue Stelle, raccogli premi ed evita le insidie del percorso — raggiungi ${CASTLE_THRESHOLD} Stelle per tentare l'accesso al Castello di Pegasus.</p>
                <button type="button" class="big-btn" id="startTournamentBtn">🚀 Inizia il Torneo</button>
            </div>
        `;
        document.getElementById('startTournamentBtn').onclick = () => {
            addStars(STARTING_STARS - currentStars());
            const state = makeInitialState();
            saveState(state);
            if (window.NativeHaptics) NativeHaptics.light();
            render();
        };
    }

    function renderEliminated() {
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">💀</div>
                <h2>Eliminato dal Torneo</h2>
                <p>Hai perso tutte le tue Stelle dell'Esagono: la tua avventura nel Regno dei Duellanti finisce qui, per questa volta.</p>
                <button type="button" class="big-btn" id="restartTournamentBtn">🔄 Ricomincia</button>
            </div>
        `;
        document.getElementById('restartTournamentBtn').onclick = () => {
            saveState(null);
            render();
        };
    }

    // Metadati di presentazione per ciascuna tappa del Castello — solo
    // testo/icone, la logica vera (avversario, ricompensa) vive in
    // resolvePendingEncounterIfDone/enterCastleBracket qui sopra.
    const CASTLE_STAGE_META = {
        semifinal: { icon: '🥊', title: 'Semifinale', reward: '10-15' },
        final: { icon: '🏆', title: 'Finale', reward: '10-15' }
    };

    function renderCastleStage(state) {
        starsHint.style.display = 'none';
        if (state.castleStage === 'champion') {
            content.innerHTML = `
                <div class="center-panel">
                    <div class="cp-icon">👑</div>
                    <h2>Campione del Regno dei Duellanti!</h2>
                    <p>Hai sconfitto Maximillion Pegasus in persona. Il premio finale del torneo verrà svelato più avanti.</p>
                    <button type="button" class="big-btn secondary" id="backToMenuBtn">Torna al menu</button>
                </div>
            `;
            document.getElementById('backToMenuBtn').onclick = () => { window.location.href = 'index.html'; };
            return;
        }
        if (state.castleStage === 'pegasus') {
            renderCastleChallenge(state, 'pegasus', {
                icon: '🏰',
                title: 'Il Duello Finale',
                intro: 'Hai superato la semifinale e la finale: solo Maximillion Pegasus si frappone tra te e la vittoria del torneo.',
                rewardText: '15 Stelle, e la vittoria del Regno dei Duellanti'
            });
            return;
        }
        const stage = state.castleStage === 'final' ? 'final' : 'semifinal';
        const opponentId = stage === 'final' ? state.castleFinalOpponent : state.castleSemifinalOpponent;
        const meta = CASTLE_STAGE_META[stage];
        renderCastleChallenge(state, opponentId, {
            icon: meta.icon,
            title: meta.title,
            intro: stage === 'semifinal'
                ? 'Sei entrato nel Castello di Pegasus: la semifinale ti attende contro un altro Duellante arrivato fin qui.'
                : 'Hai vinto la semifinale! Un solo Duellante ti separa dallo scontro con Pegasus.',
            rewardText: `${meta.reward} Stelle (a caso)`
        });
    }

    /** Schermata generica "sfida X" per una tappa del Castello (semifinale/finale/Pegasus) — nessuna puntata da scegliere, è vittoria-o-eliminazione. */
    function renderCastleChallenge(state, opponentId, meta) {
        const character = getRosterCharacter(opponentId);
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">${meta.icon}</div>
                <h2>${meta.title}: ${character ? character.name : 'Duellante'}</h2>
                <p>${meta.intro}<br><br>In palio: <strong>${meta.rewardText}</strong>.</p>
                <button type="button" class="big-btn" id="castleChallengeBtn">⚔️ Sfida!</button>
            </div>
        `;
        document.getElementById('castleChallengeBtn').onclick = () => {
            state.pendingEncounter = { characterId: opponentId, wager: 0, isKaibaGate: false, castleStage: state.castleStage };
            saveState(state);
            launchDuel(state.pendingEncounter);
        };
    }

    /** Un pendingEncounter esiste ma non è arrivato nessun esito di duello fresco per lui: probabilmente la pagina è stata ricaricata/l'app chiusa a metà duello. */
    function renderResumeEncounter(state) {
        const enc = state.pendingEncounter;
        const character = getRosterCharacter(enc.characterId);
        const stakeText = enc.castleStage ? 'una sfida ad eliminazione diretta' : `${enc.wager} Stelle in palio`;
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">⚔️</div>
                <h2>Duello in sospeso</h2>
                <p>Avevi una sfida in corso contro ${character ? character.name : 'un Duellante'} (${stakeText}). Riprendila per continuare.</p>
                <button type="button" class="big-btn" id="resumeDuelBtn">Riprendi la sfida</button>
            </div>
        `;
        document.getElementById('resumeDuelBtn').onclick = () => launchDuel(enc);
    }

    // ----------------------------------------------------------------
    // Mappa a nodi collegati — sostituisce le vecchie "card" di
    // percorso: il sentiero già fatto (state.history) resta visibile
    // come pallini collegati da linee, con i nuovi 2-3 (o 4 col
    // Castello) percorsi possibili che si diramano dal pallino "sei
    // qui" attuale. Coordinate in "unità mappa" (0-MAP_UNIT_WIDTH per
    // X, scalate dall'SVG alla larghezza reale del contenitore; pixel
    // veri per Y, uguali all'altezza reale del canvas) — vedi
    // computeMapLayout più sotto.
    // ----------------------------------------------------------------
    const MAP_UNIT_WIDTH = 400;
    const MAP_NODE_SPACING = 130;
    const MAP_CHOICE_SPACING = 150;
    const MAP_TOP_PADDING = 55;
    const MAP_BOTTOM_PADDING = 55;
    const ICON_FOR_KIND = { win: '⚔️', lose: '💀', prize: '🎁', malus: '⚠️', start: '🏝️' };

    /** Calcola la posizione (in unità mappa) di ogni pallino del sentiero già fatto + del pallino "sei qui" — SEMPRE le stesse ad ogni render (dipendono solo da state.history), cosa che tiene il sentiero stabile invece di "ballare" ad ogni ridisegno. */
    function computeHistoryPositions(state) {
        const positions = [{ x: MAP_UNIT_WIDTH / 2, y: MAP_TOP_PADDING, kind: 'start', label: "L'approdo sull'isola" }];
        state.history.forEach((entry, i) => {
            const offset = (i % 2 === 0 ? -1 : 1) * (MAP_UNIT_WIDTH * 0.16);
            positions.push({
                x: MAP_UNIT_WIDTH / 2 + offset,
                y: MAP_TOP_PADDING + (i + 1) * MAP_NODE_SPACING,
                kind: entry.kind,
                label: entry.label
            });
        });
        return positions;
    }

    function renderMap(state) {
        starsHint.style.display = currentStars() >= CASTLE_THRESHOLD ? 'none' : 'block';
        const history = computeHistoryPositions(state);
        const current = history[history.length - 1];
        const choices = state.pendingRoutes || [];
        const choiceY = current.y + MAP_CHOICE_SPACING;
        const n = choices.length;
        // Spread totale (bordo a bordo) tra il primo e l'ultimo bivio —
        // più bivi ci sono, più si allargano, ma mai oltre la larghezza
        // utile del canvas. Per un solo bivio (n=1) lo step è 0 e resta
        // semplicemente al centro.
        const totalSpread = MAP_UNIT_WIDTH * (n <= 2 ? 0.44 : 0.66);
        const step = n > 1 ? totalSpread / (n - 1) : 0;
        const choicePositions = choices.map((route, i) => ({
            x: MAP_UNIT_WIDTH / 2 + (i - (n - 1) / 2) * step,
            y: choiceY,
            route: route
        }));
        const canvasHeight = choiceY + MAP_BOTTOM_PADDING;

        content.innerHTML = `
            <div class="map-viewport" id="mapViewport">
                <div class="map-canvas" id="mapCanvas" style="height:${canvasHeight}px;">
                    <svg class="map-lines" viewBox="0 0 ${MAP_UNIT_WIDTH} ${canvasHeight}" preserveAspectRatio="none"></svg>
                </div>
            </div>
        `;
        const canvas = document.getElementById('mapCanvas');
        const svg = canvas.querySelector('svg');
        const pct = (x) => (x / MAP_UNIT_WIDTH * 100) + '%';

        function addLine(a, b, extraClass) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
            line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
            line.setAttribute('class', 'map-line' + (extraClass ? ' ' + extraClass : ''));
            svg.appendChild(line);
        }
        function addNode(pos, kind, opts) {
            opts = opts || {};
            const el = document.createElement(opts.onClick ? 'button' : 'div');
            if (opts.onClick) el.type = 'button';
            el.className = 'map-node ' + kind + (opts.extraClass ? ' ' + opts.extraClass : '');
            el.style.left = pct(pos.x);
            el.style.top = pos.y + 'px';
            el.innerHTML = `<span class="map-node-dot">${opts.icon || '?'}</span><span class="map-node-label">${opts.label || ''}</span>`;
            if (opts.onClick) el.onclick = opts.onClick;
            canvas.appendChild(el);
        }

        // Linee: dal via ad ogni pallino del sentiero, poi dal pallino
        // "sei qui" a CIASCUna delle nuove scelte (bivio).
        for (let i = 0; i < history.length - 1; i++) addLine(history[i], history[i + 1]);
        choicePositions.forEach((c) => addLine(current, c, 'choice-line'));

        // Sentiero già fatto (start + tappe risolte).
        history.forEach((node, i) => {
            const isCurrent = i === history.length - 1;
            addNode(node, isCurrent ? 'current' : node.kind, {
                icon: ICON_FOR_KIND[node.kind] || '•',
                label: isCurrent ? 'Sei qui' : ''
            });
        });

        // Bivio: i percorsi ancora da scegliere, "a sorpresa" finché non
        // si sceglie (stesso spirito del vecchio Sentiero 1/2/3) — tranne
        // il Castello, sempre riconoscibile perché è una destinazione
        // precisa, non un incontro casuale.
        choicePositions.forEach((c, index) => {
            const isCastle = c.route.kind === 'castle';
            addNode(c, 'choice', {
                extraClass: isCastle ? 'castle' : '',
                icon: isCastle ? '🏰' : '❔',
                label: isCastle ? 'Castello di Pegasus' : `Sentiero ${index + 1}`,
                onClick: () => chooseRoute(state, index)
            });
        });

        // Scorre subito in fondo, dove sta il bivio attuale — la mappa
        // "cresce" verso il basso man mano che si avanza, non serve
        // scorrere a mano per vedere le nuove scelte.
        const viewport = document.getElementById('mapViewport');
        viewport.scrollTop = viewport.scrollHeight;
    }

    function chooseRoute(state, index) {
        const route = state.pendingRoutes[index];
        if (window.NativeHaptics) NativeHaptics.light();
        if (route.kind === 'opponent') {
            openWagerModal(getRosterCharacter(route.characterId), (wager) => {
                state.pendingRoutes = null;
                state.pendingEncounter = { characterId: route.characterId, wager: wager, isKaibaGate: false };
                saveState(state);
                launchDuel(state.pendingEncounter);
            });
            return;
        }
        if (route.kind === 'prize') {
            addStars(route.amount);
            state.history.push({ step: state.step, kind: 'prize', label: `+${route.amount} Stelle` });
            showToast(`🎁 Hai trovato un premio: +${route.amount} Stelle!`);
        } else if (route.kind === 'malus') {
            addStars(-route.amount);
            state.history.push({ step: state.step, kind: 'malus', label: `-${route.amount} Stelle` });
            showToast(`⚠️ Un'insidia sul percorso: -${route.amount} Stelle!`);
        } else if (route.kind === 'castle') {
            resolveCastlePath(state);
            return;
        }
        state.step++;
        state.pendingRoutes = null;
        saveState(state);
        if (currentStars() <= 0) {
            state.eliminated = true;
            saveState(state);
        }
        render();
    }

    /** 50% di probabilità di dover prima affrontare Kaiba, puntando TUTTE le Stelle, per poter entrare. */
    function resolveCastlePath(state) {
        if (Math.random() < 0.5) {
            const wager = currentStars();
            state.pendingRoutes = null;
            state.pendingEncounter = { characterId: 'kaiba', wager: wager, isKaibaGate: true };
            saveState(state);
            launchDuel(state.pendingEncounter);
        } else {
            enterCastleBracket(state);
            state.pendingRoutes = null;
            saveState(state);
            render();
        }
    }

    /**
     * Prepara il tabellone del Castello (semifinale/finale/Pegasus): tre
     * altri Duellanti — MAI Kaiba, che ha già avuto il proprio scontro a
     * parte al Cancello — sono "entrati nel Castello" insieme al
     * giocatore. La semifinale è contro uno scelto a caso tra loro; la
     * finale (quando la semifinale è vinta) contro uno dei DUE rimasti,
     * scelto anche lui a caso — non si simula davvero l'altro incrocio
     * del tabellone, sarebbe complessità aggiuntiva per un dettaglio che
     * il giocatore non vede comunque succedere.
     */
    function enterCastleBracket(state) {
        state.castleReached = true;
        const pool = ROSTER_IDS.slice();
        const finalists = [];
        while (finalists.length < 3 && pool.length > 0) {
            const index = Math.floor(Math.random() * pool.length);
            finalists.push(pool.splice(index, 1)[0]);
        }
        state.castleFinalists = finalists;
        state.castleStage = 'semifinal';
        state.castleSemifinalOpponent = pickRandom(finalists);
    }

    // ----------------------------------------------------------------
    // Modale di puntata
    // ----------------------------------------------------------------
    function openWagerModal(character, onConfirm) {
        const modal = document.getElementById('wagerModal');
        const portrait = document.getElementById('wagerPortrait');
        portrait.className = 'opponent-portrait';
        portrait.innerHTML = '🧑‍🎤';
        if (character && character.image) {
            const img = document.createElement('img');
            img.alt = '';
            img.onload = () => portrait.classList.add('has-image');
            img.onerror = () => img.remove();
            img.src = character.image;
            portrait.appendChild(img);
        }
        document.getElementById('wagerName').textContent = character ? character.name : 'Duellante';
        document.getElementById('wagerTitle').textContent = (character && character.title) || '';

        let selected = null;
        const stars = currentStars();
        const buttons = Array.from(document.querySelectorAll('.wager-btn'));
        buttons.forEach((btn) => {
            const amount = parseInt(btn.dataset.wager, 10);
            btn.disabled = amount > stars;
            btn.classList.remove('selected');
            btn.onclick = () => {
                if (btn.disabled) return;
                selected = amount;
                buttons.forEach((b) => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
        });
        document.getElementById('wagerConfirmBtn').onclick = () => {
            if (selected == null) return;
            modal.classList.remove('open');
            onConfirm(selected);
        };
        document.getElementById('wagerCancelBtn').onclick = () => modal.classList.remove('open');
        modal.classList.add('open');
    }

    // ----------------------------------------------------------------
    // Lancio del vero duello — vedi js/duel-session.js (mode=tournament)
    // per come questa pagina viene riconosciuta come "da dove torna" il
    // pulsante Continua a fine duello.
    // ----------------------------------------------------------------
    function launchDuel(encounter) {
        const difficulty = (encounter.isKaibaGate || encounter.castleStage) ? 'Difficile' : 'Medio';
        const url = `duelMonstersCore.html?mode=tournament&tournament=${TOURNAMENT_ID}&character=${encodeURIComponent(encounter.characterId)}&difficulty=${difficulty}`;
        window.location.href = url;
    }

    /**
     * Consuma la breadcrolla generica "com'è appena finito l'ultimo
     * duello" (js/duel-session.js#finish) SOLO se corrisponde davvero a
     * un pendingEncounter di QUESTO torneo — altrimenti (es. l'utente ha
     * giocato un Duello Libero in un'altra scheda e poi è tornato qui
     * senza passare da un vero duello di torneo) non tocca nulla.
     */
    function resolvePendingEncounterIfDone(state) {
        if (!state.pendingEncounter) return false;
        let outcome = null;
        try {
            const raw = sessionStorage.getItem('ygoLastDuelOutcome');
            if (raw) outcome = JSON.parse(raw);
        } catch (e) { /* noop */ }
        if (!outcome || outcome.mode !== 'tournament' || outcome.tournamentId !== TOURNAMENT_ID) return false;
        try { sessionStorage.removeItem('ygoLastDuelOutcome'); } catch (e) { /* noop */ }

        const enc = state.pendingEncounter;
        const character = getRosterCharacter(enc.characterId);
        const name = character ? character.name : 'il Duellante';
        const won = outcome.playerWon === true;

        // Duelli del Castello (semifinale/finale/Pegasus): niente puntata,
        // è vittoria-o-eliminazione secca — gestiti PRIMA del ramo
        // Cancello di Kaiba/percorso normale qui sotto, che invece
        // riguardano sempre una vera posta di Stelle.
        if (enc.castleStage) {
            if (won) {
                const reward = enc.castleStage === 'pegasus' ? 15 : (10 + Math.floor(Math.random() * 6));
                addStars(reward);
                state.history.push({ step: state.step, kind: 'win', label: `Vittoria su ${name} (+${reward})` });
                if (window.NativeHaptics) NativeHaptics.success();
                if (enc.castleStage === 'semifinal') {
                    state.castleStage = 'final';
                    state.castleFinalOpponent = pickRandom(state.castleFinalists.filter((id) => id !== enc.characterId));
                    showToast(`⚔️ Hai sconfitto ${name} in semifinale! +${reward} Stelle. Ti attende la finale!`);
                } else if (enc.castleStage === 'final') {
                    state.castleStage = 'pegasus';
                    showToast(`🏆 Hai vinto la finale contro ${name}! +${reward} Stelle. Ora affronti Pegasus in persona.`);
                } else if (enc.castleStage === 'pegasus') {
                    state.castleStage = 'champion';
                    showToast(`👑 Hai sconfitto Maximillion Pegasus! Sei il Campione del Regno dei Duellanti!`);
                }
            } else {
                if (window.NativeHaptics) NativeHaptics.error();
                state.eliminated = true;
                showToast(`💀 ${name} ti ha sconfitto: il tuo cammino nel Castello finisce qui.`);
            }
            state.pendingEncounter = null;
            saveState(state);
            return true;
        }

        if (won) {
            addStars(enc.wager);
            if (window.NativeHaptics) NativeHaptics.success();
            if (enc.isKaibaGate) {
                enterCastleBracket(state);
                showToast(`🏆 Hai sconfitto ${name}! Il Castello di Pegasus si apre davanti a te.`);
            } else {
                state.history.push({ step: state.step, kind: 'win', label: `Vittoria su ${name} (+${enc.wager})` });
                state.step++;
                showToast(`⚔️ Hai sconfitto ${name}! +${enc.wager} Stelle.`);
            }
        } else {
            addStars(-enc.wager);
            if (window.NativeHaptics) NativeHaptics.error();
            if (enc.isKaibaGate) {
                showToast(`💀 ${name} ti ha sconfitto: le tue Stelle sono andate perdute.`);
            } else {
                state.history.push({ step: state.step, kind: 'lose', label: `Sconfitta contro ${name} (-${enc.wager})` });
                state.step++;
                showToast(`💀 ${name} ti ha sconfitto. -${enc.wager} Stelle.`);
            }
            if (currentStars() <= 0) state.eliminated = true;
        }
        state.pendingEncounter = null;
        saveState(state);
        return true;
    }

    // ----------------------------------------------------------------
    // Render principale — stato macchina a stati (vedi i commenti su
    // ogni ramo per quando si applica).
    // ----------------------------------------------------------------
    function render() {
        let state = loadState();

        if (!state) {
            renderStartScreen();
            return;
        }

        // Un esito di duello fresco per QUESTO torneo va sempre applicato
        // per primo, prima di decidere cos'altro mostrare — altrimenti si
        // rischierebbe di mostrare ancora "duello in sospeso" subito dopo
        // essere tornati da un duello già concluso.
        resolvePendingEncounterIfDone(state);

        starsBar.style.display = 'flex';
        document.getElementById('starsCount').textContent = currentStars();

        if (state.eliminated) { renderEliminated(); return; }
        if (state.castleReached) {
            // Un pendingEncounter (sfida del Castello in sospeso, es.
            // pagina ricaricata a metà) ha comunque priorità sulla
            // normale schermata "sfida X" della tappa attuale.
            if (state.pendingEncounter) { renderResumeEncounter(state); return; }
            renderCastleStage(state);
            return;
        }
        if (state.pendingEncounter) { renderResumeEncounter(state); return; }
        if (!state.pendingRoutes) generateRoutes(state);
        state = loadState();
        renderMap(state);
    }

    render();
</script>
</body>
</html>
