<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel Arena">
<script src="js/ui/error-recovery.js"></script>
<script src="js/pwa-register.js"></script>
<link rel="preload" href="audio/soundtracks/mainTheme.mp3" as="audio">
<title>Yu-Gi-Oh! Duel Arena — Regno dei Duellanti</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { min-height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/ra.jpg') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.65) 0%, rgba(6,7,12,0.78) 60%, rgba(4,5,8,0.9) 100%);
        pointer-events: none;
    }

    :root {
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --ink: #cdd6ea;
        --ink-dim: #9aa5bd;
        --bad: #e74c3c;
        --good: #2ecc71;
    }

    .main {
        position: relative;
        z-index: 1;
        padding: 20px 18px 60px;
        max-width: 760px;
        margin: 0 auto;
    }
    /* Modalità "schermo di gioco a tutto schermo" per la mappa vera e
       propria (non per le schermate-card inizio/eliminazione/castello,
       che restano centrate — quelle sono già "un quadro", non "una lista
       filtro"): niente più contenitore con bordo/padding, la mappa copre
       l'intero viewport come in un vero gioco d'avventura. */
    .main.map-mode { padding: 0; max-width: none; margin: 0; }
    body.map-active { overflow: hidden; }

    /* =====================================================================
       HUD flottante — sostituisce la vecchia topbar "da pagina filtro"
       (freccia Indietro + titolo fissi in alto). Richiesta esplicita
       dell'utente: "non deve sembrare una pagina filtro con top menu...
       deve sembrare un gioco di avventura con un pulsante di menu".
       Prima che il torneo sia iniziato mostra solo una freccia Indietro
       minima; una volta iniziato (state esiste) mostra invece il
       contatore Stelle + il pulsante Menu (☰), MAI entrambi insieme.
       ===================================================================== */
    .hud-top {
        position: fixed;
        top: max(14px, env(safe-area-inset-top, 14px));
        left: 14px;
        right: 14px;
        z-index: 300;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
    }
    .hud-top > * { pointer-events: auto; }
    .hud-back-btn, .menu-fab {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(247,215,116,0.4);
        background: linear-gradient(150deg, rgba(20,20,26,0.88), rgba(12,12,16,0.92));
        color: #fff;
        font-size: 1.25rem;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.45);
        cursor: pointer;
    }
    .stars-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 900;
        color: var(--gold);
        background: linear-gradient(150deg, rgba(20,20,26,0.88), rgba(12,12,16,0.92));
        border: 1px solid rgba(247,215,116,0.4);
        box-shadow: 0 8px 20px rgba(0,0,0,0.45);
        text-shadow: 0 0 12px rgba(247,215,116,0.4);
    }
    .stars-hint {
        position: fixed;
        top: 62px;
        left: 0;
        right: 0;
        z-index: 290;
        text-align: center;
        color: var(--ink-dim);
        font-size: 0.72rem;
        line-height: 1.4;
        pointer-events: none;
        padding: 8px 60px 16px;
        /* Sfuma verso il basso: rimane leggibile qualunque sia il nodo della
           mappa che le finisce sotto, senza un riquadro netto che stonerebbe
           con l'aspetto "mappa di gioco" del resto dello schermo. */
        background: linear-gradient(180deg, rgba(6,7,12,0.7) 0%, rgba(6,7,12,0.35) 70%, transparent 100%);
    }

    /* =====================================================================
       MAPPA — sostituisce le vecchie "card" testuali dei percorsi: una
       vera mappa a scorrimento verticale (stile "isola vista dall'alto",
       terreno boschivo simulato in puro CSS con gradienti radiali
       ripetuti — nessuna immagine reale necessaria) con un sentiero di
       pallini collegati da linee (SVG), esattamente come descritto:
       "muoversi in una mappa... percorsi (linee)... pallini (sfidanti,
       premi, malus)". Cresce verso il basso man mano che si avanza (il
       viewport scorre da solo fino in fondo ad ogni render) invece di
       essere un elenco di card usa-e-getta.
       ===================================================================== */
    .map-viewport {
        position: relative;
        width: 100%;
        height: 420px;
        margin-bottom: 20px;
        border-radius: 18px;
        border: 2px solid rgba(247,215,116,0.28);
        box-shadow: 0 16px 40px rgba(0,0,0,0.4), inset 0 0 60px rgba(0,0,0,0.5);
        /* Scorrevole in OGNI direzione (non più solo in verticale): il
           mondo di gioco (.map-canvas) è più largo dello schermo, così il
           sentiero può davvero "vagare" a sinistra/destra invece di
           restare incollato al centro — mouse/trackpad su desktop,
           trascinamento nativo col dito su touch (nessun JS necessario per
           quello, lo fa già il browser); il drag-to-pan col mouse è
           aggiunto a parte, vedi setupMapDragPan più sotto. */
        overflow: auto;
        cursor: grab;
        overscroll-behavior: contain;
    }
    .map-viewport.dragging { cursor: grabbing; }
    /* A tutto schermo quando è la vera mappa esplorabile (vedi .main.map-mode qui sopra) — il "quadro" con bordo arrotondato resta solo per le schermate-card. */
    .main.map-mode .map-viewport {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        border-radius: 0;
        border: none;
        box-shadow: inset 0 0 90px rgba(0,0,0,0.55);
    }
    .map-canvas {
        position: relative;
        /* "Terreno boschivo dall'alto" — sul CANVAS (il contenuto che
           scorre), non sul viewport (la finestra fissa): deve muoversi
           insieme ai pallini quando si scorre/trascina, altrimenti la
           mappa sembrerebbe "scivolare" su uno sfondo immobile. Il
           pattern si ripete da solo su qualunque estensione del mondo,
           nessuna immagine reale necessaria. */
        background-color: #1f2e1a;
        background-image:
            radial-gradient(circle at 15% 20%, rgba(30,58,26,0.9) 0%, transparent 40%),
            radial-gradient(circle at 70% 10%, rgba(38,66,30,0.85) 0%, transparent 35%),
            radial-gradient(circle at 40% 45%, rgba(22,44,20,0.9) 0%, transparent 38%),
            radial-gradient(circle at 85% 55%, rgba(35,60,28,0.85) 0%, transparent 42%),
            radial-gradient(circle at 10% 75%, rgba(28,50,24,0.9) 0%, transparent 36%),
            radial-gradient(circle at 60% 85%, rgba(40,68,32,0.85) 0%, transparent 40%),
            radial-gradient(circle at 90% 95%, rgba(24,46,20,0.9) 0%, transparent 38%),
            linear-gradient(180deg, rgba(6,7,12,0.35) 0%, rgba(6,7,12,0.55) 100%);
        background-size: 340px 340px, 300px 300px, 320px 320px, 280px 280px, 300px 300px, 320px 320px, 300px 300px, 100% 100%;
    }
    .map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 74px;
    }
    .map-node-dot {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        background: linear-gradient(150deg, rgba(40,32,20,0.92), rgba(18,16,22,0.95));
        border: 2px solid rgba(255,255,255,0.25);
        box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }
    .map-node-label {
        font-size: 0.62rem;
        font-weight: 800;
        color: var(--ink-dim);
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        text-align: center;
        white-space: nowrap;
    }
    .map-node.start .map-node-dot { border-color: rgba(247,215,116,0.6); }
    .map-node.win .map-node-dot { border-color: rgba(46,204,113,0.7); background: linear-gradient(150deg, rgba(20,50,28,0.92), rgba(15,30,20,0.95)); }
    .map-node.lose .map-node-dot { border-color: rgba(231,76,60,0.7); background: linear-gradient(150deg, rgba(55,20,20,0.92), rgba(30,15,15,0.95)); }
    .map-node.prize .map-node-dot { border-color: rgba(247,215,116,0.7); background: linear-gradient(150deg, rgba(55,45,15,0.92), rgba(30,25,10,0.95)); }
    .map-node.malus .map-node-dot { border-color: rgba(180,120,60,0.7); background: linear-gradient(150deg, rgba(45,30,15,0.92), rgba(25,18,10,0.95)); }
    .map-node.current .map-node-dot {
        width: 52px; height: 52px;
        border-color: var(--gold-strong);
        box-shadow: 0 0 0 6px rgba(243,156,18,0.22), 0 6px 20px rgba(0,0,0,0.6);
        animation: mapCurrentPulse 1800ms ease-in-out infinite;
    }
    @keyframes mapCurrentPulse {
        0%, 100% { box-shadow: 0 0 0 6px rgba(243,156,18,0.22), 0 6px 20px rgba(0,0,0,0.6); }
        50% { box-shadow: 0 0 0 10px rgba(243,156,18,0.1), 0 6px 20px rgba(0,0,0,0.6); }
    }
    .map-node.choice {
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
        color: inherit;
    }
    .map-node.choice .map-node-dot {
        border-style: dashed;
        border-color: rgba(255,255,255,0.4);
        animation: mapChoiceBeckon 1400ms ease-in-out infinite;
    }
    @keyframes mapChoiceBeckon {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
    .map-node.choice.castle .map-node-dot { border-color: rgba(155, 89, 182, 0.7); }
    .map-node.choice:hover .map-node-dot { border-color: var(--gold); }
    .map-line {
        stroke: rgba(255,255,255,0.32);
        stroke-width: 3;
        stroke-dasharray: 2 8;
        stroke-linecap: round;
        fill: none;
    }
    .map-line.choice-line { stroke: rgba(247,215,116,0.55); }

    /* --- Schermata centrale generica (inizio/eliminazione/castello) --- */
    .center-panel {
        text-align: center;
        background: linear-gradient(150deg, rgba(40,32,20,0.82), rgba(18,16,22,0.86));
        border: 2px solid rgba(247,215,116,0.28);
        border-radius: 18px;
        padding: 34px 24px;
        box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .center-panel .cp-icon { font-size: 3rem; margin-bottom: 14px; }
    .center-panel h2 { font-size: 1.3rem; margin-bottom: 10px; color: var(--gold); }
    .center-panel p { color: var(--ink); font-size: 0.92rem; line-height: 1.6; margin-bottom: 22px; }

    .big-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 30px;
        border: none;
        border-radius: 12px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: 0.03em;
        cursor: pointer;
        color: #21160a;
        background: linear-gradient(145deg, #f7d774, #f39c12);
        box-shadow: 0 10px 26px rgba(243,156,18,0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .big-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(243,156,18,0.5); }
    .big-btn.secondary {
        color: #f2f6ff;
        background: linear-gradient(145deg, #4a5a72, #2f3b4d);
        box-shadow: 0 10px 26px rgba(0,0,0,0.4);
    }

    /* --- Toast di risultato (prize/malus/duello) --- */
    .result-toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 0);
        z-index: 500;
        max-width: min(92vw, 420px);
        background: linear-gradient(150deg, rgba(20,20,26,0.96), rgba(12,12,16,0.97));
        border: 1px solid rgba(247,215,116,0.4);
        border-radius: 14px;
        padding: 14px 18px;
        text-align: center;
        font-size: 0.9rem;
        box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        opacity: 0;
        transition: opacity 250ms ease, transform 250ms ease;
        pointer-events: none;
    }
    .result-toast.show { opacity: 1; transform: translate(-50%, -6px); }
    .toast-quote { display: inline-block; margin-top: 6px; color: var(--ink-dim); font-style: italic; font-size: 0.82rem; }

    /* --- Modale di puntata --- */
    .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(4,5,8,0.78);
        padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
        width: 100%;
        max-width: 380px;
        background: linear-gradient(150deg, rgba(30,26,20,0.97), rgba(16,15,20,0.98));
        border: 2px solid rgba(247,215,116,0.35);
        border-radius: 18px;
        padding: 26px 22px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    }
    .modal-card .opponent-portrait {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        margin: 0 auto 12px;
        background: linear-gradient(150deg, #3a2f22, #1c1620);
        border: 2px solid rgba(247,215,116,0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        overflow: hidden;
        position: relative;
    }
    .modal-card .opponent-portrait img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.25s ease;
    }
    .modal-card .opponent-portrait.has-image img { opacity: 1; }
    .modal-card h3 { font-size: 1.1rem; margin-bottom: 4px; color: #fff; }
    .modal-card .opponent-title { color: var(--ink-dim); font-size: 0.78rem; margin-bottom: 4px; }
    /* Battuta del Duellante, stile "a fumetto" — alla Forbidden Memories,
       dove ogni sfidante apre l'incontro con una riga in carattere prima
       che si scelga la puntata. Vuota (display:none via JS) se un
       personaggio non ha ancora battute in QUOTE_BANK. */
    .opponent-quote {
        color: #f2f6ff;
        font-size: 0.82rem;
        font-style: italic;
        line-height: 1.4;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(247,215,116,0.2);
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 16px;
        text-align: center;
    }
    .opponent-quote::before { content: '“'; }
    .opponent-quote::after { content: '”'; }
    .wager-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
    }
    .wager-btn {
        flex: 1;
        padding: 12px 0;
        border-radius: 10px;
        border: 2px solid rgba(247,215,116,0.3);
        background: rgba(255,255,255,0.05);
        color: #fff;
        font-family: inherit;
        font-weight: 900;
        font-size: 1rem;
        cursor: pointer;
    }
    .wager-btn.selected { border-color: var(--gold-strong); background: rgba(243,156,18,0.22); color: var(--gold); }
    .wager-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-actions .big-btn { flex: 1; justify-content: center; }

    /* --- Menu di avventura (☰): visualizza bottino / sospendi / abbandona / annulla --- */
    .adventure-menu-card { text-align: left; }
    .adventure-menu-card h3 { text-align: center; color: var(--gold); font-size: 1.15rem; margin-bottom: 18px; }
    .menu-options { display: flex; flex-direction: column; gap: 10px; }
    .menu-option-btn {
        padding: 13px 16px;
        border-radius: 12px;
        border: 2px solid rgba(247,215,116,0.28);
        background: rgba(255,255,255,0.05);
        color: #f2f6ff;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 800;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
    }
    .menu-option-btn:hover { background: rgba(247,215,116,0.12); border-color: var(--gold); }
    .menu-option-btn.danger { border-color: rgba(231,76,60,0.4); color: #ff9d90; }
    .menu-option-btn.danger:hover { background: rgba(231,76,60,0.15); border-color: #e74c3c; }
    .menu-option-btn.cancel { text-align: center; color: var(--ink-dim); border-color: rgba(255,255,255,0.15); }

    /* --- Bottino --- */
    .loot-card h3 { color: var(--gold); font-size: 1.1rem; margin-bottom: 4px; }
    .loot-list { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; text-align: left; }
    .loot-entry { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.04); font-size: 0.85rem; }
    .loot-entry span:first-child { font-size: 1.1rem; }
    .loot-empty { color: var(--ink-dim); font-size: 0.85rem; text-align: center; padding: 20px 0; }

    @media (max-width: 480px) {
        .main { padding: 14px 10px 40px; }
        .map-viewport { height: 360px; }
    }
</style>
</head>
<body>
    <div class="hud-top">
        <button type="button" class="hud-back-btn" id="hudBackBtn" style="display:none;" aria-label="Torna ai Tornei">‹</button>
        <div class="stars-bar" id="starsBar" style="display:none;">
            <span>⭐</span><span class="stars-count" id="starsCount">0</span>
        </div>
        <button type="button" class="menu-fab" id="adventureMenuBtn" style="display:none;" aria-label="Menu">☰</button>
    </div>
    <p class="stars-hint" id="starsHint" style="display:none;">Raccogli 10 Stelle per tentare l'accesso al Castello di Pegasus.</p>

    <main class="main">
        <div id="content"></div>
    </main>

    <div class="result-toast" id="resultToast"></div>

    <!-- Modale di puntata prima di un duello -->
    <div class="modal-backdrop" id="wagerModal">
        <div class="modal-card">
            <div class="opponent-portrait" id="wagerPortrait">🧑‍🎤</div>
            <h3 id="wagerName">—</h3>
            <div class="opponent-title" id="wagerTitle">—</div>
            <p class="opponent-quote" id="wagerQuote"></p>
            <p style="color:var(--ink-dim); font-size:0.8rem; margin-bottom:12px;">Quante Stelle vuoi puntare?</p>
            <div class="wager-row" id="wagerRow">
                <button type="button" class="wager-btn" data-wager="2">2</button>
                <button type="button" class="wager-btn" data-wager="3">3</button>
                <button type="button" class="wager-btn" data-wager="5">5</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="big-btn secondary" id="wagerCancelBtn">Annulla</button>
                <button type="button" class="big-btn" id="wagerConfirmBtn">Sfida!</button>
            </div>
        </div>
    </div>

    <!-- Menu di avventura (☰): bottino / sospendi / abbandona / annulla -->
    <div class="modal-backdrop" id="adventureMenuModal">
        <div class="modal-card adventure-menu-card">
            <h3>Menu</h3>
            <div class="menu-options" id="menuOptionsList">
                <button type="button" class="menu-option-btn" id="menuLootBtn">🎁 Visualizza bottino</button>
                <button type="button" class="menu-option-btn" id="menuSuspendBtn">⏸ Sospendi torneo</button>
                <button type="button" class="menu-option-btn danger" id="menuAbandonBtn">🚪 Abbandona torneo</button>
                <button type="button" class="menu-option-btn cancel" id="menuCancelBtn">Annulla</button>
            </div>
            <div id="menuAbandonConfirm" style="display:none;">
                <p style="color:var(--ink); font-size:0.88rem; margin-bottom:18px;">Abbandonare il torneo? Perderai tutti i progressi (Stelle e percorso) fatti finora nel Regno dei Duellanti.</p>
                <div class="modal-actions">
                    <button type="button" class="big-btn secondary" id="menuAbandonCancelBtn">Annulla</button>
                    <button type="button" class="big-btn" id="menuAbandonConfirmBtn" style="background:linear-gradient(145deg,#e74c3c,#c0392b); color:#fff;">Abbandona</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottino: riepilogo Stelle attuali + cronologia degli eventi del percorso -->
    <div class="modal-backdrop" id="lootModal">
        <div class="modal-card loot-card">
            <h3>🎒 Il tuo bottino</h3>
            <p style="color:var(--ink-dim); font-size:0.8rem; margin-bottom:16px;">⭐ <strong id="lootStars">0</strong> Stelle dell'Esagono raccolte finora</p>
            <div class="loot-list" id="lootList"></div>
            <div class="modal-actions" style="margin-top:18px;">
                <button type="button" class="big-btn secondary" id="lootCloseBtn" style="flex:1;">Chiudi</button>
            </div>
        </div>
    </div>

<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<script src="js/save-manager.js"></script>
<script src="js/data/characters-db.js"></script>
<script src="js/ui/icon-library.js"></script>
<script>
    // Colonna sonora dedicata alla mappa d'avventura, diversa da quella di
    // battaglia (vedi launchDuel più sotto) — fissa per ora, richiesta
    // esplicita dell'utente ("per ora una a tua scelta fissa").
    initAudioManager({ trackSrc: "audio/soundtracks/19. Forest Shrine.mp3" });
    Icons.hydrate();

    // ================================================================
    // Regno dei Duellanti — mappa a bivi generata "man mano" (non un
    // grafo intero precalcolato): ad ogni passo si offrono 2-3 percorsi
    // (o un 4° "verso il Castello" oltre le 10 Stelle), il TIPO di ogni
    // percorso resta nascosto finché non lo si sceglie. Stato persistito
    // in SaveManager.getTournamentState('duelistKingdom') — sopravvive a
    // chiusura app/ricarica pagina, esattamente come deck/record.
    // ================================================================
    const TOURNAMENT_ID = 'duelistKingdom';
    const STARTING_STARS = 2;
    const CASTLE_THRESHOLD = 10;
    const WAGER_OPTIONS = [2, 3, 5];
    // Solo i Duellanti del vero Regno dei Duellanti (Duelist Kingdom) —
    // MAI Kaiba o Pegasus, che compaiono solo tramite il percorso
    // speciale "verso il Castello" più sotto, mai come incontro casuale
    // prima di quella soglia (richiesta esplicita dell'utente).
    const ROSTER_IDS = ['rex', 'weevil', 'mako', 'panik', 'bonz', 'paradoxBrothers', 'mai', 'bandit_keith'];

    /**
     * Battute in carattere per ogni Duellante — alla Forbidden Memories,
     * dove ogni sfidante apriva l'incontro con una riga di sfida prima del
     * duello e ne chiudeva una in vittoria/sconfitta dopo. Volutamente
     * SOLO qui (non in js/data/characters-db.js, che resta anagrafica pura
     * — nome/titolo/immagine, riusata anche da pagine senza alcun
     * contesto narrativo): un futuro secondo torneo con lo stesso
     * personaggio (es. Battle City) potrebbe volergli mettere in bocca
     * battute del tutto diverse, quindi il testo narrativo appartiene al
     * CONTESTO che lo usa, non all'anagrafica condivisa. `intro` esce nel
     * modale di puntata/nelle schermate di sfida PRIMA del duello; `win`/
     * `lose` sono la reazione del PERSONAGGIO (mai del giocatore) dopo,
     * scelta in base a chi ha vinto — vedi showOpponentReaction più sotto.
     */
    const QUOTE_BANK = {
        rex: {
            intro: ["I miei Dinosauri ti seppelliranno come un fossile!", "Nessuno batte Rex Raptor sulla sua stessa isola!"],
            win: ["Ruggito di vittoria! I Dinosauri regnano ancora!", "Preistoria contro di te: hai perso in partenza."],
            lose: ["Impossibile... estinto di nuovo?!", "Anche i Dinosauri più forti hanno le loro brutte giornate."]
        },
        weevil: {
            intro: ["Ti intrappolerò come un insetto nella tela, ehehe!", "I miei insetti divorano ogni tua strategia!"],
            win: ["Ehehe! Ti ho spolpato come una vera piaga!", "Il mio esercito di insetti non conosce sconfitta!"],
            lose: ["Nooo, la mia collezione... schiacciata!", "Impossibile, i miei insetti erano perfetti!"]
        },
        mako: {
            intro: ["Il mare non perdona: preparati ad affogare nella sconfitta!", "Le mie creature abissali ti trascineranno a fondo!"],
            win: ["Le maree della vittoria sono con me!", "Il mare ha scelto: tu affondi, io navigo."],
            lose: ["Il mare stavolta mi ha voltato le spalle...", "Anche l'oceano più in tempesta può calmarsi."]
        },
        panik: {
            intro: ["Il Signor Pegasus si aspetta grandi cose da me... e da te, la sconfitta.", "Le illusioni ti confonderanno fino alla fine!"],
            win: ["Come previsto: un'altra vittima delle mie illusioni.", "Il Signor Pegasus sarà fiero di me."],
            lose: ["Questo... non era nei piani del Signor Pegasus...", "Le mie illusioni si sono infrante contro la realtà."]
        },
        bonz: {
            intro: ["I miei mostri Zombie si rialzeranno finché non crolli!", "Benvenuto nel mio regno... del Cimitero!"],
            win: ["Un'altra anima per il mio esercito di non-morti!", "Riposa in pace, la tua sfida è finita qui."],
            lose: ["Nooo, anche i miei Zombie hanno ceduto...", "Persino i non-morti sanno quando è finita."]
        },
        paradoxBrothers: {
            intro: ["Nel nostro Labirinto, nessuno trova l'uscita!", "Siamo in due contro le tue carte: non hai speranza!"],
            win: ["Il Labirinto Magico ti ha intrappolato per sempre!", "Due menti, una sola vittoria: la nostra!"],
            lose: ["Il nostro Labirinto... violato?!", "Nemmeno in due siamo bastati, stavolta."]
        },
        mai: {
            intro: ["Le mie Trappole ti aspettano dietro ogni angolo, tesoro.", "Sottovalutarmi è il tuo primo, grande errore."],
            win: ["Caduto dritto in trappola, come tutti gli altri.", "Un altro autografo per la Regina delle Trappole."],
            lose: ["Impossibile... ho calcolato ogni mossa!", "Stavolta la trappola si è chiusa su di me."]
        },
        bandit_keith: {
            intro: ["Nessuno batte il numero uno d'America, ricordatelo!", "Preparati a perdere contro il migliore, punto e basta!"],
            win: ["Ovvio: sono semplicemente il migliore!", "Un'altra vittoria per il vero campione!"],
            lose: ["Non... non può finire così, non contro di te!", "Deve esserci un errore, io non perdo mai!"]
        },
        kaiba: {
            intro: ["Le tue Stelle non contano nulla contro la mia strategia.", "Preparati: sto per darti una lezione di Duel Monsters."],
            win: ["Come previsto. La mediocrità non ha scampo contro di me.", "Il Castello di Pegasus resta un sogno, per te."],
            lose: ["...Impossibile. Ricorderò questa sconfitta.", "Questa partita non conta. La rivincita sì."]
        },
        pegasus: {
            intro: ["Ah, sei arrivato fin qui... vediamo se meriti davvero il titolo, mio caro.", "Il mio Occhio ha già visto come andrà a finire questo duello~"],
            win: ["Ho visto ogni tua mossa prima ancora che tu la giocassi.", "Che spettacolo delizioso... peccato sia già finito."],
            lose: ["Oh! Che sorpresa deliziosa... complimenti davvero.", "Anche un creatore di giochi puo' imparare qualcosa di nuovo, a quanto pare."]
        }
    };

    // Scenette di ambientazione per i bivi premio/insidia — alla stessa
    // logica delle battute dei Duellanti: solo per rendere la mappa un
    // posto vivo da esplorare, mai lette dalla logica di gioco (che
    // continua a ragionare solo su route.amount).
    const PRIZE_SCENES = [
        "Trovi uno scrigno abbandonato tra le palme, dimenticato da un altro Duellante.",
        "Un vecchio pescatore ti indica un sentiero nascosto e ti regala alcune Stelle come pegno di fortuna.",
        "Sotto una roccia scolpita scopri una piccola riserva di Stelle dell'Esagono.",
        "Un Kuriboh curioso ti porta tra le zampe alcune Stelle scintillanti."
    ];
    const MALUS_SCENES = [
        "Il sentiero frana all'improvviso: alcune delle tue Stelle rotolano nella boscaglia.",
        "Un gruppo di Duellanti in cerca di guai ti tende un'imboscata e ti alleggerisce di qualche Stella.",
        "Ti perdi tra gli alberi per ore: il tempo perso ti costa alcune Stelle.",
        "Una tempesta improvvisa sull'isola ti fa perdere l'equilibrio, e alcune Stelle con esso."
    ];

    /** Una battuta casuale (mai la stessa ripetuta due volte se ce n'è più di una) per `character` nella categoria `kind` ('intro'/'win'/'lose') — stringa vuota se il personaggio non è ancora in QUOTE_BANK. */
    function getQuote(characterId, kind) {
        const bank = QUOTE_BANK[characterId];
        if (!bank || !bank[kind] || bank[kind].length === 0) return '';
        return pickRandom(bank[kind]);
    }

    function getRosterCharacter(id) {
        return characterDatabase.find((c) => c.id === id);
    }

    function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    /** Stato di default per un torneo mai iniziato (in memoria finché non si preme "Inizia"). */
    function makeInitialState() {
        return {
            step: 0,
            pendingRoutes: null,
            pendingEncounter: null,
            history: [],
            castleReached: false,
            eliminated: false,
            atKaibaGate: false
        };
    }

    function loadState() {
        return SaveManager.getTournamentState(TOURNAMENT_ID);
    }
    function saveState(state) {
        SaveManager.setTournamentState(TOURNAMENT_ID, state);
    }

    function currentStars() {
        return SaveManager.getCurrency().starChips || 0;
    }
    /** Somma (o sottrae) Stelle, mai sotto zero — vedi SaveManager.addCurrency. */
    function addStars(amount) {
        return SaveManager.addCurrency('starChips', amount).starChips;
    }

    // ----------------------------------------------------------------
    // Generazione dei percorsi: 2 o 3 scelte, ciascuna 'opponent' (55%),
    // 'prize' (25%) o 'malus' (20%) — pesi scelti per rendere gli
    // incontri con un Duellante il caso più comune senza eliminare mai
    // del tutto la varietà. Nessun Duellante ripetuto nello stesso set
    // di scelte (mero polish, non una regola del gioco reale).
    // ----------------------------------------------------------------
    function rollRouteKind() {
        const r = Math.random();
        if (r < 0.55) return 'opponent';
        if (r < 0.80) return 'prize';
        return 'malus';
    }
    function generateRoutes(state) {
        const count = Math.random() < 0.5 ? 2 : 3;
        const usedCharacters = new Set();
        const routes = [];
        for (let i = 0; i < count; i++) {
            const kind = rollRouteKind();
            if (kind === 'opponent') {
                let pool = ROSTER_IDS.filter((id) => !usedCharacters.has(id));
                if (pool.length === 0) pool = ROSTER_IDS;
                const characterId = pickRandom(pool);
                usedCharacters.add(characterId);
                routes.push({ kind: 'opponent', characterId: characterId });
            } else if (kind === 'prize') {
                routes.push({ kind: 'prize', amount: 1 + Math.floor(Math.random() * 2) });
            } else {
                routes.push({ kind: 'malus', amount: 1 + Math.floor(Math.random() * 2) });
            }
        }
        // Oltre la soglia, il percorso verso il Castello resta SEMPRE
        // disponibile in aggiunta alle scelte normali (non le sostituisce):
        // il giocatore può continuare a raccogliere Stelle se preferisce.
        if (currentStars() >= CASTLE_THRESHOLD) {
            routes.push({ kind: 'castle' });
        }
        assignChoicePositions(state, routes);
        state.pendingRoutes = routes;
        saveState(state);
    }

    // ----------------------------------------------------------------
    // Render
    // ----------------------------------------------------------------
    const content = document.getElementById('content');
    const mainEl = document.querySelector('.main');
    const starsBar = document.getElementById('starsBar');
    const starsHint = document.getElementById('starsHint');
    const hudBackBtn = document.getElementById('hudBackBtn');
    const menuFab = document.getElementById('adventureMenuBtn');

    hudBackBtn.onclick = () => { window.location.href = 'tornei.html'; };

    // ----------------------------------------------------------------
    // Menu di avventura (☰) — sostituisce la topbar "da pagina filtro":
    // visualizza bottino / sospendi torneo / abbandona torneo / annulla.
    // ----------------------------------------------------------------
    const adventureMenuModal = document.getElementById('adventureMenuModal');
    const menuOptionsList = document.getElementById('menuOptionsList');
    const menuAbandonConfirm = document.getElementById('menuAbandonConfirm');
    const lootModal = document.getElementById('lootModal');

    function openAdventureMenu() {
        menuOptionsList.style.display = 'flex';
        menuAbandonConfirm.style.display = 'none';
        adventureMenuModal.classList.add('open');
    }
    function closeAdventureMenu() { adventureMenuModal.classList.remove('open'); }

    menuFab.onclick = openAdventureMenu;
    document.getElementById('menuCancelBtn').onclick = closeAdventureMenu;
    adventureMenuModal.addEventListener('click', (e) => { if (e.target === adventureMenuModal) closeAdventureMenu(); });

    function openLootModal() {
        const state = loadState();
        document.getElementById('lootStars').textContent = currentStars();
        const list = document.getElementById('lootList');
        const entries = (state && state.history ? state.history.slice() : []).reverse();
        list.innerHTML = entries.length
            ? entries.map((e) => `<div class="loot-entry"><span>${ICON_FOR_KIND[e.kind] || '•'}</span><span>${e.label}</span></div>`).join('')
            : '<p class="loot-empty">Il tuo cammino è appena iniziato: nessun evento ancora registrato.</p>';
        lootModal.classList.add('open');
    }
    document.getElementById('menuLootBtn').onclick = () => { closeAdventureMenu(); openLootModal(); };
    document.getElementById('lootCloseBtn').onclick = () => lootModal.classList.remove('open');
    lootModal.addEventListener('click', (e) => { if (e.target === lootModal) lootModal.classList.remove('open'); });

    document.getElementById('menuSuspendBtn').onclick = () => {
        closeAdventureMenu();
        showToast('⏸ Torneo sospeso: i progressi sono salvati, potrai riprenderlo quando vuoi.');
        setTimeout(() => { window.location.href = 'tornei.html'; }, 700);
    };
    // Abbandono: richiede una conferma esplicita (nessun window.confirm nativo
    // in questo progetto, stesso stile a modale usato ovunque) perché
    // cancella per sempre Stelle e percorso fatto finora.
    document.getElementById('menuAbandonBtn').onclick = () => {
        menuOptionsList.style.display = 'none';
        menuAbandonConfirm.style.display = 'block';
    };
    document.getElementById('menuAbandonCancelBtn').onclick = () => {
        menuAbandonConfirm.style.display = 'none';
        menuOptionsList.style.display = 'flex';
    };
    document.getElementById('menuAbandonConfirmBtn').onclick = () => {
        saveState(null);
        closeAdventureMenu();
        if (window.NativeHaptics) NativeHaptics.error();
        window.location.href = 'tornei.html';
    };

    /** `quote`, se presente, è la reazione IN CARATTERE del Duellante appena affrontato (getQuote) — mostrata sotto il risultato meccanico, alla Forbidden Memories. innerHTML invece di textContent: sicuro perché entrambi i pezzi sono sempre testo generato da questo stesso script, mai input dell'utente. */
    function showToast(text, quote) {
        const toast = document.getElementById('resultToast');
        toast.innerHTML = quote ? `${text}<br><span class="toast-quote">“${quote}”</span>` : text;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), quote ? 3800 : 2600);
    }

    function renderStartScreen() {
        starsBar.style.display = 'none';
        starsHint.style.display = 'none';
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">🏝️</div>
                <h2>Il Regno dei Duellanti ti aspetta</h2>
                <p>Parti con ${STARTING_STARS} Stelle dell'Esagono. Sfida i Duellanti dell'isola puntando le tue Stelle, raccogli premi ed evita le insidie del percorso — raggiungi ${CASTLE_THRESHOLD} Stelle per tentare l'accesso al Castello di Pegasus.</p>
                <button type="button" class="big-btn" id="startTournamentBtn">🚀 Inizia il Torneo</button>
            </div>
        `;
        document.getElementById('startTournamentBtn').onclick = () => {
            addStars(STARTING_STARS - currentStars());
            const state = makeInitialState();
            saveState(state);
            if (window.NativeHaptics) NativeHaptics.light();
            render();
        };
    }

    function renderEliminated() {
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">💀</div>
                <h2>Eliminato dal Torneo</h2>
                <p>Hai perso tutte le tue Stelle dell'Esagono: la tua avventura nel Regno dei Duellanti finisce qui, per questa volta.</p>
                <button type="button" class="big-btn" id="restartTournamentBtn">🔄 Ricomincia</button>
            </div>
        `;
        document.getElementById('restartTournamentBtn').onclick = () => {
            saveState(null);
            render();
        };
    }

    // Metadati di presentazione per ciascuna tappa del Castello — solo
    // testo/icone, la logica vera (avversario, ricompensa) vive in
    // resolvePendingEncounterIfDone/enterCastleBracket qui sopra.
    const CASTLE_STAGE_META = {
        semifinal: { icon: '🥊', title: 'Semifinale', reward: '10-15' },
        final: { icon: '🏆', title: 'Finale', reward: '10-15' }
    };

    function renderCastleStage(state) {
        starsHint.style.display = 'none';
        if (state.castleStage === 'champion') {
            content.innerHTML = `
                <div class="center-panel">
                    <div class="cp-icon">👑</div>
                    <h2>Campione del Regno dei Duellanti!</h2>
                    <p>Hai sconfitto Maximillion Pegasus in persona. Il premio finale del torneo verrà svelato più avanti.</p>
                    <button type="button" class="big-btn secondary" id="backToMenuBtn">Torna al menu</button>
                </div>
            `;
            document.getElementById('backToMenuBtn').onclick = () => { window.location.href = 'index.html'; };
            return;
        }
        if (state.castleStage === 'pegasus') {
            renderCastleChallenge(state, 'pegasus', {
                icon: '🏰',
                title: 'Il Duello Finale',
                intro: 'Hai superato la semifinale e la finale: solo Maximillion Pegasus si frappone tra te e la vittoria del torneo.',
                rewardText: '15 Stelle, e la vittoria del Regno dei Duellanti'
            });
            return;
        }
        const stage = state.castleStage === 'final' ? 'final' : 'semifinal';
        const opponentId = stage === 'final' ? state.castleFinalOpponent : state.castleSemifinalOpponent;
        const meta = CASTLE_STAGE_META[stage];
        renderCastleChallenge(state, opponentId, {
            icon: meta.icon,
            title: meta.title,
            intro: stage === 'semifinal'
                ? 'Sei entrato nel Castello di Pegasus: la semifinale ti attende contro un altro Duellante arrivato fin qui.'
                : 'Hai vinto la semifinale! Un solo Duellante ti separa dallo scontro con Pegasus.',
            rewardText: `${meta.reward} Stelle (a caso)`
        });
    }

    /**
     * Schermata generica "sfida X" — usata sia per le tappe del Castello
     * (semifinale/finale/Pegasus: nessuna puntata da scegliere, è
     * vittoria-o-eliminazione) sia per il Cancello di Kaiba (vedi
     * renderKaibaGateEncounter più sotto, che le passa un `encounter` già
     * pronto invece di lasciarglielo costruire da sola) — in entrambi i
     * casi l'incontro apre con una battuta in carattere del Duellante
     * (getQuote), alla Forbidden Memories.
     */
    function renderCastleChallenge(state, opponentId, meta, encounterOverride) {
        const character = getRosterCharacter(opponentId);
        const quote = getQuote(opponentId, 'intro');
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">${meta.icon}</div>
                <h2>${meta.title}: ${character ? character.name : 'Duellante'}</h2>
                ${quote ? `<p class="opponent-quote">${quote}</p>` : ''}
                <p>${meta.intro}<br><br>In palio: <strong>${meta.rewardText}</strong>.</p>
                <button type="button" class="big-btn" id="castleChallengeBtn">⚔️ Sfida!</button>
            </div>
        `;
        document.getElementById('castleChallengeBtn').onclick = () => {
            state.pendingEncounter = encounterOverride || { characterId: opponentId, wager: 0, isKaibaGate: false, castleStage: state.castleStage };
            state.atKaibaGate = false;
            saveState(state);
            launchDuel(state.pendingEncounter);
        };
    }

    /** Il Cancello del Castello: Kaiba si frappone tra il giocatore e l'ingresso, puntando TUTTE le Stelle accumulate finora — stessa schermata "sfida X" delle tappe del Castello, solo con l'encounter già pronto (wager pieno, isKaibaGate). */
    function renderKaibaGateEncounter(state) {
        starsHint.style.display = 'none';
        const wager = currentStars();
        renderCastleChallenge(state, 'kaiba', {
            icon: '🚪',
            title: 'Il Cancello del Castello',
            intro: 'Prima di poterti presentare al Castello di Pegasus, Seto Kaiba in persona ti sbarra la strada.',
            rewardText: `tutte le tue ${wager} Stelle — vittoria o sconfitta`
        }, { characterId: 'kaiba', wager: wager, isKaibaGate: true });
    }

    /** Un pendingEncounter esiste ma non è arrivato nessun esito di duello fresco per lui: probabilmente la pagina è stata ricaricata/l'app chiusa a metà duello. */
    function renderResumeEncounter(state) {
        const enc = state.pendingEncounter;
        const character = getRosterCharacter(enc.characterId);
        const stakeText = enc.castleStage ? 'una sfida ad eliminazione diretta' : `${enc.wager} Stelle in palio`;
        content.innerHTML = `
            <div class="center-panel">
                <div class="cp-icon">⚔️</div>
                <h2>Duello in sospeso</h2>
                <p>Avevi una sfida in corso contro ${character ? character.name : 'un Duellante'} (${stakeText}). Riprendila per continuare.</p>
                <button type="button" class="big-btn" id="resumeDuelBtn">Riprendi la sfida</button>
            </div>
        `;
        document.getElementById('resumeDuelBtn').onclick = () => launchDuel(enc);
    }

    // ----------------------------------------------------------------
    // Mappa a nodi collegati — sostituisce le vecchie "card" di
    // percorso: il sentiero già fatto (state.history) resta visibile
    // come pallini collegati da linee, con i nuovi 2-3 (o 4 col
    // Castello) percorsi possibili che si diramano dal pallino "sei
    // qui" attuale. Coordinate in PIXEL VERI su un "mondo" (.map-canvas)
    // più grande dello schermo (MAP_WORLD_WIDTH), non più unità scalate
    // dall'SVG alla larghezza del contenitore: serve per poter scorrere
    // liberamente in ogni direzione (richiesta esplicita dell'utente),
    // non solo in verticale. Ogni posizione è CASUALE ma calcolata UNA
    // SOLA VOLTA (in pushHistoryNode/assignChoicePositions) e persistita
    // dentro state.history/state.pendingRoutes — mai ricalcolata da una
    // formula fissa ad ogni render: "ogni torneo a nodi diversi", ma una
    // volta disegnati un nodo e le sue linee restano sempre agli stessi
    // punti per tutta la durata di QUEL torneo.
    // ----------------------------------------------------------------
    const MAP_WORLD_WIDTH = 1000;
    // Tiene ogni pallino (e soprattutto la sua etichetta, più larga del
    // pallino stesso) dentro i bordi del mondo — senza margine un nodo
    // generato vicino al bordo taglierebbe a metà la propria etichetta.
    const MAP_WORLD_MARGIN = 90;
    const MAP_NODE_SPACING = 150;
    // Variazione casuale sulla distanza verticale tra un pallino del
    // sentiero e il successivo — un sentiero perfettamente a griglia (ogni
    // riga alla stessa distanza esatta) sembra meno "disegnato a mano" di
    // uno con un minimo di irregolarità.
    const MAP_NODE_Y_JITTER = 22;
    // Quanto un pallino del sentiero può spostarsi in orizzontale rispetto
    // al precedente — il "vagare" casuale sinistra/destra che rende la
    // disposizione diversa ad ogni torneo, non solo il tipo degli incontri.
    const MAP_NODE_X_DRIFT = 130;
    const MAP_CHOICE_SPACING = 150;
    // 130 (non i 55 "logici" che basterebbero per il solo pallino) per
    // lasciare spazio libero sotto l'HUD flottante fisso (pillola Stelle +
    // pulsante Menu, ~58px) e sotto il banner-suggerimento "Raccogli 10
    // Stelle..." quando visibile (~118px da cima schermo) — ora che la
    // mappa è a tutto schermo (vedi .main.map-mode), quello spazio non
    // esiste più "gratis" sopra un contenitore con bordo come prima.
    const MAP_TOP_PADDING = 130;
    const MAP_BOTTOM_PADDING = 60;
    const ICON_FOR_KIND = { win: '⚔️', lose: '💀', prize: '🎁', malus: '⚠️', start: '🏝️' };
    const MAP_START_POS = { x: MAP_WORLD_WIDTH / 2, y: MAP_TOP_PADDING };

    function randomBetween(min, max) { return min + Math.random() * (max - min); }
    function clampMapX(x) { return Math.max(MAP_WORLD_MARGIN, Math.min(MAP_WORLD_WIDTH - MAP_WORLD_MARGIN, x)); }

    /** Posizione dell'ultimo pallino del sentiero (l'ultima tappa risolta, o il punto di partenza se il torneo è appena iniziato) — punto di partenza per posizionare la prossima tappa/i prossimi bivi. */
    function lastNodePosition(state) {
        if (state.history.length === 0) return MAP_START_POS;
        const last = state.history[state.history.length - 1];
        return { x: last.x, y: last.y };
    }

    /** Aggiunge una tappa al sentiero (state.history) con una posizione CASUALE calcolata una sola volta qui — mai più ricalcolata nei render successivi, a differenza della vecchia formula fissa "alterna sinistra/destra" derivata dall'indice. Usare SEMPRE questa, mai un push diretto su state.history, per ogni nuova tappa risolta (premio/insidia/vittoria/sconfitta). */
    function pushHistoryNode(state, kind, label) {
        const from = lastNodePosition(state);
        state.history.push({
            step: state.step,
            kind: kind,
            label: label,
            x: clampMapX(from.x + randomBetween(-MAP_NODE_X_DRIFT, MAP_NODE_X_DRIFT)),
            y: from.y + MAP_NODE_SPACING + randomBetween(-MAP_NODE_Y_JITTER, MAP_NODE_Y_JITTER)
        });
    }

    /**
     * Assegna a ogni nuovo bivio (`routes`, appena generato da
     * generateRoutes) una posizione CASUALE ma persistente, sparsa
     * attorno al pallino "sei qui" attuale — non più un ventaglio
     * perfettamente equidistante ricalcolato ad ogni render.
     *
     * L'ancora del ventaglio (`anchorX`) è il pallino "sei qui" stesso,
     * ma RICENTRATA quanto basta da lasciare spazio per l'intero
     * ventaglio dentro i bordi del mondo — non ogni singolo punto
     * clampato per conto suo: dopo molte tappe un sentiero casuale può
     * arrivare vicino a un bordo, e clampare ogni bivio SEPARATAMENTE
     * lì li farebbe collassare tutti sullo stesso valore limite (bug
     * reale trovato e corretto in questa sessione — due "Sentiero N"
     * finivano esattamente sovrapposti). Il jitter finale resta piccolo
     * apposta (±30, contro uno `step` sempre più largo) per non
     * reintrodurre lo stesso rischio.
     */
    function assignChoicePositions(state, routes) {
        const from = lastNodePosition(state);
        const baseY = from.y + MAP_CHOICE_SPACING;
        const n = routes.length;
        const totalSpread = Math.min(MAP_WORLD_WIDTH - MAP_WORLD_MARGIN * 2, n <= 2 ? 260 : 420);
        const step = n > 1 ? totalSpread / (n - 1) : 0;
        const halfSpread = totalSpread / 2;
        const anchorX = Math.max(MAP_WORLD_MARGIN + halfSpread, Math.min(MAP_WORLD_WIDTH - MAP_WORLD_MARGIN - halfSpread, from.x));
        routes.forEach((route, i) => {
            const evenX = anchorX + (i - (n - 1) / 2) * step;
            route.x = clampMapX(evenX + randomBetween(-30, 30));
            route.y = baseY + randomBetween(-MAP_NODE_Y_JITTER, MAP_NODE_Y_JITTER);
        });
    }

    /**
     * Trascinamento col MOUSE per scorrere la mappa in ogni direzione
     * (richiesta esplicita: "desktop con il mouse, da app con il touch")
     * — il touch usa lo scroll nativo del browser (già bidirezionale
     * grazie a `overflow: auto` su .map-viewport, nessun JS necessario),
     * qui si aggiunge solo il drag-to-pan per chi non ha un touchscreen.
     * `pointerType !== 'mouse'` esclude il touch di proposito: lo scroll
     * nativo lì è già corretto, aggiungere anche questo trascinamento
     * andrebbe in conflitto con l'inerzia nativa del browser (jank).
     * Il piccolo controllo su `moved` impedisce che un trascinamento reale
     * finisca per attivare per errore il pallino sotto il puntatore al
     * rilascio (un click vero, senza spostamento, resta un click normale).
     */
    function setupMapDragPan(viewport) {
        let dragging = false;
        let moved = false;
        let startX = 0, startY = 0, startLeft = 0, startTop = 0;
        viewport.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'mouse' || e.button !== 0) return;
            dragging = true;
            moved = false;
            startX = e.clientX; startY = e.clientY;
            startLeft = viewport.scrollLeft; startTop = viewport.scrollTop;
        });
        viewport.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                moved = true;
                viewport.classList.add('dragging');
            }
            viewport.scrollLeft = startLeft - dx;
            viewport.scrollTop = startTop - dy;
        });
        const endDrag = () => { dragging = false; viewport.classList.remove('dragging'); };
        viewport.addEventListener('pointerup', endDrag);
        viewport.addEventListener('pointerleave', endDrag);
        // Fase di CAPTURE: intercetta il click prima che arrivi al pallino
        // sotto il puntatore, ma solo se c'è stato un vero trascinamento.
        viewport.addEventListener('click', (e) => {
            if (moved) { e.stopPropagation(); moved = false; }
        }, true);
    }

    function renderMap(state) {
        // Unica vera schermata "di gioco" del torneo: a tutto schermo,
        // niente più contenitore con bordo — vedi il commento su
        // .main.map-mode più sopra.
        mainEl.classList.add('map-mode');
        document.body.classList.add('map-active');
        starsHint.style.display = currentStars() >= CASTLE_THRESHOLD ? 'none' : 'block';

        const history = [Object.assign({ kind: 'start', label: "L'approdo sull'isola" }, MAP_START_POS)].concat(state.history);
        const current = history[history.length - 1];
        const choices = state.pendingRoutes || [];
        const lowestY = choices.reduce((max, c) => Math.max(max, c.y), current.y);
        const canvasHeight = lowestY + MAP_BOTTOM_PADDING;

        content.innerHTML = `
            <div class="map-viewport" id="mapViewport">
                <div class="map-canvas" id="mapCanvas" style="width:${MAP_WORLD_WIDTH}px; height:${canvasHeight}px;">
                    <svg class="map-lines" viewBox="0 0 ${MAP_WORLD_WIDTH} ${canvasHeight}"></svg>
                </div>
            </div>
        `;
        const canvas = document.getElementById('mapCanvas');
        const svg = canvas.querySelector('svg');

        function addLine(a, b, extraClass) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
            line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
            line.setAttribute('class', 'map-line' + (extraClass ? ' ' + extraClass : ''));
            svg.appendChild(line);
        }
        function addNode(pos, kind, opts) {
            opts = opts || {};
            const el = document.createElement(opts.onClick ? 'button' : 'div');
            if (opts.onClick) el.type = 'button';
            el.className = 'map-node ' + kind + (opts.extraClass ? ' ' + opts.extraClass : '');
            el.style.left = pos.x + 'px';
            el.style.top = pos.y + 'px';
            el.innerHTML = `<span class="map-node-dot">${opts.icon || '?'}</span><span class="map-node-label">${opts.label || ''}</span>`;
            if (opts.onClick) el.onclick = opts.onClick;
            canvas.appendChild(el);
        }

        // Linee: dal via ad ogni pallino del sentiero, poi dal pallino
        // "sei qui" a CIASCUna delle nuove scelte (bivio).
        for (let i = 0; i < history.length - 1; i++) addLine(history[i], history[i + 1]);
        choices.forEach((route) => addLine(current, route, 'choice-line'));

        // Sentiero già fatto (start + tappe risolte) — una volta
        // disegnato, resta sempre visibile scorrendo la mappa: le
        // posizioni vengono da state.history, mai ricalcolate.
        history.forEach((node, i) => {
            const isCurrent = i === history.length - 1;
            addNode(node, isCurrent ? 'current' : node.kind, {
                icon: ICON_FOR_KIND[node.kind] || '•',
                label: isCurrent ? 'Sei qui' : ''
            });
        });

        // Bivio: i percorsi ancora da scegliere, "a sorpresa" finché non
        // si sceglie (stesso spirito del vecchio Sentiero 1/2/3) — tranne
        // il Castello, sempre riconoscibile perché è una destinazione
        // precisa, non un incontro casuale.
        choices.forEach((route, index) => {
            const isCastle = route.kind === 'castle';
            addNode(route, 'choice', {
                extraClass: isCastle ? 'castle' : '',
                icon: isCastle ? '🏰' : '❔',
                label: isCastle ? 'Castello di Pegasus' : `Sentiero ${index + 1}`,
                onClick: () => chooseRoute(state, index)
            });
        });

        const viewport = document.getElementById('mapViewport');
        setupMapDragPan(viewport);
        // Centra la vista sul pallino "sei qui" (orizzontale) e scorre in
        // fondo (verticale, dove sta il bivio attuale) SOLO come punto di
        // partenza — la mappa resta comunque liberamente scorribile in
        // ogni direzione dopo, per rivedere il sentiero già fatto o
        // sbirciare il Castello quando è già visibile più in basso.
        // requestAnimationFrame: al momento di questa chiamata il canvas è
        // appena stato inserito nel DOM, il browser non ha ancora calcolato
        // scrollHeight/clientWidth per il nuovo contenuto.
        requestAnimationFrame(() => {
            viewport.scrollLeft = Math.max(0, current.x - viewport.clientWidth / 2);
            viewport.scrollTop = viewport.scrollHeight;
        });
    }

    function chooseRoute(state, index) {
        const route = state.pendingRoutes[index];
        if (window.NativeHaptics) NativeHaptics.light();
        if (route.kind === 'opponent') {
            openWagerModal(getRosterCharacter(route.characterId), (wager) => {
                state.pendingRoutes = null;
                state.pendingEncounter = { characterId: route.characterId, wager: wager, isKaibaGate: false };
                saveState(state);
                launchDuel(state.pendingEncounter);
            });
            return;
        }
        if (route.kind === 'prize') {
            addStars(route.amount);
            pushHistoryNode(state, 'prize', `+${route.amount} Stelle`);
            showToast(`🎁 ${pickRandom(PRIZE_SCENES)} (+${route.amount} Stelle)`);
        } else if (route.kind === 'malus') {
            addStars(-route.amount);
            pushHistoryNode(state, 'malus', `-${route.amount} Stelle`);
            showToast(`⚠️ ${pickRandom(MALUS_SCENES)} (-${route.amount} Stelle)`);
        } else if (route.kind === 'castle') {
            resolveCastlePath(state);
            return;
        }
        state.step++;
        state.pendingRoutes = null;
        saveState(state);
        if (currentStars() <= 0) {
            state.eliminated = true;
            saveState(state);
        }
        render();
    }

    /**
     * 50% di probabilità di dover prima affrontare Kaiba, puntando TUTTE
     * le Stelle, per poter entrare — `atKaibaGate` (non ancora un vero
     * pendingEncounter: quello scatta solo al click su "Sfida!", vedi
     * renderKaibaGateEncounter) fa sì che il prossimo render() mostri la
     * schermata d'incontro drammatica invece di saltare dritti al duello.
     */
    function resolveCastlePath(state) {
        if (Math.random() < 0.5) {
            state.pendingRoutes = null;
            state.atKaibaGate = true;
            saveState(state);
            render();
        } else {
            enterCastleBracket(state);
            state.pendingRoutes = null;
            saveState(state);
            render();
        }
    }

    /**
     * Prepara il tabellone del Castello (semifinale/finale/Pegasus): tre
     * altri Duellanti — MAI Kaiba, che ha già avuto il proprio scontro a
     * parte al Cancello — sono "entrati nel Castello" insieme al
     * giocatore. La semifinale è contro uno scelto a caso tra loro; la
     * finale (quando la semifinale è vinta) contro uno dei DUE rimasti,
     * scelto anche lui a caso — non si simula davvero l'altro incrocio
     * del tabellone, sarebbe complessità aggiuntiva per un dettaglio che
     * il giocatore non vede comunque succedere.
     */
    function enterCastleBracket(state) {
        state.castleReached = true;
        const pool = ROSTER_IDS.slice();
        const finalists = [];
        while (finalists.length < 3 && pool.length > 0) {
            const index = Math.floor(Math.random() * pool.length);
            finalists.push(pool.splice(index, 1)[0]);
        }
        state.castleFinalists = finalists;
        state.castleStage = 'semifinal';
        state.castleSemifinalOpponent = pickRandom(finalists);
    }

    // ----------------------------------------------------------------
    // Modale di puntata
    // ----------------------------------------------------------------
    function openWagerModal(character, onConfirm) {
        const modal = document.getElementById('wagerModal');
        const portrait = document.getElementById('wagerPortrait');
        portrait.className = 'opponent-portrait';
        portrait.innerHTML = '🧑‍🎤';
        if (character && character.image) {
            const img = document.createElement('img');
            img.alt = '';
            img.onload = () => portrait.classList.add('has-image');
            img.onerror = () => img.remove();
            img.src = character.image;
            portrait.appendChild(img);
        }
        document.getElementById('wagerName').textContent = character ? character.name : 'Duellante';
        document.getElementById('wagerTitle').textContent = (character && character.title) || '';
        const quote = character ? getQuote(character.id, 'intro') : '';
        const quoteEl = document.getElementById('wagerQuote');
        quoteEl.textContent = quote;
        quoteEl.style.display = quote ? 'block' : 'none';

        let selected = null;
        const stars = currentStars();
        const buttons = Array.from(document.querySelectorAll('.wager-btn'));
        buttons.forEach((btn) => {
            const amount = parseInt(btn.dataset.wager, 10);
            btn.disabled = amount > stars;
            btn.classList.remove('selected');
            btn.onclick = () => {
                if (btn.disabled) return;
                selected = amount;
                buttons.forEach((b) => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
        });
        document.getElementById('wagerConfirmBtn').onclick = () => {
            if (selected == null) return;
            modal.classList.remove('open');
            onConfirm(selected);
        };
        document.getElementById('wagerCancelBtn').onclick = () => modal.classList.remove('open');
        modal.classList.add('open');
    }

    // ----------------------------------------------------------------
    // Lancio del vero duello — vedi js/duel-session.js (mode=tournament)
    // per come questa pagina viene riconosciuta come "da dove torna" il
    // pulsante Continua a fine duello.
    // ----------------------------------------------------------------
    // Colonna sonora del duello — fissa per ora (richiesta esplicita
    // dell'utente: "per ora una a tua scelta fissa"), diversa da quella
    // della mappa (vedi initAudioManager qui sopra) e dal brano di
    // battaglia generico di default del motore (duelMonstersCore.html lo
    // sceglierebbe da solo altrimenti): Kaiba e Pegasus, gli unici due
    // scontri davvero "unici" del torneo, hanno ciascuno il proprio;
    // ogni altro Duellante (percorso normale E semifinale/finale del
    // Castello) condivide lo stesso brano di battaglia generico. Sfrutta
    // il parametro ?music= già esistente in duelMonstersCore.html (nato
    // per Duello Libero), nessuna modifica la a quella pagina.
    const BATTLE_TRACK = '16. Duel Ground.mp3';
    const KAIBA_TRACK = '37. Seto.mp3';
    const PEGASUS_TRACK = '31. Finals.mp3';

    function launchDuel(encounter) {
        const difficulty = (encounter.isKaibaGate || encounter.castleStage) ? 'Difficile' : 'Medio';
        let track = BATTLE_TRACK;
        if (encounter.isKaibaGate) track = KAIBA_TRACK;
        else if (encounter.castleStage === 'pegasus') track = PEGASUS_TRACK;
        const url = `duelMonstersCore.html?mode=tournament&tournament=${TOURNAMENT_ID}&character=${encodeURIComponent(encounter.characterId)}&difficulty=${difficulty}&music=${encodeURIComponent(track)}`;
        window.location.href = url;
    }

    /**
     * Consuma la breadcrolla generica "com'è appena finito l'ultimo
     * duello" (js/duel-session.js#finish) SOLO se corrisponde davvero a
     * un pendingEncounter di QUESTO torneo — altrimenti (es. l'utente ha
     * giocato un Duello Libero in un'altra scheda e poi è tornato qui
     * senza passare da un vero duello di torneo) non tocca nulla.
     */
    function resolvePendingEncounterIfDone(state) {
        if (!state.pendingEncounter) return false;
        let outcome = null;
        try {
            const raw = sessionStorage.getItem('ygoLastDuelOutcome');
            if (raw) outcome = JSON.parse(raw);
        } catch (e) { /* noop */ }
        if (!outcome || outcome.mode !== 'tournament' || outcome.tournamentId !== TOURNAMENT_ID) return false;
        try { sessionStorage.removeItem('ygoLastDuelOutcome'); } catch (e) { /* noop */ }

        const enc = state.pendingEncounter;
        const character = getRosterCharacter(enc.characterId);
        const name = character ? character.name : 'il Duellante';
        const won = outcome.playerWon === true;
        // Reazione IN CARATTERE dell'AVVERSARIO appena affrontato (mai del
        // giocatore): se il giocatore vince, il Duellante pronuncia una
        // battuta da 'lose' (l'ha persa lui); se perde, ne pronuncia una da
        // 'win' (l'avversario gongola) — alla Forbidden Memories.
        const reaction = getQuote(enc.characterId, won ? 'lose' : 'win');

        // Duelli del Castello (semifinale/finale/Pegasus): niente puntata,
        // è vittoria-o-eliminazione secca — gestiti PRIMA del ramo
        // Cancello di Kaiba/percorso normale qui sotto, che invece
        // riguardano sempre una vera posta di Stelle.
        if (enc.castleStage) {
            if (won) {
                const reward = enc.castleStage === 'pegasus' ? 15 : (10 + Math.floor(Math.random() * 6));
                addStars(reward);
                pushHistoryNode(state, 'win', `Vittoria su ${name} (+${reward})`);
                if (window.NativeHaptics) NativeHaptics.success();
                if (enc.castleStage === 'semifinal') {
                    state.castleStage = 'final';
                    state.castleFinalOpponent = pickRandom(state.castleFinalists.filter((id) => id !== enc.characterId));
                    showToast(`⚔️ Hai sconfitto ${name} in semifinale! +${reward} Stelle. Ti attende la finale!`, reaction);
                } else if (enc.castleStage === 'final') {
                    state.castleStage = 'pegasus';
                    showToast(`🏆 Hai vinto la finale contro ${name}! +${reward} Stelle. Ora affronti Pegasus in persona.`, reaction);
                } else if (enc.castleStage === 'pegasus') {
                    state.castleStage = 'champion';
                    showToast(`👑 Hai sconfitto Maximillion Pegasus! Sei il Campione del Regno dei Duellanti!`, reaction);
                }
            } else {
                if (window.NativeHaptics) NativeHaptics.error();
                state.eliminated = true;
                showToast(`💀 ${name} ti ha sconfitto: il tuo cammino nel Castello finisce qui.`, reaction);
            }
            state.pendingEncounter = null;
            saveState(state);
            return true;
        }

        if (won) {
            addStars(enc.wager);
            if (window.NativeHaptics) NativeHaptics.success();
            if (enc.isKaibaGate) {
                enterCastleBracket(state);
                showToast(`🏆 Hai sconfitto ${name}! Il Castello di Pegasus si apre davanti a te.`, reaction);
            } else {
                pushHistoryNode(state, 'win', `Vittoria su ${name} (+${enc.wager})`);
                state.step++;
                showToast(`⚔️ Hai sconfitto ${name}! +${enc.wager} Stelle.`, reaction);
            }
        } else {
            addStars(-enc.wager);
            if (window.NativeHaptics) NativeHaptics.error();
            if (enc.isKaibaGate) {
                showToast(`💀 ${name} ti ha sconfitto: le tue Stelle sono andate perdute.`, reaction);
            } else {
                pushHistoryNode(state, 'lose', `Sconfitta contro ${name} (-${enc.wager})`);
                state.step++;
                showToast(`💀 ${name} ti ha sconfitto. -${enc.wager} Stelle.`, reaction);
            }
            if (currentStars() <= 0) state.eliminated = true;
        }
        state.pendingEncounter = null;
        state.atKaibaGate = false;
        saveState(state);
        return true;
    }

    // ----------------------------------------------------------------
    // Render principale — stato macchina a stati (vedi i commenti su
    // ogni ramo per quando si applica).
    // ----------------------------------------------------------------
    function render() {
        let state = loadState();
        // Ripristinata ad ogni render, poi eventualmente riattivata solo da
        // renderMap() qui sotto — MAI lasciata attiva su una schermata-card
        // (inizio/eliminazione/castello), che deve restare un riquadro
        // centrato, non a tutto schermo.
        mainEl.classList.remove('map-mode');
        document.body.classList.remove('map-active');

        if (!state) {
            // Prima di iniziare non c'è ancora nulla da sospendere/abbandonare:
            // solo una freccia Indietro minima verso l'elenco Tornei.
            hudBackBtn.style.display = 'flex';
            menuFab.style.display = 'none';
            starsBar.style.display = 'none';
            starsHint.style.display = 'none';
            renderStartScreen();
            return;
        }
        hudBackBtn.style.display = 'none';
        menuFab.style.display = 'flex';

        // Un esito di duello fresco per QUESTO torneo va sempre applicato
        // per primo, prima di decidere cos'altro mostrare — altrimenti si
        // rischierebbe di mostrare ancora "duello in sospeso" subito dopo
        // essere tornati da un duello già concluso.
        resolvePendingEncounterIfDone(state);

        starsBar.style.display = 'flex';
        document.getElementById('starsCount').textContent = currentStars();

        if (state.eliminated) { renderEliminated(); return; }
        if (state.castleReached) {
            // Un pendingEncounter (sfida del Castello in sospeso, es.
            // pagina ricaricata a metà) ha comunque priorità sulla
            // normale schermata "sfida X" della tappa attuale.
            if (state.pendingEncounter) { renderResumeEncounter(state); return; }
            renderCastleStage(state);
            return;
        }
        if (state.pendingEncounter) { renderResumeEncounter(state); return; }
        // Cancello di Kaiba: sorteggiato in resolveCastlePath, mostra la
        // schermata d'incontro drammatica finché il giocatore non preme
        // "Sfida!" (che trasforma questo in un vero pendingEncounter, sopra).
        if (state.atKaibaGate) { renderKaibaGateEncounter(state); return; }
        if (!state.pendingRoutes) generateRoutes(state);
        state = loadState();
        renderMap(state);
    }

    render();
</script>
</body>
</html>
