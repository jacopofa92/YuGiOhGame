<title>Yu-Gi-Oh! Duel Arena — Battle City</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overscroll-behavior-y: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { min-height: 100%; }

    /* =====================================================================
       Identità visiva DELIBERATAMENTE diversa dal Regno dei Duellanti
       (oro/pergamena/isola): qui è il Duel Disk di Kaiba — ciano elettrico,
       magenta, vetro scuro e griglie luminose. Le due pagine non devono
       sembrare la stessa schermata ricolorata.
       ===================================================================== */
    :root {
        --bc-cyan: #22d3ee;
        --bc-cyan-soft: #67e8f9;
        --bc-magenta: #e879f9;
        --bc-amber: #fbbf24;
        --ink: #d7e3f4;
        --ink-dim: #8fa3c0;
        --bad: #f87171;
        --good: #34d399;
        --glass: rgba(10, 20, 38, 0.82);
        --glass-line: rgba(34, 211, 238, 0.28);
    }

    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #050912 center/cover fixed no-repeat;
        min-height: 100vh;
    }
    /* Lo sfondo cambia con la FASE del torneo (città → dirigibile → torre):
       impostato da applyPhaseBackdrop() come variabile, così basta una
       riga sola per ogni fase invece di tre classi con tre regole. Se
       l'immagine della fase non esiste ancora nel repository (oggi solo
       il dirigibile ce l'ha) resta il gradiente di fondo qui sotto, che è
       già una scena urbana notturna accettabile — vedi MAP_BACKDROPS. */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
            radial-gradient(1200px 600px at 50% -10%, rgba(34, 211, 238, 0.18), transparent 70%),
            linear-gradient(180deg, rgba(5, 9, 18, 0.72) 0%, rgba(5, 9, 18, 0.84) 55%, rgba(2, 4, 10, 0.94) 100%);
        pointer-events: none;
    }
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.35;
        background-image: repeating-linear-gradient(0deg, rgba(34, 211, 238, 0.07) 0px, rgba(34, 211, 238, 0.07) 1px, transparent 1px, transparent 4px);
    }
    body.city-map-active::before {
        background: linear-gradient(180deg, rgba(5, 9, 18, 0.12), rgba(3, 7, 14, 0.24));
    }
    body.city-map-active::after { opacity: 0.08; }

    .main {
        position: relative;
        z-index: 1;
        padding: 74px 18px 60px;
        max-width: 760px;
        margin: 0 auto;
    }
    .main.map-mode {
        width: 100%;
        max-width: none;
        min-height: 100dvh;
        margin: 0;
        /* Poco spazio sotto: la legenda ancorata in fondo (vedi .legend)
           deve stare a ridosso del bordo dello schermo, non a 24px. */
        padding: 74px clamp(10px, 2vw, 28px) 8px;
    }
    .main.map-mode #content {
        min-height: calc(100dvh - 82px);
        display: flex;
        flex-direction: column;
    }

    /* ---------------------------------------------------------------
       HUD flottante — stesso principio del Regno dei Duellanti ("deve
       sembrare un gioco, non una pagina filtro con top menu"), ma con
       il contatore delle Carta Locazione al posto delle Stelle.
       --------------------------------------------------------------- */
    .hud-top {
        position: fixed;
        top: max(14px, env(safe-area-inset-top, 14px));
        left: 14px;
        right: 14px;
        z-index: 300;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        pointer-events: none;
    }
    .hud-top > * { pointer-events: auto; }
    .hud-back-btn, .menu-fab {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--glass-line);
        background: var(--glass);
        color: var(--bc-cyan-soft);
        font-size: 1.25rem;
        cursor: pointer;
        backdrop-filter: blur(6px);
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.22);
    }
    .hud-back-btn:active, .menu-fab:active { transform: scale(0.94); }

    .locator-bar {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 15px;
        border-radius: 12px;
        border: 1px solid var(--glass-line);
        background: var(--glass);
        backdrop-filter: blur(6px);
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.18);
    }
    .locator-pips { display: flex; gap: 4px; }
    /* 6 tacche = le 6 Carta Locazione che servono per le finali: il
       progresso verso l'obiettivo si legge a colpo d'occhio, senza dover
       ricordare a memoria quante ne servono. Oltre la sesta il numero
       continua a salire (si può puntare più di 6), le tacche no. */
    .locator-pip {
        width: 9px; height: 15px;
        border-radius: 2px;
        border: 1px solid rgba(34, 211, 238, 0.45);
        background: rgba(34, 211, 238, 0.09);
    }
    .locator-pip.filled {
        background: linear-gradient(180deg, var(--bc-cyan-soft), var(--bc-cyan));
        box-shadow: 0 0 9px rgba(34, 211, 238, 0.8);
    }
    .locator-count { font-weight: bold; color: var(--bc-cyan-soft); font-size: 1.05rem; }
    .locator-count small { color: var(--ink-dim); font-weight: normal; font-size: 0.72rem; }

    /* ---------------------------------------------------------------
       Schermate "a quadro" (inizio / eliminato / campione)
       --------------------------------------------------------------- */
    .panel {
        background: var(--glass);
        border: 1px solid var(--glass-line);
        border-radius: 18px;
        padding: 26px 22px;
        backdrop-filter: blur(8px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }
    .panel h2 {
        font-size: 1.5rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: linear-gradient(180deg, #fff, var(--bc-cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 6px;
    }
    .panel .panel-sub { color: var(--ink-dim); font-size: 0.85rem; margin-bottom: 18px; }
    .rules-list { list-style: none; display: grid; gap: 10px; margin-bottom: 20px; }
    .rules-list li {
        display: flex; gap: 10px; align-items: flex-start;
        color: var(--ink); font-size: 0.86rem; line-height: 1.45;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(34, 211, 238, 0.14);
        background: rgba(34, 211, 238, 0.05);
    }
    .rules-list li span:first-child { font-size: 1.05rem; }

    .big-btn {
        border: none;
        border-radius: 12px;
        padding: 14px 22px;
        font-size: 0.98rem;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        color: #04121a;
        background: linear-gradient(145deg, var(--bc-cyan-soft), var(--bc-cyan));
        box-shadow: 0 8px 22px rgba(34, 211, 238, 0.32);
    }
    .big-btn:active { transform: translateY(1px); }
    .big-btn.secondary {
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: none;
    }
    .big-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .modal-actions { display: flex; gap: 10px; }

    .difficulty-row { display: flex; gap: 10px; margin-bottom: 18px; }
    .difficulty-btn {
        flex: 1;
        padding: 12px 8px;
        border-radius: 11px;
        border: 1px solid rgba(34, 211, 238, 0.25);
        background: rgba(34, 211, 238, 0.06);
        color: var(--ink);
        font-size: 0.86rem;
        font-weight: bold;
        cursor: pointer;
    }
    .difficulty-btn.selected {
        border-color: var(--bc-cyan);
        background: rgba(34, 211, 238, 0.2);
        color: #fff;
        box-shadow: 0 0 16px rgba(34, 211, 238, 0.35);
    }
    .tourney-stats { color: var(--ink-dim); font-size: 0.78rem; margin-bottom: 14px; }

    /* =====================================================================
       FASE 1 — LA CITTÀ: griglia di isolati invece del sentiero a bivi del
       Regno dei Duellanti. Qui non si sceglie fra 2-3 percorsi ciechi: ci
       si MUOVE liberamente su una scacchiera di quartieri, e il Radar del
       Duel Disk rivela in anticipo cosa c'è nelle celle adiacenti — quindi
       la scelta è informata e tattica (dove conviene passare), non una
       scommessa al buio. È la differenza voluta fra i due tornei.
       ===================================================================== */
    .sector-head {
        display: flex; align-items: center; justify-content: space-between;
        align-self: center;
        width: min(100%, 760px);
        gap: 10px; margin-bottom: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(34, 211, 238, 0.18);
        border-radius: 12px;
        background: rgba(5, 12, 24, 0.5);
        backdrop-filter: blur(6px);
    }
    .sector-title { font-size: 0.95rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--bc-cyan-soft); }
    .sector-hint { color: var(--ink-dim); font-size: 0.75rem; text-align: right; }

    .city-grid {
        position: relative;
        display: grid;
        width: min(calc(100vw - clamp(20px, 4vw, 56px)), calc(100dvh - 265px));
        min-width: min(92vw, 320px);
        align-self: center;
        gap: 0;
        padding: clamp(4px, 1.2vmin, 12px);
        border: 0;
        background: transparent;
        box-shadow: none;
    }
    /* Ogni casella è una PEDINA in piedi (js/ui/board-pieces.js, SVG con
       volume e ombra) appoggiata su un ALONE a terra (::before, un'ellisse
       schiacciata: è la prospettiva dall'alto dello sfondo). Erano emoji
       dentro un cerchio — richiesta dell'utente di sostituirle con
       "qualcosa in 3D, come immagini" e di rendere più EVIDENTE dove ci si
       può spostare. Per questo la gerarchia visiva è a tre livelli:
       raggiungibile (accesa, sollevata, con percorso e freccia) > rivelata
       ma lontana (attenuata, leggibile per pianificare) > ignota (ancora
       più spenta). Prima le caselle raggiungibili si distinguevano dalle
       altre solo per un anello ciano un filo più acceso. */
    .city-cell {
        position: relative;
        z-index: 1;
        aspect-ratio: 1;
        appearance: none;
        font-family: inherit;
        border-radius: 50%;
        border: 0;
        padding: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--ink-dim);
        cursor: default;
        overflow: visible;
        left: var(--node-x, 0px);
        top: var(--node-y, 0px);
        transition: transform .22s cubic-bezier(.2,.85,.2,1), filter .25s ease, opacity .25s ease;
    }
    .city-cell::before {
        content: '';
        position: absolute;
        left: 50%; top: 72%;
        width: var(--node-size, 56%);
        aspect-ratio: 2.6;
        border-radius: 50%;
        border: 1px solid rgba(144, 210, 235, 0.16);
        background: radial-gradient(ellipse, rgba(6,18,34,.62), rgba(6,18,34,.2) 60%, transparent 74%);
        transform: translate(-50%, -50%);
        transition: transform .2s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
    }
    .city-cell > * { position: relative; z-index: 2; }
    .city-cell .bp-piece {
        width: 76%;
        height: auto;
        display: block;
        margin-top: -14%;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
        transition: transform .25s cubic-bezier(.2,.85,.2,1);
    }
    /* L'etichetta compare SOLO dove serve decidere: sulle caselle
       raggiungibili e sulla zona di decollo. Su tutte e 25 insieme era
       rumore, e con le pedine il tipo di casella si legge già a colpo
       d'occhio (c'è anche la legenda). */
    /* Targhetta appoggiata sul bordo basso del proprio alone, DENTRO la
       casella: sotto la casella cadeva nel varco da cui arriva il percorso
       della casella sopra il giocatore e lo copriva, e spostata sopra
       finiva sotto la pedina vicina, come se fosse sua (entrambi visti
       negli screenshot). */
    .city-cell > .cell-label {
        display: none;
        position: absolute;
        left: 50%; top: 84%;
        transform: translate(-50%, -50%);
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 0.52rem;
        font-weight: bold;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        white-space: nowrap;
        line-height: 1.4;
        color: #05202c;
        background: linear-gradient(180deg, #c9fbff, #22d3ee);
        box-shadow: 0 2px 8px rgba(0,0,0,.5), 0 0 10px rgba(34,211,238,.5);
    }
    .city-cell.reachable > .cell-label,
    .city-cell.heliport > .cell-label { display: block; }
    .city-cell.heliport > .cell-label {
        color: #2a0631;
        background: linear-gradient(180deg, #fbe0ff, #e879f9);
        box-shadow: 0 2px 8px rgba(0,0,0,.5), 0 0 10px rgba(232,121,249,.55);
    }
    .city-cell.revealed::before {
        border-color: rgba(34, 211, 238, 0.32);
        background: radial-gradient(ellipse, rgba(5,24,42,.72), rgba(5,24,42,.24) 60%, transparent 74%);
    }
    /* Lontane = attenuate ma ancora leggibili: il radar serve proprio a
       pianificare due mosse avanti. Ignote e già risolte ancora di più. */
    .city-cell:not(.reachable):not(.player) { opacity: .62; filter: saturate(.6) brightness(.82); }
    .city-cell.hidden-cell:not(.reachable) { opacity: .48; }
    .city-cell.resolved:not(.reachable) { opacity: .4; filter: saturate(.25) brightness(.8); }
    .city-cell.heliport:not(.reachable) { opacity: .92; filter: none; }

    /* Solo le celle ortogonalmente adiacenti al segnalino sono raggiungibili. */
    .city-cell.reachable { cursor: pointer; z-index: 5; }
    .city-cell.reachable::before {
        border: 2px solid var(--bc-cyan);
        background: radial-gradient(ellipse, rgba(34,211,238,.5), rgba(34,211,238,.16) 58%, transparent 74%);
        box-shadow: 0 0 18px rgba(34,211,238,.6), inset 0 0 10px rgba(125,243,255,.45);
        animation: haloPulse 1.6s ease-in-out infinite;
    }
    /* "Ping" del radar: un'onda che si allarga dall'alone e svanisce. */
    .city-cell.reachable::after {
        content: '';
        position: absolute;
        left: 50%; top: 72%;
        width: var(--node-size, 56%);
        aspect-ratio: 2.6;
        border-radius: 50%;
        border: 2px solid rgba(125,243,255,.85);
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: haloPing 1.6s ease-out infinite;
    }
    .city-cell.reachable .bp-piece {
        filter: drop-shadow(0 6px 4px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(125,243,255,.55));
        animation: pieceFloat 1.8s ease-in-out infinite;
    }
    @media (hover: hover) and (pointer: fine) {
        .city-cell.reachable:hover { transform: scale(1.1); z-index: 8; filter: brightness(1.15); }
    }
    .city-cell.reachable:focus-visible { outline: 2px solid #fff; outline-offset: -5px; }
    .city-cell.reachable:active { transform: scale(0.94); }
    @keyframes haloPulse {
        0%, 100% { box-shadow: 0 0 12px rgba(34,211,238,.45), inset 0 0 8px rgba(125,243,255,.35); }
        50%      { box-shadow: 0 0 26px rgba(34,211,238,.8), inset 0 0 12px rgba(125,243,255,.6); }
    }
    @keyframes haloPing {
        0%   { transform: translate(-50%, -50%) scale(.8); opacity: .9; }
        100% { transform: translate(-50%, -50%) scale(1.75); opacity: 0; }
    }
    /* Galleggia e ridiscende morbido, senza rimbalzi (vedi la regola del
       progetto sugli atterraggi 3D: decelerare, mai sforare). */
    @keyframes pieceFloat {
        0%, 100% { transform: translateY(-4%); }
        50%      { transform: translateY(-13%); }
    }

    /* Percorsi dal segnalino alle caselle raggiungibili: un SVG sotto le
       pedine, ridisegnato ad ogni mossa (layoutCityOverlay). Compaiono a
       segnalino ARRIVATO (ritardo pari alla sua transizione), altrimenti
       partirebbero dal punto d'arrivo mentre lui sta ancora scivolando. */
    .city-routes {
        position: absolute;
        inset: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
    }
    .city-routes .route { animation: routeIn .35s ease-out .42s both; }
    .city-routes .route-glow { stroke: rgba(34,211,238,.32); stroke-width: 11; stroke-linecap: round; fill: none; filter: blur(3px); }
    .city-routes .route-line {
        stroke: #9ff6ff; stroke-width: 3.5; stroke-linecap: round; fill: none;
        stroke-dasharray: 2 9;
        animation: routeFlow .8s linear infinite;
    }
    .city-routes .route-arrow {
        fill: none; stroke: #f0feff; stroke-width: 3.2;
        stroke-linecap: round; stroke-linejoin: round;
        filter: drop-shadow(0 0 4px #22d3ee);
    }
    @keyframes routeFlow { to { stroke-dashoffset: -11; } }
    @keyframes routeIn { from { opacity: 0; } to { opacity: 1; } }

    .city-cell.player::before { border-color: rgba(251,191,36,.45); }
    .city-player-token {
        position: absolute;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #fff;
        pointer-events: none;
        /* La punta della puntina cade poco sotto il centro della casella,
           non il suo baricentro: da qui il -66% verticale. Più su
           occuperebbe il varco del percorso verso la casella superiore. */
        transform: translate(-50%, -66%);
        transition: left .46s cubic-bezier(.22,.8,.22,1), top .46s cubic-bezier(.22,.8,.22,1), filter .3s ease;
        filter: drop-shadow(0 0 8px rgba(251,191,36,.75));
    }
    .city-player-token .bp-piece { width: 100%; height: auto; display: block; }
    .city-player-token::before {
        content: '';
        position: absolute;
        left: 50%; top: 92%;
        width: 120%; aspect-ratio: 2.6;
        z-index: -1;
        border-radius: 50%;
        border: 1px solid var(--bc-amber);
        background: radial-gradient(ellipse, rgba(251,191,36,.45), rgba(95,62,5,.16) 62%, transparent 74%);
        transform: translate(-50%, -50%);
        animation: playerTokenPulse 1.6s ease-in-out infinite;
    }
    .city-player-token small {
        position: absolute; top: 100%; left: 50%;
        transform: translate(-50%, 55%);
        font-size: .48rem; font-weight: bold; letter-spacing: .5px;
        white-space: nowrap; text-transform: uppercase; color: #ffe7a0;
        text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,.8);
    }
    @keyframes playerTokenPulse {
        0%,100% { transform: translate(-50%, -50%) scale(.9); box-shadow: 0 0 10px rgba(251,191,36,.3); }
        50%     { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 20px rgba(251,191,36,.55); }
    }
    .city-cell.heliport::before {
        border: 2px solid var(--bc-magenta);
        background: radial-gradient(ellipse, rgba(232,121,249,.42), rgba(77,18,86,.18) 58%, transparent 74%);
        animation: heliportPulse 1.4s ease-in-out infinite;
    }
    .city-cell.heliport .bp-rotor { transform-origin: 31.5px 15.6px; animation: rotorSpin .25s linear infinite; }
    @keyframes rotorSpin { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.25); } }
    @keyframes heliportPulse {
        0%, 100% { box-shadow: 0 0 14px rgba(232, 121, 249, 0.4); }
        50%      { box-shadow: 0 0 30px rgba(232, 121, 249, 0.75); }
    }
    /* Comparsa del radar: ogni cella appena rivelata "sboccia" una volta
       sola (classe rimossa dal render successivo). */
    @keyframes radarReveal {
        from { opacity: 0; transform: scale(0.7); }
        to   { opacity: 1; transform: scale(1); }
    }
    .city-cell.just-revealed { animation: radarReveal 0.32s ease-out; }

    /* ANCORATA IN BASSO (richiesta dell'utente): `margin-top: auto` la spinge
       al fondo di #content, che occupa tutta l'altezza dello schermo, e
       `sticky` la tiene a vista in fondo anche quando la mappa è più alta
       dello schermo (telefoni piccoli). Prima restava appoggiata sotto la
       griglia, a metà pagina. */
    .legend {
        align-self: center;
        width: min(100%, 760px);
        display: flex; flex-wrap: wrap; gap: 8px 14px;
        margin-top: auto;
        position: sticky;
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        z-index: 4;
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid rgba(34, 211, 238, 0.14);
        background: rgba(5, 12, 24, 0.52);
        backdrop-filter: blur(6px);
    }
    .legend span { color: var(--ink-dim); font-size: 0.72rem; display: inline-flex; align-items: center; gap: 5px; }
    .legend .bp-piece { width: 24px; height: 24px; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
    /* Il campione "puoi andarci": lo stesso alone ciano delle caselle raggiungibili. */
    .legend .legend-reach {
        width: 22px; aspect-ratio: 2.6; flex: none;
        border-radius: 50%;
        border: 2px solid var(--bc-cyan);
        background: radial-gradient(ellipse, rgba(34,211,238,.5), transparent 74%);
        box-shadow: 0 0 8px rgba(34,211,238,.6);
    }
    .legend .legend-strong { color: #fff; font-weight: bold; }

    /* Oggetti del Duel Disk e missione in corso: una riga sotto
       l'intestazione del distretto. Pulsanti piccoli e leggibili: il Radar
       potenziato si usa toccandolo, lo Scudo è solo un indicatore (scatta da
       solo quando serve). */
    .item-row {
        align-self: center;
        width: min(100%, 760px);
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
        margin: 0 0 6px;
        min-height: 30px;
    }
    .item-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 11px;
        font: inherit; font-size: 0.74rem; font-weight: 700;
        color: #fff;
        border-radius: 999px;
        border: 1px solid rgba(34, 211, 238, 0.4);
        background: rgba(5, 12, 24, 0.62);
        backdrop-filter: blur(6px);
    }
    button.item-btn { cursor: pointer; }
    button.item-btn:not(:disabled):active { transform: scale(0.96); }
    .item-btn:disabled { opacity: 0.45; cursor: default; }
    .item-btn.item-passive { cursor: default; border-color: rgba(34, 211, 238, 0.22); }
    .item-btn .item-count { color: var(--bc-cyan-soft); font-variant-numeric: tabular-nums; }
    .item-chip-quest { border-color: rgba(247, 215, 116, 0.6); color: #f7d774; }
    .item-chip-blackout { border-color: rgba(255, 138, 122, 0.7); color: #ff8a7a; animation: bcBlackout 1.2s ease-in-out infinite; }
    @keyframes bcBlackout { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { .item-chip-blackout { animation: none; } }
    /* Il bersaglio della missione: un anello dorato attorno alla pedina. */
    .city-cell.quest-target::before {
        border-color: #f7d774 !important;
        box-shadow: 0 0 14px rgba(247, 215, 116, 0.75) !important;
    }

    .sector-actions { margin-top: 14px; display: flex; gap: 10px; }
    .sector-actions .big-btn { flex: 1; }

    /* =====================================================================
       FASE 2 — IL DIRIGIBILE: tabellone a eliminazione diretta, un
       linguaggio visivo completamente diverso dalla griglia. Gli altri
       incontri si risolvono da soli e si vedono riempirsi: non si è più
       soli su una mappa, si è dentro un torneo con altri 7 finalisti.
       ===================================================================== */
    .bracket {
        display: grid;
        gap: 10px;
        margin-bottom: 6px;
    }
    .bracket-round { display: grid; gap: 8px; }
    .bracket-round-name {
        font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase;
        color: var(--bc-cyan-soft); margin-bottom: 2px;
    }
    .match {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 11px;
        border: 1px solid rgba(120, 160, 200, 0.16);
        background: rgba(255, 255, 255, 0.03);
    }
    .match.is-player { border-color: var(--bc-amber); background: rgba(251, 191, 36, 0.09); }
    .match.decided { opacity: 0.72; }
    .match .vs { font-size: 0.62rem; color: var(--ink-dim); letter-spacing: 1px; }
    .fighter {
        display: flex; align-items: center; gap: 7px;
        font-size: 0.78rem; color: var(--ink);
        min-width: 0;
    }
    .fighter:last-child { justify-content: flex-end; text-align: right; }
    .fighter .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fighter.winner { color: #fff; font-weight: bold; }
    .fighter.loser { color: var(--ink-dim); text-decoration: line-through; opacity: 0.7; }
    .fighter .avatar {
        width: 26px; height: 26px; border-radius: 7px; flex: none;
        background: rgba(34, 211, 238, 0.12);
        border: 1px solid rgba(34, 211, 238, 0.25);
        display: flex; align-items: center; justify-content: center;
        font-size: 0.72rem; overflow: hidden;
    }
    .fighter .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* =====================================================================
       FASE 3 — LA TORRE KAIBA: scalata verticale. Terzo linguaggio visivo:
       non una griglia, non un tabellone, ma dei piani che si accendono uno
       dopo l'altro salendo verso la cima.
       ===================================================================== */
    .tower { display: flex; flex-direction: column-reverse; gap: 8px; margin-bottom: 16px; }
    .tower-floor {
        position: relative;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(120, 160, 200, 0.16);
        background: rgba(255, 255, 255, 0.03);
        color: var(--ink-dim);
        font-size: 0.84rem;
    }
    .tower-floor .floor-name { font-weight: bold; letter-spacing: 1px; text-transform: uppercase; font-size: 0.7rem; }
    .tower-floor.done { border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.08); color: var(--good); }
    .tower-floor.current {
        border-color: var(--bc-magenta);
        background: rgba(232, 121, 249, 0.12);
        color: #fff;
        box-shadow: 0 0 24px rgba(232, 121, 249, 0.3);
    }
    /* Un piano non ancora raggiunto non deve svelare chi ci aspetta: la
       tensione della scalata sta proprio nel non saperlo ancora. */
    .tower-floor.locked .floor-who { filter: blur(4px); }

    /* ---------------------------------------------------------------
       Ritratto avversario / modali / toast — stessa grammatica del
       Regno dei Duellanti (coerenza d'app), ripalettata sul ciano.
       --------------------------------------------------------------- */
    .modal-backdrop {
        position: fixed; inset: 0; z-index: 400;
        background: rgba(2, 5, 12, 0.82);
        display: none; align-items: center; justify-content: center;
        padding: 20px;
        backdrop-filter: blur(4px);
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
        width: min(420px, 100%);
        max-height: 86dvh;
        overflow-y: auto;
        background: linear-gradient(180deg, rgba(12, 22, 40, 0.97), rgba(5, 10, 22, 0.98));
        border: 1px solid var(--glass-line);
        border-radius: 18px;
        padding: 22px 20px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .modal-card h3 { font-size: 1.2rem; margin-bottom: 4px; }
    .opponent-portrait {
        width: 96px; height: 96px; margin: 0 auto 12px;
        border-radius: 16px;
        border: 1px solid rgba(34, 211, 238, 0.35);
        background: rgba(34, 211, 238, 0.1);
        display: flex; align-items: center; justify-content: center;
        font-size: 2.4rem; overflow: hidden;
        box-shadow: 0 0 28px rgba(34, 211, 238, 0.25);
    }
    .opponent-portrait.has-image { font-size: 0; }
    .opponent-portrait img { width: 100%; height: 100%; object-fit: cover; }
    .opponent-title { color: var(--ink-dim); font-size: 0.78rem; margin-bottom: 10px; }
    .opponent-quote {
        color: var(--bc-cyan-soft); font-size: 0.82rem; font-style: italic;
        line-height: 1.45; margin-bottom: 14px;
    }

    /* Puntata LIBERA (non le puntate fisse del Regno dei Duellanti):
       richiesta esplicita — "è possibile puntare un numero a piacere di
       location cards". Stepper + slider, così su telefono si arriva al
       numero voluto sia a tocchi singoli sia trascinando. */
    .wager-box {
        border: 1px solid rgba(34, 211, 238, 0.2);
        background: rgba(34, 211, 238, 0.05);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 16px;
    }
    .wager-stepper { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
    .wager-step-btn {
        width: 44px; height: 44px; border-radius: 12px;
        border: 1px solid rgba(34, 211, 238, 0.35);
        background: rgba(34, 211, 238, 0.1);
        color: var(--bc-cyan-soft); font-size: 1.4rem; cursor: pointer;
    }
    .wager-step-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .wager-step-btn:active:not(:disabled) { transform: scale(0.92); }
    .wager-value { font-size: 2rem; font-weight: bold; color: #fff; min-width: 62px; }
    .wager-value small { display: block; font-size: 0.62rem; color: var(--ink-dim); letter-spacing: 1px; font-weight: normal; }
    .wager-slider { width: 100%; accent-color: var(--bc-cyan); }
    .wager-shortcuts { display: flex; gap: 8px; margin-top: 10px; }
    .wager-shortcuts button {
        flex: 1; padding: 7px; border-radius: 9px;
        border: 1px solid rgba(34, 211, 238, 0.22);
        background: rgba(34, 211, 238, 0.06);
        color: var(--ink); font-size: 0.74rem; cursor: pointer;
    }
    .wager-forced {
        color: var(--bad); font-size: 0.8rem; line-height: 1.45;
        border: 1px solid rgba(248, 113, 113, 0.3);
        background: rgba(248, 113, 113, 0.08);
        border-radius: 12px; padding: 12px; margin-bottom: 16px;
    }

    .menu-options { display: grid; gap: 9px; }
    .menu-option-btn {
        padding: 13px; border-radius: 11px;
        border: 1px solid rgba(34, 211, 238, 0.18);
        background: rgba(34, 211, 238, 0.06);
        color: var(--ink); font-size: 0.88rem; cursor: pointer;
    }
    .menu-option-btn.danger { border-color: rgba(248, 113, 113, 0.35); background: rgba(248, 113, 113, 0.08); color: var(--bad); }
    .menu-option-btn.cancel { border-color: rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04); color: var(--ink-dim); }

    .log-list { display: grid; gap: 7px; text-align: left; max-height: 46dvh; overflow-y: auto; }
    .log-item {
        display: flex; gap: 9px; align-items: flex-start;
        padding: 9px 11px; border-radius: 10px;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: var(--ink); font-size: 0.78rem; line-height: 1.4;
    }
    .log-empty { color: var(--ink-dim); font-size: 0.8rem; }

    .result-toast {
        position: fixed;
        left: 50%; bottom: 26px;
        transform: translate(-50%, 140%);
        z-index: 500;
        width: min(440px, calc(100% - 28px));
        padding: 15px 18px;
        border-radius: 14px;
        border: 1px solid var(--glass-line);
        background: linear-gradient(180deg, rgba(12, 22, 40, 0.97), rgba(5, 10, 22, 0.98));
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.6);
        color: #fff; font-size: 0.88rem; line-height: 1.45;
        transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .result-toast.show { transform: translate(-50%, 0); }
    .result-toast .toast-quote {
        display: block; margin-top: 8px;
        color: var(--bc-cyan-soft); font-style: italic; font-size: 0.8rem;
    }

    @media (max-width: 480px) {
        .main { padding: 70px 10px 40px; }
        .city-grid { gap: 0; padding: 4px; }
        .city-cell { border-radius: 7px; }
        .city-cell > .cell-label { font-size: 0.44rem; padding: 1px 5px; }
        .legend .bp-piece { width: 20px; height: 20px; }
        .panel { padding: 20px 16px; }
        .fighter { font-size: 0.7rem; }
        .fighter .avatar { width: 22px; height: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
        .city-cell, .city-cell::before, .city-player-token { transition-duration: .01ms; }
        .city-cell.reachable::before, .city-player-token::before,
        .city-cell.reachable .bp-piece, .city-cell.heliport .bp-rotor,
        .city-routes .route-line { animation: none; }
        /* Senza movimento l'onda del radar non serve: resta l'alone fisso. */
        .city-cell.reachable::after { display: none; }
        .city-routes .route { animation-duration: .01ms; animation-delay: 0s; }
    }
</style>
</head>

<!-- Intermezzi narrativi fra una fase e l'altra del torneo (dirigibile,
     Torre Kaiba, vittoria finale): i testi stanno in
     js/data/tournament-dialogues.js, la scena la costruisce
     js/ui/story-cutscene.js. characters-db.js va PRIMA: è da lì che
     ogni battuta prende nome e ritratto di chi parla. -->
<script src="js/ui/story-cutscene.js"></script>
<script src="js/data/tournament-dialogues.js"></script>
<script src="js/ui/icon-library.js"></script>

<script>
    Icons.hydrate();
    // La data dei bonus giornalieri viene dal server, non dall'orologio
    // del dispositivo (vedi js/cloud/server-date.js).
    if (window.ServerDate) ServerDate.sync();

    // ================================================================
    // BATTLE CITY — tre fasi, tre linguaggi visivi diversi:
    //   1) CITTÀ     → griglia di isolati da esplorare col Radar del
    //                  Duel Disk, si accumulano Carta Locazione;
    //   2) DIRIGIBILE→ tabellone a eliminazione diretta a 8 (quarti);
    //   3) TORRE     → scalata verticale (semifinale, finale).
    // Deliberatamente NON i "nodi su un sentiero" del Regno dei
    // Duellanti: stessa infrastruttura di base (SaveManager.getTournamentState,
    // mode=tournament in js/duel-session.js, breadcrolla ygoLastDuelOutcome),
    // presentazione e regole completamente diverse.
    // ================================================================
    const TOURNAMENT_ID = 'battleCity';
    /** Carta Locazione di partenza: senza nessuna non si potrebbe puntare nulla al primo duello, e la regola "a zero sei fuori" non avrebbe mai modo di attivarsi. */
    // Una sola (era 2, richiesta dell'utente): si entra a Battle City con
    // il minimo per poter puntare al primo duello, e ogni Carta Locazione
    // successiva va guadagnata. La regola "a zero sei fuori" resta: con
    // una sola in tasca, il primo duello perso puntandola è già decisivo.
    const STARTING_LOCATORS = 1;
    /** Le 6 Carta Locazione che nell'anime aprono l'accesso alle finali sul dirigibile. */
    const FINALS_THRESHOLD = 6;

    // ----------------------------------------------------------------
    // Colonne sonore. Una per FASE della mappa (non per schermata) e una
    // per TIPO di duello — sfruttano il parametro ?music= già letto da
    // duelMonstersCore.html, nessuna modifica a quella pagina.
    // ----------------------------------------------------------------
    const PHASE_TRACKS = {
        city: 'audio/soundtracks/11. Metropolis.mp3',
        airship: 'audio/soundtracks/12. Metropolis 2.mp3',
        tower: "audio/soundtracks/29. Darknite's Arrival.mp3",
        champion: 'audio/soundtracks/51. Epilogue.mp3'
    };
    const DUEL_TRACKS = {
        street: '30. Preliminaries.mp3',
        hunter: '36. Heishin.mp3',
        r32: '31. Finals.mp3',
        r16: '31. Finals.mp3',
        quarter: '31. Finals.mp3',
        semi: '32. Seto Kaiba (Tournament Final).mp3',
        final: '38. Darknite-Nitemare.mp3'
    };

    /**
     * I turni sul dirigibile PRIMA della Torre Kaiba — erano SOLO i
     * quarti (8 posti): richiesta esplicita dell'utente di non partire
     * direttamente da lì, ma due turni prima (sedicesimi e ottavi, 32
     * posti). Ogni turno dimezza il tabellone come una vera eliminazione
     * diretta: `slotsKey` dice dove leggere i DUE sfidanti di ogni match
     * di quel turno, `winnersKey` dove finiscono i suoi vincitori (letto
     * a sua volta come `slotsKey` dal turno successivo) — vedi
     * buildBracket/simulateOtherAirshipMatches/renderAirship. Il turno
     * dei quarti chiude qui e passa il testimone a semiWinners/champion
     * (invariati, mai toccati da questo elenco).
     */
    const AIRSHIP_ROUNDS = [
        { stage: 'r32', name: 'Sedicesimi di finale', slotsKey: 'slots', winnersKey: 'r32Winners', matchCount: 16 },
        { stage: 'r16', name: 'Ottavi di finale', slotsKey: 'r32Winners', winnersKey: 'r16Winners', matchCount: 8 },
        { stage: 'quarter', name: 'Quarti di finale', slotsKey: 'r16Winners', winnersKey: 'quarterWinners', matchCount: 4 }
    ];

    /**
     * Immagini per fase. Oggi il repository ha SOLO il dirigibile
     * (images/fields/dirigibileKaibaCorp.jpg): le altre due sono già
     * previste qui con il nome che dovranno avere, e finché il file non
     * esiste si ricade automaticamente sul `fallback` (un'immagine già
     * presente) invece di mostrare un buco — vedi resolveImage().
     * Quando arriveranno battleCity.jpg e torreKaiba.jpg non serve
     * toccare una riga di codice: basta metterli in images/fields/.
     */
    const PHASE_IMAGES = {
        city:     { preferred: 'images/fields/citta.jpg', fallback: 'images/fields/citta.jpg' },
        airship:  { preferred: 'images/fields/dirigibileKaibaCorp.jpg', fallback: 'images/fields/dirigibileKaibaCorp.jpg' },
        tower:    { preferred: 'images/fields/torreDeiDuelli.jpg', fallback: 'images/fields/torreDeiDuelli.jpg' }
    };
    /** Riempita da preloadPhaseImages(): fase → percorso REALMENTE esistente. */
    const resolvedPhaseImage = {};

    /** Verifica se `src` esiste davvero caricandola (funziona anche su file://, a differenza di fetch) e risolve con il primo percorso valido. */
    function resolveImage(preferred, fallback) {
        return new Promise((resolve) => {
            const probe = new Image();
            probe.onload = () => resolve(preferred);
            probe.onerror = () => resolve(fallback);
            probe.src = preferred;
        });
    }
    function preloadPhaseImages() {
        return Promise.all(Object.keys(PHASE_IMAGES).map((phase) => {
            const entry = PHASE_IMAGES[phase];
            return resolveImage(entry.preferred, entry.fallback).then((src) => { resolvedPhaseImage[phase] = src; });
        }));
    }

    // ----------------------------------------------------------------
    // Roster. Quattro gruppi distinti, come nell'anime:
    //  - FINALS_ONLY_IDS  : Kaiba e Marik, mai incontrabili in città;
    //  - PRELIM_IDS       : Duellanti liberi che girano per la città;
    //  - HUNTER_IDS       : gli uomini di Marik — non trattano sulla posta;
    //  - FINALIST_WEIGHTS : chi può salire sul dirigibile e con quanta
    //                       probabilità (Marik escluso: è sempre presente
    //                       per forza, vedi buildBracket).
    // ----------------------------------------------------------------
    const BOSS_ID = 'marik';

    /**
     * Chi NON può mai comparire durante le preliminari in città: si
     * incontra solo dalle finali in poi. Kaiba organizza il torneo e
     * scende in campo solo quando restano gli otto migliori; Marik muove
     * i suoi Rare Hunter e si presenta di persona solo alla fine.
     *
     * È una GUARDIA, non solo un'assenza dalle liste qui sotto: i pool
     * preliminari vengono filtrati con questa costante, così aggiungere
     * per sbaglio uno dei due a PRELIM_IDS/HUNTER_IDS in futuro non basta
     * a farli sbucare fra i grattacieli.
     */
    const FINALS_ONLY_IDS = ['kaiba', BOSS_ID];
    const senzaFinalisti = (ids) => ids.filter((id) => FINALS_ONLY_IDS.indexOf(id) === -1);

    const PRELIM_IDS = senzaFinalisti(['rex', 'weevil', 'mako', 'espaRoba', 'duke', 'mai', 'joey', 'bakura']);
    const HUNTER_IDS = senzaFinalisti(['arkana', 'bandit_keith', 'odion', 'seeker', 'strings', 'lumis', 'umbra']);

    /**
     * Chi può salire sul dirigibile, con quanta probabilità. Marik non è
     * qui: è sempre presente d'ufficio (vedi buildBracket).
     *
     * Prima il pool era una lista piatta di 7 nomi da cui se ne pescavano
     * 6: ognuno entrava con probabilità ~86%, quindi il tabellone usciva
     * quasi identico ogni volta e non c'era alcuna gerarchia fra i
     * Duellanti. Ora ogni nome ha un peso: Kaiba è quasi sempre lì — è il
     * suo torneo — Joey/Ishizu/Odion sono presenze forti ma non
     * garantite, e il resto del roster riempie i posti rimasti, diverso
     * ad ogni torneo. Richiesta esplicita dell'utente.
     *
     * Il tabellone è a 32 posti (non più 8: richiesta esplicita
     * dell'utente di non partire direttamente dai quarti, ma due turni
     * prima — sedicesimi e ottavi, vedi AIRSHIP_ROUNDS), quindi servono
     * 31 nomi e questo pool ne ha solo 13: pickWeightedWithRefill pesca
     * SENZA rimpiazzo un giro alla volta (nessuna ripetizione dentro lo
     * stesso giro di 13) e ricomincia da un'urna nuova quando serve
     * ancora — le ripetizioni finiscono quindi solo nei posti "lontani"
     * dal cammino del giocatore (mai giocati, solo simulati per dare
     * un vincitore all'altro ramo del tabellone).
     */
    const FINALIST_WEIGHTS = {
        kaiba: 100,
        joey: 55, ishizu: 50, odion: 45,
        bakura: 30, mai: 26,
        espaRoba: 14, duke: 13, rex: 12, mako: 12, weevil: 11,
        arkana: 10, bandit_keith: 10
    };

    /**
     * Estrae `count` id distinti da una mappa id->peso: più alto il peso,
     * più probabile l'estrazione, ma nessuno è mai certo (tranne chi ha
     * un peso spropositato rispetto agli altri, che è il caso di Kaiba).
     * Estrazione SENZA rimpiazzo: chi esce viene tolto dall'urna, così non
     * può occupare due posti dello stesso tabellone.
     */
    function pickWeightedSample(weights, count) {
        const urna = Object.keys(weights).map((id) => ({ id: id, peso: weights[id] }));
        const scelti = [];
        while (scelti.length < count && urna.length > 0) {
            const totale = urna.reduce((somma, v) => somma + v.peso, 0);
            let tiro = Math.random() * totale;
            let i = 0;
            while (i < urna.length - 1 && tiro >= urna[i].peso) { tiro -= urna[i].peso; i++; }
            scelti.push(urna[i].id);
            urna.splice(i, 1);
        }
        return scelti;
    }

    /**
     * Come pickWeightedSample, ma per riempire un tabellone con più posti
     * di quanti nomi esistano nel pool (32 posti, 13 nomi in
     * FINALIST_WEIGHTS): pesca un giro intero SENZA ripetizioni (fino a
     * esaurire il pool), poi ricomincia da un'urna nuova per i posti
     * restanti. Le ripetizioni sono quindi possibili solo FRA un giro e
     * l'altro, mai dentro lo stesso giro.
     */
    function pickWeightedWithRefill(weights, count) {
        const scelti = [];
        while (scelti.length < count) {
            scelti.push(...pickWeightedSample(weights, Math.min(count - scelti.length, Object.keys(weights).length)));
        }
        return scelti;
    }

    /**
     * "Peso" di ogni Duellante, usato SOLO per simulare gli incontri del
     * tabellone fra avversari che il giocatore non affronta di persona

    /**

        umbra: { intro: ["La Maschera dell'Oscurità reclama le tue carte."], win: ["L'ombra ti ha inghiottito."], lose: ["Lumis... vendica la mia maschera!"] },

    };

    // Scene narrative per le celle non-duello: la città deve sembrare un
    // posto vivo, non una griglia di caselle. Mai lette dalla logica.
    const LOCATOR_SCENES = [
        "Un Duellante appena eliminato getta via la sua Carta Locazione: la raccogli al volo.",

    function getQuote(characterId, kind) {
        const bank = QUOTE_BANK[characterId];
        if (!bank || !bank[kind] || bank[kind].length === 0) return '';
        return pickRandom(bank[kind]);
    }
    function getCharacter(id) {
        return characterDatabase.find((c) => c.id === id);
    }
    function nameOf(id) {
        const c = getCharacter(id);
        return c ? c.name : 'Duellante';
    }
    function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
    }

    // ----------------------------------------------------------------
    // Stato persistito
    // ----------------------------------------------------------------
    /**
     * Le Carta Locazione vivono QUI, dentro lo stato del torneo, non in
     * SaveManager.getCurrency() come le Stelle del Regno dei Duellanti:
     * esistono solo dentro Battle City, quindi azzerarle insieme al
     * torneo (abbandono/ricomincia) è il comportamento giusto e gratuito.
     * Le Stelle stavano in `currency` solo perché quel campo esisteva già
     * da prima ed era inutilizzato — non è un precedente da imitare.
     */
    function makeInitialState(difficulty) {
        return {
            phase: 'city',
            difficulty: difficulty === 'Difficile' ? 'Difficile' : 'Medio',
            locators: STARTING_LOCATORS,
            sector: 1,
            grid: null,
            pendingEncounter: null,
            bracket: null,
            towerStage: null,
            history: [],
            eliminated: false
        };
    }
    function loadState() { return SaveManager.getTournamentState(TOURNAMENT_ID); }
    function saveState(state) { SaveManager.setTournamentState(TOURNAMENT_ID, state); }

    /** Aggiunge una riga al diario (mai un push diretto su state.history: qui si normalizza anche il timestamp). */
    function logEvent(state, icon, text) {
        state.history.push({ icon: icon, text: text, at: Date.now() });
        if (state.history.length > 80) state.history.shift();
    }

    // ================================================================
    // FASE 1 — LA CITTÀ
    // ================================================================
    const GRID_W = 5;
    const GRID_H = 5;

    /**
     * Composizione di un settore. I conteggi sono tarati perché un
     * settore da 25 celle contenga abbastanza duelli da poter guadagnare
     * le Carta Locazione mancanti, ma anche abbastanza celle innocue da
     * permettere di AGGIRARE un Rare Hunter quando si è a corto di carte
     * — è proprio questa la scelta tattica che il Radar rende possibile.
     */
    const SECTOR_COMPOSITION = [
        { kind: 'duelist', count: 7 },
        { kind: 'hunter', count: 2 },
        // UNA sola Carta Locazione da raccogliere per distretto (erano 4:
        // "troppe", segnalato dall'utente — con le 3 di partenza bastava un
        // giro per arrivare a 6 senza duellare). Il grosso delle carte
        // deve arrivare dai duelli puntati.
        { kind: 'locator', count: 1 },
        // Una Missione secondaria per distretto: una soffiata che indica un
        // Duellante preciso da battere per un premio (vedi 'quest' in moveToCell).
        { kind: 'quest', count: 1 },
        { kind: 'event', count: 4 },
        { kind: 'shop', count: 2 }
        // il resto delle celle resta 'empty'
    ];


    /**
     * `piece` è il tipo di pedina 3D di js/ui/board-pieces.js (null = la
     * casella ha solo l'alone a terra, nessuna pedina). Erano emoji: vedi
     * il commento sullo stile `.city-cell` per il perché del cambio.
     */
    const CELL_META = {
        empty:    { piece: null,       label: 'Libero' },
        duelist:  { piece: 'duelist',  label: 'Duellante' },
        hunter:   { piece: 'hunter',   label: 'Rare Hunter' },
        locator:  { piece: 'locator',  label: 'Locazione' },
        event:    { piece: 'event',    label: 'Evento' },
        quest:    { piece: 'quest',    label: 'Missione' },
        shop:     { piece: 'shop',     label: 'Negozio' },
        heliport: { piece: 'heliport', label: 'Decollo' },
        start:    { piece: null,       label: '' }
    };

    function buildSector(state) {
        const total = GRID_W * GRID_H;
        const kinds = new Array(total).fill('empty');
        // Il giocatore parte sempre al centro: da lì il radar illumina
        // subito quattro direzioni diverse, invece di spingerlo contro un
        // bordo con metà delle scelte già tagliate fuori.
        const startIndex = Math.floor(total / 2);
        const freeSlots = shuffle(kinds.map((_, i) => i).filter((i) => i !== startIndex));
        let cursor = 0;
        SECTOR_COMPOSITION.forEach((entry) => {
            for (let i = 0; i < entry.count && cursor < freeSlots.length; i++, cursor++) {
                kinds[freeSlots[cursor]] = entry.kind;
            }
        });

        const usedCharacters = new Set();
        const cells = kinds.map((kind, index) => {
            const cell = { kind: kind, revealed: false, resolved: false };
            if (kind === 'duelist') {
                const pool = PRELIM_IDS.filter((id) => !usedCharacters.has(id));
                const characterId = pickRandom(pool.length ? pool : PRELIM_IDS);
                usedCharacters.add(characterId);
                cell.characterId = characterId;
            }
            if (index === startIndex) { cell.revealed = true; cell.resolved = true; }
            return cell;
        });

        state.grid = { w: GRID_W, h: GRID_H, cells: cells, playerIndex: startIndex };
        revealAround(state, startIndex);
    }

    /** Una cella Rare Hunter è una pattuglia anonima: l'identità viene
     * estratta soltanto quando il giocatore vi entra. Nessun doppione finché
     * il pool non è esaurito; il pendingEncounter conserva poi l'estrazione. */
    function pickRareHunter(state) {
        const seen = Array.isArray(state.rareHuntersSeen) ? state.rareHuntersSeen : [];
        let available = HUNTER_IDS.filter((id) => seen.indexOf(id) === -1);
        if (available.length === 0) {
            seen.length = 0;
            available = HUNTER_IDS.slice();
        }
        const selected = pickRandom(available);
        seen.push(selected);
        state.rareHuntersSeen = seen;
        return selected;
    }

    /** Indici ortogonalmente adiacenti a `index` (mai in diagonale: il movimento è a croce, come su una scacchiera di isolati). */
    function neighborsOf(grid, index) {
        const x = index % grid.w;
        const y = Math.floor(index / grid.w);
        const out = [];
        if (x > 0) out.push(index - 1);
        if (x < grid.w - 1) out.push(index + 1);
        if (y > 0) out.push(index - grid.w);
        if (y < grid.h - 1) out.push(index + grid.w);
        return out;
    }

    /**
     * IL RADAR DEL DUEL DISK — il cuore della differenza con il Regno dei
     * Duellanti: lì si sceglie fra percorsi CIECHI, qui si vede sempre
     * cosa c'è nelle celle immediatamente raggiungibili. La scelta resta
     * difficile (dove conviene passare, quanto puntare) ma non è mai
     * casuale. `justRevealed` serve solo all'animazione di comparsa.
     */
    function revealAround(state, index) {
        const grid = state.grid;
        neighborsOf(grid, index).forEach((n) => {
            if (!grid.cells[n].revealed) {
                grid.cells[n].revealed = true;
                grid.cells[n].justRevealed = true;
            }
        });
    }

    /** Rivela `count` celle ancora coperte scelte a caso ovunque nel settore — l'effetto del Negozio: un vantaggio informativo, non di carte. */
    function revealRandomCells(state, count) {
        const hidden = state.grid.cells
            .map((c, i) => ({ c: c, i: i }))
            .filter((e) => !e.c.revealed);
        shuffle(hidden).slice(0, count).forEach((e) => {
            e.c.revealed = true;
            e.c.justRevealed = true;
        });
    }

    // ----------------------------------------------------------------
    // Oggetti del Duel Disk, Blackout e Missione secondaria.
    // Tutto vive nello stato del torneo e si azzera con lui. I campi sono
    // OPZIONALI nello stato salvato (un torneo cominciato prima di questa
    // versione non li ha): ensureExtras() li crea al primo uso.
    // ----------------------------------------------------------------
    const ITEM_MAX = 3;
    const ITEMS = {
        radar:  { icon: '📡', nome: 'Radar potenziato', corto: 'Radar', desc: 'Rivela tutto il distretto e ripristina il segnale dopo un blackout.' },
        shield: { icon: '🛡️', nome: 'Scudo del Duel Disk', corto: 'Scudo', desc: 'Scatta da solo: annulla il prossimo evento negativo o dimezza (per difetto) la prossima posta persa.' }
    };
    /** Per quante mosse il radar resta spento dopo un Blackout. */
    const BLACKOUT_MOVES = 3;
    /** Premio della Missione secondaria, in Carta Locazione. */
    const QUEST_REWARD = 2;

    function ensureExtras(state) {
        if (!state.items || typeof state.items !== 'object') state.items = {};
        Object.keys(ITEMS).forEach((id) => { if (typeof state.items[id] !== 'number') state.items[id] = 0; });
        if (typeof state.blackout !== 'number') state.blackout = 0;
        if (state.quest === undefined) state.quest = null;
        return state;
    }
    /** Aggiunge un oggetto fino al tetto ITEM_MAX. Torna vero se è stato aggiunto. */
    function giveItem(state, id) {
        ensureExtras(state);
        if (state.items[id] >= ITEM_MAX) return false;
        state.items[id]++;
        return true;
    }
    /** Un oggetto a caso (più spesso il Radar); se uno è al tetto prova l'altro. Torna l'id dato, o null se entrambi al tetto. */
    function giveRandomItem(state) {
        const first = Math.random() < 0.55 ? 'radar' : 'shield';
        const second = first === 'radar' ? 'shield' : 'radar';
        if (giveItem(state, first)) return first;
        if (giveItem(state, second)) return second;
        return null;
    }
    /** Consuma uno Scudo se c'è. Torna vero quando ha protetto da qualcosa. */
    function consumeShield(state) {
        ensureExtras(state);
        if (state.items.shield <= 0) return false;
        state.items.shield--;
        return true;
    }
    /** Il radar è "cieco" mentre dura il Blackout: le celle non ancora attraversate mostrano solo l'Ignoto. */
    function cellVisible(state, cell) {
        return !!cell.revealed && (!(state.blackout > 0) || !!cell.resolved);
    }

    /** Vero quando nel settore non resta più nulla da fare: tutte le celle con un contenuto sono state risolte. */
    function sectorExhausted(state) {
        return state.grid.cells.every((c) => c.resolved || c.kind === 'empty' || c.kind === 'heliport');
    }

    /**
     * Piazza la zona di decollo appena si raggiungono le 6 Carta
     * Locazione. Non è obbligatorio salirci subito: come il Castello nel
     * Regno dei Duellanti, resta lì e si può continuare a far bottino in
     * città (più carte = più margine per le puntate delle finali).
     */
    function ensureHeliport(state) {
        if (!state.grid || state.locators < FINALS_THRESHOLD) return false;
        if (state.grid.cells.some((c) => c.kind === 'heliport')) return false;
        const candidates = state.grid.cells
            .map((c, i) => ({ c: c, i: i }))
            .filter((e) => e.i !== state.grid.playerIndex && (e.c.kind === 'empty' || e.c.resolved));
        if (candidates.length === 0) return false;
        const chosen = pickRandom(candidates);
        chosen.c.kind = 'heliport';
        chosen.c.resolved = false;
        chosen.c.revealed = true;
        chosen.c.justRevealed = true;
        return true;
    }

    // ================================================================
    // FASE 2/3 — TABELLONE (dirigibile) e TORRE
    // ================================================================
    /**
     * 32 posti (non più 8: vedi il commento su AIRSHIP_ROUNDS), il
     * giocatore nello slot 0, Marik SEMPRE nella metà bassa del
     * tabellone (slot 16-31) così non può incrociare il giocatore prima
     * della finale — è la struttura dell'anime, e rende la scalata
     * leggibile ("Marik è dall'altra parte, lo incontrerò solo in cima").
     * `r32Winners`/`r16Winners` sono i vincitori dei due turni nuovi
     * (sedicesimi, ottavi); `quarterWinners`/`semiWinners`/`champion`
     * restano ESATTAMENTE come prima, ora alimentati da `r16Winners`
     * invece che da `slots` direttamente (vedi
     * simulateOtherAirshipMatches/playerSemiOpponent/playerFinalOpponent,
     * mai toccate).
     */
    function buildBracket(state) {
        const others = pickWeightedWithRefill(FINALIST_WEIGHTS, 31);
        const bottomHalf = shuffle([BOSS_ID].concat(others.slice(0, 15)));
        const topHalf = others.slice(15);
        const slots = ['player'].concat(topHalf).concat(bottomHalf);
        state.bracket = {
            slots: slots,
            r32Winners: new Array(16).fill(null),
            r16Winners: new Array(8).fill(null),
            quarterWinners: [null, null, null, null],
            semiWinners: [null, null],
            champion: null
        };
    }

    /** Chi vince fra due avversari NON giocanti: lancio pesato sui punti di FINALIST_POWER (mai usato per un duello del giocatore). */
    function simulateMatch(aId, bId) {
        const a = FINALIST_POWER[aId] || 50;
        const b = FINALIST_POWER[bId] || 50;
        return Math.random() * (a + b) < a ? aId : bId;
    }

    /**
     * Risolve OGNI match dei tre turni del dirigibile che il giocatore
     * non gioca di persona, tutti SUBITO al momento di salire a bordo —
     * stesso principio già esistente per i soli quarti (era
     * `simulateOtherQuarters`, ora tre turni invece di uno: sedicesimi,
     * ottavi, quarti). Il match 0 di ogni turno resta aperto (null)
     * finché non è il giocatore stesso a vincerlo — è l'unico risultato
     * che questa funzione non decide.
     */
    function simulateOtherAirshipMatches(state) {
        const br = state.bracket;
        AIRSHIP_ROUNDS.forEach((round) => {
            const combattenti = br[round.slotsKey];
            const vincitori = br[round.winnersKey];
            for (let m = 1; m < round.matchCount; m++) {
                if (vincitori[m]) continue;
                vincitori[m] = simulateMatch(combattenti[m * 2], combattenti[m * 2 + 1]);
            }
        });
    }

    /**
     * A quale dei tre turni del dirigibile si è arrivati: il primo il
     * cui match 0 (quello del giocatore) non è ancora stato vinto.
     * Quando anche i quarti sono vinti si è già usciti dal dirigibile
     * (enterTower), quindi questa funzione non serve più chiamarla.
     */
    function currentAirshipRound(state) {
        const br = state.bracket;
        for (let i = 0; i < AIRSHIP_ROUNDS.length; i++) {
            if (br[AIRSHIP_ROUNDS[i].winnersKey][0] !== 'player') return i;
        }
        return AIRSHIP_ROUNDS.length - 1;
    }

    /** L'avversario del giocatore in semifinale: il vincitore del quarto n.1, già simulato. */
    function playerSemiOpponent(state) {
        return state.bracket.quarterWinners[1];
    }
    /** L'avversario in finale: il vincitore della semifinale bassa (quarti 2 e 3), simulata al momento. */
    function playerFinalOpponent(state) {
        const br = state.bracket;
        if (!br.semiWinners[1]) {
            br.semiWinners[1] = simulateMatch(br.quarterWinners[2], br.quarterWinners[3]);
        }
        return br.semiWinners[1];
    }

    // ---------------- Fase 1: la città ----------------
    /**
     * Posa la puntina del giocatore sulla sua casella e disegna un percorso
     * (linea tratteggiata che scorre + freccia) verso ognuna delle caselle
     * raggiungibili: è la risposta alla richiesta dell'utente di rendere
     * più evidente DOVE ci si può spostare. Legge tutto da `gridEl.dataset`
     * e dalla geometria reale delle caselle, quindi la si può richiamare
     * anche al ridimensionamento senza ridisegnare la città.
     */
    function layoutCityOverlay(gridEl) {
        if (!gridEl || !gridEl.isConnected) return;
        const token = gridEl.querySelector('.city-player-token');
        const routes = gridEl.querySelector('.city-routes');
        const playerCell = gridEl.querySelector(`.city-cell[data-index="${gridEl.dataset.player}"]`);
        if (!token || !routes || !playerCell) return;

        const gridRect = gridEl.getBoundingClientRect();
        const cellRect = playerCell.getBoundingClientRect();
        const centro = (r) => ({ x: r.left - gridRect.left + r.width / 2, y: r.top - gridRect.top + r.height / 2 });
        const p = centro(cellRect);

        // Il segnalino è un solo nodo persistente: cambia coordinate con una
        // transizione, mentre le 25 celle non vengono distrutte e ricreate.
        if (!token.dataset.positioned) token.style.transition = 'none';
        token.style.width = `${Math.round(cellRect.width * 0.44)}px`;
        token.style.left = `${p.x}px`;
        token.style.top = `${p.y}px`;
        if (!token.dataset.positioned) {
            token.dataset.positioned = '1';
            requestAnimationFrame(() => { token.style.transition = ''; });
        }

        routes.setAttribute('viewBox', `0 0 ${gridRect.width} ${gridRect.height}`);
        const raggio = cellRect.width;
        const tratti = (gridEl.dataset.reachable || '').split(',').filter(Boolean).map((i) => {
            const cell = gridEl.querySelector(`.city-cell[data-index="${i}"]`);
            if (!cell) return '';
            const t = centro(cell.getBoundingClientRect());
            const dx = t.x - p.x;
            const dy = t.y - p.y;
            const lung = Math.hypot(dx, dy) || 1;
            const ux = dx / lung;
            const uy = dy / lung;
            // Si parte appena fuori dalla puntina e ci si ferma prima della
            // pedina d'arrivo: la linea collega, non copre. Verso l'alto si
            // parte più lontano, perché la puntina si alza SOPRA il centro
            // della casella (la sua punta, non il baricentro, sta sul punto).
            // E verso l'alto ci si ferma prima, sotto la targhetta della
            // casella d'arrivo (sta sul bordo basso del suo alone).
            const suSu = uy < -0.5;
            const partenza = suSu ? 0.32 : 0.26;
            const arrivo = suSu ? 0.46 : 0.32;
            const a = { x: p.x + ux * raggio * partenza, y: p.y + uy * raggio * partenza };
            const b = { x: t.x - ux * raggio * arrivo, y: t.y - uy * raggio * arrivo };
            const m = { x: a.x + (b.x - a.x) * 0.55, y: a.y + (b.y - a.y) * 0.55 };
            const angolo = Math.atan2(dy, dx) * 180 / Math.PI;
            const s = Math.max(5, raggio * 0.07);
            const d = `M${a.x.toFixed(1)} ${a.y.toFixed(1)} L${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
            return `<g class="route">
                <path class="route-glow" d="${d}"/>
                <path class="route-line" d="${d}"/>
                <path class="route-arrow" d="M${-s} ${-s} L${s * 0.6} 0 L${-s} ${s}" transform="translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${angolo.toFixed(1)})"/>
            </g>`;
        });
        routes.innerHTML = tratti.join('');
    }

    // Al ridimensionamento (rotazione del telefono, finestra) le caselle si

    /**

    /** Usa un Radar potenziato: rivela TUTTO il distretto e riaccende il radar se era in Blackout. */
    function useRadar() {
        const state = loadState();
        if (!state || state.phase !== 'city' || !state.grid) return;
        ensureExtras(state);
        if (state.items.radar <= 0) return;
        const tuttoVisibile = state.grid.cells.every((c) => c.revealed);
        if (tuttoVisibile && !(state.blackout > 0)) {
            showToast('📡 Il radar mostra già tutto il distretto.');
            return;
        }
        state.items.radar--;
        let nuove = 0;
        state.grid.cells.forEach((c) => {
            if (!c.revealed) { c.revealed = true; c.justRevealed = true; nuove++; }
        });
        const eraBlackout = state.blackout > 0;
        state.blackout = 0;
        logEvent(state, '📡', `Radar potenziato: ${nuove ? `${nuove} isolati rivelati` : 'segnale ripristinato'}${eraBlackout ? ', blackout finito' : ''}.`);
        saveState(state);
        if (window.NativeHaptics) NativeHaptics.success();
        render();
        showToast(`📡 Radar potenziato: ${nuove ? `<strong>${nuove} isolati rivelati</strong>` : '<strong>segnale ripristinato</strong>'}${eraBlackout ? ', il blackout è finito' : ''}.`);
    }

            gridEl = document.getElementById('cityGrid');
            // Strato dei percorsi: PRIMO figlio della griglia e z-index 0,

                const offsets = [[-4,-2],[2,3],[5,-3],[-2,4],[3,1],[4,-4],[-5,2],[1,-2],[-3,3],[5,2]];
                const drift = offsets[index % offsets.length];
