<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh! Duel Arena - Advanced</title>
    <link rel="stylesheet" href="js/effects.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            /* Proporzioni reali di una carta Yu-Gi-Oh (larghezza/altezza ≈ 0.685) */
            --card-w: 100px;
            --card-h: calc(var(--card-w) / 0.685);
            --hand-lift: 26px;

            /* Carte in mano: leggermente più grandi, solo qui */
            --hand-card-w: 122px;
            --hand-card-h: calc(var(--hand-card-w) / 0.685);

            /* Slot del Terreno: più spazio intorno alla carta + più gap */
            --field-slot-pad: 18px;
            --field-slot-w: calc(var(--card-w) + var(--field-slot-pad));
            --field-slot-h: calc(var(--card-h) + var(--field-slot-pad));
            --field-gap: 18px;

            /* Anteprima carta nel pannello descrizione */
            --info-card-w: 190px;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: url('images/fields/fieldPietra.png') center/cover no-repeat;
            color: white;
            overflow-x: hidden;
            position: relative;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Stile per la freccia d'attacco SVG */
        #attack-arrow-svg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Rende l'SVG "trasparente" ai click */
            z-index: 10000;
            display: none; /* Nascosto di default */
        }
        #attack-arrow-line {
            stroke: rgba(231, 76, 60, 0.8);
            stroke-width: 5;
            stroke-linecap: round;
        }
        .game-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .game-title { text-align: center; font-size: 2.5em; text-shadow: 0 0 20px #f39c12; margin-bottom: 20px; }
        .players-info { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .player-info {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 6px;
            border: 2px solid #f39c12;
            min-width: 180px;
            transition: transform 0.3s ease;
            box-shadow: 0 8px 22px rgba(0,0,0,0.24);
        }
        .player-info.side-player {
            text-align: center;
            min-width: 170px;
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(0,0,0,0.76), rgba(20,20,20,0.7));
        }
        .life-points { font-size: 1.15em; font-weight: bold; color: #e74c3c; margin-top: 6px; }
        .battlefield {
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(180px, 220px) 1fr minmax(180px, 220px);
            align-items: center;
            gap: 20px;
            background: transparent;
            border: none;
            padding: 20px;
            margin: 0 0 20px;
        }
        .battlefield::before,
        .battlefield::after {
            display: none;
        }
        .field-label { text-align: center; margin-bottom: 12px; font-size: 1.1em; font-weight: bold; text-transform: uppercase; letter-spacing: 0.06em; }
        .battlefield-side {
            display: flex;
            align-items: center;
            position: relative;
            z-index: 1;
            min-height: 100px;
        }
        .battlefield-side.left {
            justify-content: flex-start;
            align-self: start;
        }
        .battlefield-side.right {
            justify-content: flex-end;
            align-self: end;
        }
        .battlefield-main {
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
            z-index: 1;
        }
        .field-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .field-board {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .field-row {
            display: grid;
            grid-template-columns: var(--field-slot-w) repeat(5, var(--field-slot-w)) var(--field-slot-w);
            gap: var(--field-gap);
            justify-content: center;
            align-items: center;
        }
        .field-slot {
            width: var(--field-slot-w);
            height: var(--field-slot-h);
            border: 1px dashed rgba(255,255,255,0.22);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(145deg, rgba(133, 118, 102, 0.34), rgba(75, 62, 50, 0.28)),
                linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.16));
            transition: border-color 0.25s ease, background 0.25s ease;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: none;
        }
        .field-slot:hover {
            background:
                linear-gradient(145deg, rgba(154, 138, 118, 0.42), rgba(92, 74, 58, 0.32)),
                linear-gradient(180deg, rgba(255,255,255,0.12), rgba(0,0,0,0.20));
            border-color: rgba(255,255,255,0.35);
            transform: none;
        }
        .field-slot.special-slot {
            border: 1px dashed rgba(255,255,255,0.22);
            background:
                linear-gradient(145deg, rgba(111, 97, 81, 0.38), rgba(74, 61, 49, 0.26)),
                linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.16));
            color: #eaf2ff;
            font-size: 0.72rem;
            text-align: center;
            padding: 8px;
            flex-direction: column;
            gap: 6px;
        }
        .field-slot.deck-slot {
            background: transparent;
            border: none;
            box-shadow: none;
            overflow: visible;
        }
        @keyframes deckDrawPulse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes drawCardFly {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.78);
                filter: blur(1px);
            }
            15% {
                opacity: 1;
                transform: translate(0, 0) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translate(var(--dx), var(--dy)) scale(1);
            }
        }
        .field-slot.deck-slot.draw-effect {
            animation: deckDrawPulse 0.7s ease-in-out infinite;
        }
        .draw-flying-card {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            width: var(--card-w);
            height: var(--card-h);
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.34);
            animation: drawCardFly 0.95s cubic-bezier(0.16, 0.84, 0.44, 1) forwards;
        }
        .field-slot.deck-slot .deck-preview {
            width: calc(var(--card-w) - 4px);
            height: calc(var(--card-h) - 6px);
            pointer-events: none;
            position: absolute;
            left: 8px;
            top: 8px;
            transform: rotate(0deg);
            transform-origin: center center;
            box-shadow: 0 5px 14px rgba(0,0,0,0.26);
            z-index: 1;
        }
        .field-slot.deck-slot .deck-preview:nth-child(1) {
            left: 8px;
            top: 8px;
            transform: rotate(0deg);
            z-index: 3;
        }
        .field-slot.deck-slot .deck-preview:nth-child(2) {
            left: 12px;
            top: 10px;
            transform: rotate(0deg);
            z-index: 2;
        }
        .field-slot.deck-slot .deck-preview:nth-child(3) {
            left: 16px;
            top: 12px;
            transform: rotate(0deg);
            z-index: 1;
        }
        .field-slot.bot-deck-slot > .deck-preview {
            transform: scaleX(-1) rotate(0deg);
            transform-origin: center center;
        }
        .field-slot.bot-deck-slot > .deck-preview:nth-child(1) {
            transform: scaleX(-1) rotate(0deg);
            transform-origin: center center;
        }
        .field-slot.bot-deck-slot > .deck-preview:nth-child(2) {
            transform: scaleX(-1) rotate(0deg);
            transform-origin: center center;
        }
        .field-slot.bot-deck-slot > .deck-preview:nth-child(3) {
            transform: scaleX(-1) rotate(0deg);
            transform-origin: center center;
        }
        .field-slot.deck-slot .deck-preview:hover {
            transform: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.28);
        }
        .field-slot.deck-slot .field-slot-label,
        .field-slot.deck-slot .field-slot-count {
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .field-slot-label { font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; }
        .field-slot-count { color: #f39c12; font-size: 0.95rem; font-weight: bold; }

        /* ============================================================
           Evidenziazione slot durante la selezione dei Tributi
           ============================================================ */
        .field-slot.tribute-highlight {
            cursor: pointer;
        }
        .field-slot.tribute-highlight .card {
            outline: 3px solid rgba(231,76,60,0.85);
            outline-offset: 2px;
            box-shadow: 0 0 18px rgba(231,76,60,0.6);
        }
        .field-slot.tribute-selected .card {
            outline: 3px solid #f7d774;
            outline-offset: 2px;
            box-shadow: 0 0 26px rgba(247,215,116,0.9);
        }

        .card {
            width: var(--card-w);
            height: var(--card-h);
            aspect-ratio: 0.685;
            flex: 0 0 auto;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.28);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            border: 2px solid rgba(255,255,255,0.2);
            touch-action: none;
        }
        /* Immagine reale della carta (images/cards/<id>.png). Se manca o non carica,
           l'elemento <img> viene rimosso via JS e resta visibile il frame di fallback sottostante. */
        .card .card-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            z-index: 2;
            pointer-events: none;
        }
        .card.has-image .card-frame {
            opacity: 0;
        }
        .card.can-attack { cursor: grab; }
        .card[data-type="monster"] { background: linear-gradient(145deg, #ffdf8c, #c96f03); border-color: #f39c12; }
        .card[data-type="spell"] { background: linear-gradient(145deg, #53e8c2, #118f72); border-color: #1abc9c; }
        .card[data-type="trap"] { background: linear-gradient(145deg, #c89fe3, #6f3497); border-color: #9b59b6; }
        .card.defense-pos { transform: rotate(90deg); }
        .card.face-down {
            background: linear-gradient(135deg, #4a260d, #211108 55%, #7d4318 100%);
            border-color: #f2c66f;
            box-shadow: inset 0 0 14px rgba(255,255,255,0.18), 0 8px 20px rgba(0,0,0,0.28);
        }
        .card.face-down::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.28);
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(0,0,0,0.16));
        }
        .card.face-down .card-back {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8e6b6;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 6px rgba(0,0,0,0.35);
        }
        .card:hover { transform: translateY(-8px) scale(1.06); box-shadow: 0 12px 28px rgba(0,0,0,0.34); }
        .card.is-attacking { animation: attackAnim 0.5s ease-in-out; }
        .card.attack-flash { animation: attackFlash 0.65s ease-out; }
        .card.positioning { animation: positionPop 0.7s ease; }
        .position-badge {
            position: absolute;
            right: 6px;
            bottom: 6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.92);
            color: #b22222;
            box-shadow: 0 5px 14px rgba(0,0,0,0.25);
            animation: badgePop 0.7s ease forwards;
            pointer-events: none;
        }
        .floating-damage {
            position: fixed;
            z-index: 10001;
            pointer-events: none;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            text-shadow: 0 0 12px rgba(0,0,0,0.35);
            animation: floatDamage 0.95s ease-out forwards;
        }
        .floating-damage.damage { color: #ff6b6b; }
        .floating-damage.heal { color: #2ecc71; }
        .battle-hit {
            position: fixed;
            pointer-events: none;
            border-radius: 16px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255, 198, 0, 0.45) 22%, rgba(255, 80, 80, 0.18) 49%, transparent 74%);
            animation: battleHitPulse 0.55s ease-out forwards;
            z-index: 10000;
        }
        .card .card-frame {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.24);
            background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(0,0,0,0.16));
            position: relative;
        }
        .card .card-name { font-size: 0.7em; font-weight: bold; text-align: center; color: white; line-height: 1.1; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
        .card .card-art { font-size: 1.2rem; text-align: center; margin: auto 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .card .card-stats { font-size: 0.6em; display: flex; justify-content: space-between; color: white; padding-top: 4px; }
        .card .card-level {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 0.5em;
            font-weight: 700;
            background: rgba(0,0,0,0.55);
            color: #f7d774;
            padding: 1px 5px;
            border-radius: 6px;
            z-index: 3;
            letter-spacing: 0.02em;
        }
        .drag-preview {
            position: fixed; z-index: 100000; pointer-events: none; transform: rotate(3deg) scale(1.05); box-shadow: 0 18px 40px rgba(0,0,0,0.35);
            opacity: 0.95;
        }
        @keyframes attackAnim { 50% { transform: scale(1.2); } }
        @keyframes attackFlash {
            0% { transform: scale(1); filter: brightness(1); }
            35% { transform: scale(1.12) rotate(-6deg); filter: brightness(1.28); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        @keyframes positionPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.08) rotate(-5deg); }
            100% { transform: scale(1); }
        }
        @keyframes badgePop {
            0% { transform: scale(0.4); opacity: 0; }
            70% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes floatDamage {
            0% { transform: translateY(0) scale(0.7); opacity: 0; }
            20% { transform: translateY(-8px) scale(1); opacity: 1; }
            100% { transform: translateY(-42px) scale(1.04); opacity: 0; }
        }
        @keyframes battleHitPulse {
            0% { transform: scale(0.8); opacity: 0; }
            40% { transform: scale(1.08); opacity: 0.95; }
            100% { transform: scale(1.22); opacity: 0; }
        }
        .card-name { font-size: 0.7em; font-weight: bold; text-align: center; color: white; line-height: 1.1; }
        .card-stats { font-size: 0.6em; display: flex; justify-content: space-between; color: white; }
        .hand {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            min-height: calc(var(--hand-card-h) + var(--hand-lift) + 20px);
            padding-top: var(--hand-lift);
            overflow: visible;
        }
        .hand .card {
            width: var(--hand-card-w);
            height: var(--hand-card-h);
        }
        .hand .card.dragging-source {
            opacity: 0;
            pointer-events: none;
            transition: none;
        }
        .controls { text-align: center; margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        .btn {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer;
            font-size: 1em; font-weight: bold; transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4); }
        .btn:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn.phase-btn { background: linear-gradient(145deg, #3498db, #2980b9); }
        .phase-stepper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0 12px;
            position: relative;
        }
        .phase-step {
            position: relative;
            z-index: 1;
            min-width: 110px;
            padding: 10px 12px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.16);
            color: #dfe7f7;
            font-size: 0.92rem;
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .phase-step::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -14px;
            width: 16px;
            height: 2px;
            background: linear-gradient(90deg, rgba(243,156,18,0.55), rgba(255,255,255,0.18));
            transform: translateY(-50%);
            pointer-events: none;
        }
        .phase-step:last-child::after {
            display: none;
        }
        .phase-step .step-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.16);
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }
        .phase-step.active {
            background: linear-gradient(135deg, rgba(243,156,18,0.32), rgba(192, 57, 43, 0.24));
            border-color: #f39c12;
            box-shadow: 0 0 16px rgba(243,156,18,0.3);
            color: white;
            transform: translateY(-2px) scale(1.02);
        }
        .phase-step.completed {
            background: linear-gradient(135deg, rgba(46,204,113,0.24), rgba(39,174,96,0.18));
            border-color: #2ecc71;
            color: white;
            transform: translateY(-1px);
        }
        .phase-step .step-badge {
            transition: transform 0.25s ease, background 0.25s ease;
        }
        .phase-step.active .step-badge,
        .phase-step.completed .step-badge {
            transform: scale(1.05);
            background: rgba(255,255,255,0.24);
        }
        .phase-turn-label {
            text-align: center;
            font-size: 0.95em;
            font-weight: 700;
            color: #f1c40f;
            margin: 0 0 8px;
        }
        .phase-step.clickable {
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.18), rgba(41, 128, 185, 0.18));
            border-color: rgba(52, 152, 219, 0.35);
            box-shadow: 0 0 12px rgba(52, 152, 219, 0.12);
        }
        .phase-step.disabled {
            opacity: 0.55;
        }
        .game-log-container {
            margin-top: 20px;
            border: 2px solid #34495e;
            border-radius: 10px;
            background: rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .game-log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(52, 73, 94, 0.95), rgba(44, 62, 80, 0.95));
            font-weight: 700;
            color: #f1f5f9;
        }
        .log-toggle-btn {
            border: none;
            border-radius: 999px;
            padding: 7px 12px;
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .game-log {
            padding: 12px 15px;
            max-height: 220px;
            overflow-y: auto;
        }
        .log-entry { margin: 5px 0; padding-left: 10px; border-left: 3px solid #3498db; }
        .card-info-panel {
            display: none;
            width: 320px;
            min-height: 120px;
            border: 2px solid rgba(243,156,18,0.45);
            border-radius: 6px;
            background: linear-gradient(145deg, rgba(28, 28, 36, 0.96), rgba(45, 46, 58, 0.94));
            box-shadow: 0 10px 24px rgba(0,0,0,0.25);
            padding: 12px;
            color: #f8f8f8;
        }
        .card-info-panel.visible {
            display: block;
        }
        .card-info-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f1c40f;
        }
        .card-info-content {
            font-size: 0.95rem;
            line-height: 1.35;
            color: #e8eef9;
        }
        .card-info-name {
            font-weight: 700;
            margin-bottom: 6px;
            color: white;
        }
        .card-info-meta {
            font-size: 0.85rem;
            color: #f1c40f;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .card-info-stats {
            color: #7dd3fc;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .card-info-empty {
            color: #b7c0d3;
            font-style: italic;
        }
        .card-info-preview {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            min-height: calc(var(--info-card-w) / 0.685);
        }
        .card-info-preview .card {
            width: var(--info-card-w);
            height: calc(var(--info-card-w) / 0.685);
            cursor: default;
        }
        .card-info-preview .card:hover {
            transform: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.28);
        }
        .right-panel-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: stretch;
        }
        .selected { transform: translateY(-20px) scale(1.15) !important; box-shadow: 0 10px 30px rgba(52, 152, 219, 0.8) !important; }
        .action-highlight { border: 3px solid #2ecc71 !important; background: rgba(46, 204, 113, 0.3) !important; }
        .attack-target { border: 3px solid #e74c3c !important; background: rgba(231, 76, 60, 0.3) !important; }
        .damage-shake { animation: shake 0.5s; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        .victory-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .victory-text { font-size: 3em; font-weight: bold; text-align: center; margin-bottom: 30px; }
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; z-index: 100000;
            padding: 20px;
        }
        .modal-backdrop.open { display: flex; }
        .modal-card {
            background: linear-gradient(145deg, #1f2a44, #304060); border: 2px solid #f39c12; border-radius: 20px;
            width: min(92vw, 420px); padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); text-align: center;
        }
        .modal-card h3 { font-size: 1.3rem; margin-bottom: 12px; }
        .modal-card p { color: #dbe6ff; margin-bottom: 12px; }
        .modal-preview {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .modal-preview-card {
            transform: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .modal-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .modal-btn {
            border: none; border-radius: 999px; padding: 12px 18px; cursor: pointer; font-weight: 700; color: white;
            min-width: 140px; transition: transform 0.2s ease;
        }
        .modal-btn:hover { transform: translateY(-2px); }
        .modal-btn.attack { background: linear-gradient(145deg, #e74c3c, #c0392b); }
        .modal-btn.defense { background: linear-gradient(145deg, #2ecc71, #27ae60); }
        .modal-btn.cancel { background: linear-gradient(145deg, #7f8c8d, #5d6d6e); }
        .card.destroying {
            animation: destroyCard 0.6s ease forwards;
        }
        @keyframes destroyCard {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            30% { transform: scale(1.08) rotate(-4deg); filter: brightness(1.4); }
            60% { transform: scale(0.9) rotate(8deg); opacity: 0.7; }
            100% { transform: scale(0.2) rotate(20deg); opacity: 0; }
        }
        .field-slot.impact {
            animation: fieldImpact 0.45s ease;
        }
        @keyframes fieldImpact {
            0% { box-shadow: inset 0 0 0 rgba(255,255,255,0); transform: scale(1); }
            50% { box-shadow: inset 0 0 20px rgba(255,215,0,0.8), 0 0 18px rgba(255,215,0,0.6); transform: scale(1.03); }
            100% { box-shadow: inset 0 0 0 rgba(255,255,255,0); transform: scale(1); }
        }

        /* ============================================================
           Annunci epici di Fase / Turno (stile Master Duel)
           ============================================================ */
        #phaseAnnouncement {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10060;
            pointer-events: none;
            text-align: center;
            opacity: 0;
            white-space: nowrap;
        }
        #phaseAnnouncement.phase-announce-play {
            animation-name: phaseAnnounceIn;
            animation-timing-function: cubic-bezier(0.16, 0.84, 0.44, 1);
            animation-fill-mode: forwards;
            animation-duration: var(--phase-anim-duration, 1300ms);
        }
        .phase-announce-banner {
            position: relative;
            display: inline-block;
            padding: 14px 54px;
            background: linear-gradient(90deg, rgba(10,10,18,0) 0%, rgba(8,8,14,0.82) 14%, rgba(8,8,14,0.82) 86%, rgba(10,10,18,0) 100%);
            border-top: 2px solid var(--fx-gold, #f39c12);
            border-bottom: 2px solid var(--fx-gold, #f39c12);
            box-shadow: 0 0 44px rgba(243,156,18,0.35);
        }
        .phase-announce-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff6dc 0%, #f7d774 40%, #f39c12 72%, #c9770a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 26px rgba(243,156,18,0.55);
        }
        .phase-announce-sub {
            margin-top: 4px;
            font-size: 0.95rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: #7dd3fc;
            text-shadow: 0 0 10px rgba(125,211,252,0.5);
        }
        #phaseAnnouncement.phase-announce--turn .phase-announce-banner {
            border-color: #3498db;
            box-shadow: 0 0 60px rgba(52,152,219,0.45);
            padding: 18px 64px;
        }
        #phaseAnnouncement.phase-announce--turn .phase-announce-title {
            font-size: 3.4rem;
            background: linear-gradient(180deg, #eaf6ff 0%, #7dd3fc 42%, #3498db 76%, #1b6fb8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 34px rgba(52,152,219,0.65);
        }
        #phaseAnnouncement.phase-announce--turn .phase-announce-sub {
            color: #f7d774;
            text-shadow: 0 0 10px rgba(247,215,116,0.55);
        }
        #phaseAnnouncement.phase-announce--battle .phase-announce-banner {
            border-color: #e74c3c;
            box-shadow: 0 0 60px rgba(231,76,60,0.45);
        }
        #phaseAnnouncement.phase-announce--battle .phase-announce-title {
            font-size: 3rem;
            background: linear-gradient(180deg, #fff0e0 0%, #f7d774 32%, #e74c3c 72%, #c0392b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 34px rgba(231,76,60,0.6);
        }
        @keyframes phaseAnnounceIn {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.72) skewX(-8deg); filter: blur(6px); }
            14%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05) skewX(0deg); filter: blur(0); }
            22%  { transform: translate(-50%, -50%) scale(1) skewX(0deg); }
            80%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.08); filter: blur(2px); }
        }

        /* ============================================================
           Annuncio epico "BATTLE PHASE" — dura 3 secondi
           ============================================================ */
        #battleStartOverlay {
            position: fixed;
            inset: 0;
            z-index: 10070;
            pointer-events: none;
            overflow: hidden;
            opacity: 0;
        }
        #battleStartOverlay.play { opacity: 1; }

        .battle-start-flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.9), rgba(231,76,60,0.35) 40%, rgba(0,0,0,0) 75%);
            opacity: 0;
            animation: battleFlashPulse 3000ms ease-out forwards;
        }
        @keyframes battleFlashPulse {
            0%   { opacity: 0; }
            4%   { opacity: 1; }
            14%  { opacity: 0; }
            100% { opacity: 0; }
        }

        .battle-start-rays {
            position: absolute;
            inset: -20%;
            background: repeating-conic-gradient(from 0deg, rgba(243,156,18,0.14) 0deg 4deg, transparent 4deg 12deg);
            opacity: 0;
            animation: raysSpin 3000ms ease-in-out forwards;
            mix-blend-mode: screen;
        }
        @keyframes raysSpin {
            0%   { opacity: 0; transform: rotate(0deg) scale(0.8); }
            15%  { opacity: 0.85; }
            70%  { opacity: 0.5; }
            100% { opacity: 0; transform: rotate(70deg) scale(1.1); }
        }

        .battle-start-bar {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 20%;
            background: linear-gradient(90deg, rgba(20,10,10,0) 0%, rgba(18,10,10,0.92) 12%, rgba(18,10,10,0.92) 88%, rgba(20,10,10,0) 100%);
            border-top: 2px solid rgba(231,76,60,0.7);
            border-bottom: 2px solid rgba(231,76,60,0.7);
            opacity: 0;
        }
        .bar-top { top: 30%; animation: barSlideTop 3000ms cubic-bezier(0.16,0.84,0.44,1) forwards; }
        .bar-bottom { top: 52%; animation: barSlideBottom 3000ms cubic-bezier(0.16,0.84,0.44,1) forwards; }
        @keyframes barSlideTop {
            0%   { transform: translateX(-120%) skewY(-3deg); opacity: 0; }
            10%  { opacity: 1; }
            22%  { transform: translateX(0%) skewY(-3deg); opacity: 1; }
            80%  { transform: translateX(0%) skewY(-3deg); opacity: 1; }
            100% { transform: translateX(120%) skewY(-3deg); opacity: 0; }
        }
        @keyframes barSlideBottom {
            0%   { transform: translateX(120%) skewY(-3deg); opacity: 0; }
            10%  { opacity: 1; }
            22%  { transform: translateX(0%) skewY(-3deg); opacity: 1; }
            80%  { transform: translateX(0%) skewY(-3deg); opacity: 1; }
            100% { transform: translateX(-120%) skewY(-3deg); opacity: 0; }
        }

        .battle-start-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 18px;
            align-items: baseline;
            white-space: nowrap;
        }
        .battle-start-word {
            font-size: 4.2rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0;
            text-shadow: 0 0 30px rgba(231,76,60,0.7);
        }
        .battle-start-word--left {
            background: linear-gradient(180deg, #fff0e0 0%, #f7d774 35%, #e74c3c 75%, #a52a1f 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: wordSlamLeft 3000ms cubic-bezier(0.16,0.84,0.44,1) forwards;
        }
        .battle-start-word--right {
            background: linear-gradient(180deg, #eaf6ff 0%, #7dd3fc 35%, #3498db 75%, #1b6fb8 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: wordSlamRight 3000ms cubic-bezier(0.16,0.84,0.44,1) forwards;
        }
        @keyframes wordSlamLeft {
            0%   { opacity: 0; transform: translateX(-160px) scale(1.4) skewX(10deg); filter: blur(8px); }
            18%  { opacity: 1; transform: translateX(0) scale(1) skewX(0deg); filter: blur(0); }
            82%  { opacity: 1; transform: translateX(0) scale(1); }
            100% { opacity: 0; transform: translateX(-40px) scale(0.94); }
        }
        @keyframes wordSlamRight {
            0%   { opacity: 0; transform: translateX(160px) scale(1.4) skewX(-10deg); filter: blur(8px); }
            18%  { opacity: 1; transform: translateX(0) scale(1) skewX(0deg); filter: blur(0); }
            82%  { opacity: 1; transform: translateX(0) scale(1); }
            100% { opacity: 0; transform: translateX(40px) scale(0.94); }
        }

        .battle-start-sub {
            position: absolute;
            top: calc(50% + 48px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #f7d774;
            text-shadow: 0 0 12px rgba(247,215,116,0.6);
            opacity: 0;
            animation: subFadeInOut 3000ms ease-in-out forwards;
        }
        @keyframes subFadeInOut {
            0%   { opacity: 0; }
            24%  { opacity: 1; }
            78%  { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- SVG per la freccia d'attacco -->
    <svg id="attack-arrow-svg">
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="rgba(231, 76, 60, 0.8)" />
            </marker>
        </defs>
        <line id="attack-arrow-line" x1="0" y1="0" x2="0" y2="0" marker-end="url(#arrowhead)"></line>
    </svg>

    <div class="modal-backdrop" id="summonModal">
        <div class="modal-card">
            <h3>🧙 Evoca il mostro</h3>
            <p>Scegli se posizionarla coperta in difesa o scoperta in attacco.</p>
            <div class="modal-preview" id="summonPreview"></div>
            <div class="modal-actions">
                <button class="modal-btn attack" id="summonAttackBtn">⚔️ Scoperta in attacco</button>
                <button class="modal-btn defense" id="summonDefenseBtn">🛡️ Coperta in difesa</button>
                <button class="modal-btn cancel" id="summonCancelBtn">✖ Annulla</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <!--<h1 class="game-title">⚔️ YU-GI-OH! DUEL ARENA ⚔️</h1>-->
        <div class="battlefield">
            <div class="battlefield-side left">
                <div class="player-info side-player" id="botInfo">
                    <h3>🤖 Bot</h3>
                    <div class="life-points">❤️ LP: <span id="botLP">8000</span></div>
                </div>
            </div>
            <div class="battlefield-main">
                <div class="field-section">
                    <!--<div class="field-label">🤖 Campo del Bot</div>-->
                    <div class="field-board" id="botFieldBoard"></div>
                </div>
                <div class="phase-stepper" id="phaseStepper">
                    <div class="phase-step" data-phase="draw"><span class="step-badge">1</span><span class="step-label">Pesca</span></div>
                    <div class="phase-step" data-phase="standby"><span class="step-badge">2</span><span class="step-label">Standby</span></div>
                    <div class="phase-step" data-phase="main1"><span class="step-badge">3</span><span class="step-label">Main 1</span></div>
                    <div class="phase-step" data-phase="battle"><span class="step-badge">4</span><span class="step-label">Battaglia</span></div>
                    <div class="phase-step" data-phase="main2"><span class="step-badge">5</span><span class="step-label">Main 2</span></div>
                    <div class="phase-step" data-phase="end"><span class="step-badge">6</span><span class="step-label">Fine</span></div>
                </div>
                <div class="phase-indicator" id="phaseIndicator"></div>
                <div class="phase-turn-label" id="phaseTurnLabel"></div>
                <div class="field-section">
                   <!--<div class="field-label">👤 Il Tuo Campo</div>--> 
                    <div class="field-board" id="playerFieldBoard"></div>
                </div>
            </div>
            <div class="battlefield-side right">
                <div class="right-panel-stack">
                    <div class="card-info-panel" id="cardInfoPanel">
                        <div class="card-info-title">🃏 Descrizione carta</div>
                        <div class="card-info-preview" id="cardInfoPreview"></div>
                        <div class="card-info-content" id="cardInfoContent">Clicca o passa il mouse su una carta per vedere il suo effetto.</div>
                    </div>
                    <div class="player-info side-player" id="playerInfo">
                        <h3>👤 Giocatore</h3>
                        <div class="life-points">❤️ LP: <span id="playerLP">8000</span></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!--<div class="field-label">🎴 La Tua Mano</div>-->
        <div class="hand" id="playerHand"></div>
        <!--<div class="game-log-container collapsed" id="gameLogContainer">
            <div class="game-log-header">
                <span>📝 Log di gioco</span>
                <button class="log-toggle-btn" id="logToggleBtn" type="button">Espandi</button>
            </div>
            <div class="game-log" id="gameLog"></div>
        </div>-->
    </div>

<script src="js/effects.js"></script>
<script src="js/cards-db.js"></script>
<script src="js/game-flow.js"></script>
<script src="js/actions.js"></script>
<script src="js/bot.js"></script>

</body>
</html>
