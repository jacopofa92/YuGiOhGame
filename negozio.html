<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Opt-in STATICO alla View Transitions API — deve stare qui, non iniettato via JS in ritardo (vedi js/audio/audio-manager.js per la storia completa del bug che questo risolve). -->
<style>@view-transition { navigation: auto; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<!-- Sfondo scuro applicato SUBITO, prima che gli script auth-gate/supabase
     sotto finiscano di scaricare (bloccanti) — evita un flash bianco
     prima del nero dell'overlay di auth-gate.js, vedi il commento
     completo in cartoteca.html dove è stato diagnosticato. -->
<style>html, body { background: #0b0d14; }</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel Arena">
<script src="js/ui/error-recovery.js"></script>
<!-- Accesso obbligatorio (js/cloud/auth-gate.js) — vedi il commento lì:
     rimanda a index.html se non c'è una sessione approvata. -->
<script src="js/vendor/supabase.min.js"></script>
<script src="js/cloud/supabase-config.js"></script>
<script src="js/cloud/cloud-sync.js"></script>
<script src="js/cloud/auth-gate.js"></script>
<script src="js/pwa-register.js"></script>
<link rel="stylesheet" href="js/ui/page-loader.css">
<link rel="preload" href="audio/soundtracks/16. Duel Ground.mp3" as="audio">
<link rel="stylesheet" href="js/ui/topbar.css">
<!-- Ritratto del giocatore in fondo alla topbar: lo monta PageTopbar. -->
<link rel="stylesheet" href="js/ui/deck-switcher.css">
<!-- Stile delle carte: senza, i div generati da createCardElement non
     hanno alcuna dimensione e si allargano fino a sfondare la pagina
     (--card-w da solo non basta, la regola che lo legge vive qui). -->
<link rel="stylesheet" href="js/ui/card.css">
<!-- La "deck box" 3D dei mazzi, condivisa con Creazione Deck. -->
<link rel="stylesheet" href="js/ui/deck-box.css">
<!-- Scheda di dettaglio di una carta, condivisa. -->
<link rel="stylesheet" href="js/ui/card-detail.css">
<!-- Stile del Negozio, condiviso con la vista fusa in index.html. -->
<link rel="stylesheet" href="js/economy/shop.css">
<title>Yu-Gi-Oh! Duel Arena — Negozio</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Niente selezione di testo/pressione lunga sul contenuto del gioco (nomi
       carte, personaggi, pulsanti...): su mobile un tocco prolungato apriva
       il menu di sistema "Cerca su Google"/copia invece di far scattare
       l'interazione del gioco. input/textarea/select restano selezionabili
       normalmente, altrimenti non si potrebbe più scrivere nei campi. */
    html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { min-height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/exodia.jpg') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.6) 0%, rgba(6,7,12,0.72) 60%, rgba(4,5,8,0.85) 100%);
        pointer-events: none;
    }

    :root {
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --ink: #cdd6ea;
        --ink-dim: #9aa5bd;
    }

    /* Topbar: markup/CSS generati da js/ui/topbar.js + js/ui/topbar.css
       (condivisi da tutte le pagine "menu"), non più duplicati qui. */

    .main {
        position: relative;
        z-index: 1;
        padding: 26px 18px 60px;
        max-width: 900px;
        margin: 0 auto;
    }

    @media (max-width: 480px) {
        .main { padding: 14px 8px 40px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
        .main { padding: 8px 14px 24px; }
    }
</style>
</head>
<body>
    <script src="js/ui/page-loader.js"></script>
    <div id="topbarMount"></div>

    <!-- Il Negozio vero è costruito da js/economy/shop-ui.js, condiviso
         con la vista fusa dentro index.html: qui c'è solo il punto in cui
         si innesta, così le due non possono andare alla deriva. -->
    <main class="main">
        <div id="shopMount"></div>
    </main>

<script src="js/save-manager.js"></script>
<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<!-- Dati carte + renderer: il Negozio mostra carte vere, non nomi. -->
<script src="js/data/cards-data.generated.js"></script>
<script src="js/data/cards-db.js"></script>
<script src="js/data/starter-structure-decks.js"></script>
<script src="js/ui/card-renderer.js"></script>
<script src="js/ui/deck-box.js"></script>
<script src="js/ui/card-detail.js"></script>
<!-- Economia -->
<script src="js/cloud/server-date.js"></script>
<script src="js/data/card-rarity.js"></script>
<script src="js/economy/rewards.js"></script>
<script src="js/economy/shop-catalog.js"></script>
<script src="js/economy/shop-ui.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/deck-switcher.js"></script>
<script src="js/ui/topbar.js"></script>
<script>
    PageTopbar.render('#topbarMount', { icon: 'shop', title: 'Negozio' });

    // Stessa colonna sonora della vista fusa "Negozio" dentro index.html
    // (VIEW_TRACKS lì): questa pagina autonoma resta raggiungibile
    // aprendola direttamente e deve suonare uguale.
    initAudioManager({ trackSrc: 'audio/soundtracks/16. Duel Ground.mp3' });
    Icons.hydrate();

    ShopUI.mount(document.getElementById('shopMount'));
</script>
</body>
</html>
