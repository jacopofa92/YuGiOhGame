<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel Arena">
<script src="js/pwa-register.js"></script>
<link rel="preload" href="audio/soundtracks/mainTheme.mp3" as="audio">
<link rel="stylesheet" href="js/ui/topbar.css">
<title>Yu-Gi-Oh! Duel Arena — Negozio</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Niente selezione di testo/pressione lunga sul contenuto del gioco (nomi
       carte, personaggi, pulsanti...): su mobile un tocco prolungato apriva
       il menu di sistema "Cerca su Google"/copia invece di far scattare
       l'interazione del gioco. input/textarea/select restano selezionabili
       normalmente, altrimenti non si potrebbe più scrivere nei campi. */
    html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { min-height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/exodia.jpg') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.6) 0%, rgba(6,7,12,0.72) 60%, rgba(4,5,8,0.85) 100%);
        pointer-events: none;
    }

    :root {
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --ink: #cdd6ea;
        --ink-dim: #9aa5bd;
    }

    /* Topbar: markup/CSS generati da js/ui/topbar.js + js/ui/topbar.css
       (condivisi da tutte le pagine "menu"), non più duplicati qui. */

    .main {
        position: relative;
        z-index: 1;
        padding: 30px 22px 60px;
        max-width: 760px;
        margin: 0 auto;
    }

    /* Saldo valute: crediti/stelle/carte locazione, sempre visibile in
       cima alla pagina anche se il Negozio non è ancora spendibile, così
       il giocatore vede fin da subito cosa sta accumulando. */
    .wallet-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 28px;
    }
    .wallet-tile {
        flex: 1 1 160px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(150deg, rgba(40,32,20,0.82), rgba(18,16,22,0.86));
        border: 2px solid rgba(247,215,116,0.3);
        border-radius: 16px;
        padding: 16px 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .wallet-icon { font-size: 1.8rem; }
    .wallet-value { font-size: 1.4rem; font-weight: 900; color: var(--gold); line-height: 1.1; }
    .wallet-label { font-size: 0.72rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; }

    .coming-soon {
        background: linear-gradient(150deg, rgba(40,32,20,0.82), rgba(18,16,22,0.86));
        border: 2px dashed rgba(247,215,116,0.35);
        border-radius: 20px;
        padding: 46px 28px;
        text-align: center;
        box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .coming-soon-icon { font-size: 3rem; margin-bottom: 14px; }
    .coming-soon h1 {
        font-size: clamp(1.3rem, 3vw, 1.8rem);
        color: var(--gold);
        margin-bottom: 12px;
    }
    .coming-soon p {
        color: var(--ink);
        line-height: 1.6;
        max-width: 480px;
        margin: 0 auto;
    }
    .coming-soon p + p { margin-top: 10px; }

    @media (max-width: 480px) {
        .main { padding: 14px 8px 40px; }
        .wallet-tile { flex: 1 1 100%; }
        .coming-soon { padding: 22px 12px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
        .main { padding: 8px 14px 24px; }
        .coming-soon { padding: 16px 14px; }
    }
</style>
</head>
<body>
    <div id="topbarMount"></div>

    <main class="main">
        <div class="wallet-row">
            <div class="wallet-tile">
                <div class="wallet-icon">💰</div>
                <div>
                    <div class="wallet-value" id="walletCredits">0</div>
                    <div class="wallet-label">Crediti</div>
                </div>
            </div>
            <div class="wallet-tile">
                <div class="wallet-icon">⭐</div>
                <div>
                    <div class="wallet-value" id="walletStarChips">0</div>
                    <div class="wallet-label">Stelle</div>
                </div>
            </div>
            <div class="wallet-tile">
                <div class="wallet-icon">🗺️</div>
                <div>
                    <div class="wallet-value" id="walletLocatorCards">0</div>
                    <div class="wallet-label">Carte Locazione</div>
                </div>
            </div>
        </div>

        <div class="coming-soon">
            <div class="coming-soon-icon">🚧</div>
            <h1>Il Negozio arriverà presto</h1>
            <p>Qui potrai un giorno spendere Crediti, Stelle e Carte Locazione per sbloccare nuove carte, deck e contenuti.</p>
            <p>Per ora, questi valori restano a disposizione: torneranno utili non appena il Negozio sarà pronto.</p>
        </div>
    </main>

<script src="js/save-manager.js"></script>
<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/topbar.js"></script>
<script>
    PageTopbar.render('#topbarMount', { icon: 'shop', title: 'Negozio' });

    // Colonna sonora condivisa tra le pagine, come nelle altre schermate
    // fuori dal duello vero e proprio (vedi commento in index.html).
    initAudioManager();
    Icons.hydrate();

    const wallet = SaveManager.getCurrency();
    document.getElementById('walletCredits').textContent = wallet.credits;
    document.getElementById('walletStarChips').textContent = wallet.starChips;
    document.getElementById('walletLocatorCards').textContent = wallet.locatorCards;
</script>
</body>
</html>
