<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Opt-in STATICO alla View Transitions API — deve stare qui, non iniettato via JS in ritardo (vedi js/audio/audio-manager.js per la storia completa del bug che questo risolve). -->

<link rel="apple-touch-icon" href="images/icons/icon-180.png">

<script src="js/ui/error-recovery.js"></script>

     rimanda a index.html se non c'è una sessione approvata. -->

<link rel="stylesheet" href="js/ui/node-map.css">
<!-- Le scene della Storia sono intermezzi a dialoghi come quelli dei
     tornei: stesso componente, stesso foglio di stile. Vedi
     js/ui/story-cutscene.js. -->
<link rel="stylesheet" href="js/ui/story-cutscene.css">
<link rel="stylesheet" href="js/economy/rewards.css">
<title>Yu-Gi-Oh! Duel Arena — Storia</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Stesso blocco di ogni altra pagina del gioco. overscroll-behavior:
       niente stiramento elastico quando si trascina oltre il bordo e
       niente "tira per ricaricare" — su una pagina di gioco quel gesto è
       a un dito di distanza dal ricaricare tutto. Va su html E su body:
       la regola vale per l'elemento che scorre DAVVERO, e dichiararla
       solo su html non copre le pagine dove a scorrere è il body. */
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overscroll-behavior-y: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #0b0d14;
        color: #e8e2d0;
        min-height: 100vh;
    }
    :root { --gold: #f7d774; --gold-strong: #f39c12; }

    /* La pagina è una colonna alta quanto lo schermo, così la mappa può
       prendersi tutto lo spazio che avanza sotto l'intestazione invece di
       accontentarsi di una frazione fissa dell'altezza. La catena dei
       `flex: 1` + `min-height: 0` va tenuta intera: basta che un anello
       torni ad `auto` perché il figlio non sappia più quanto è alto e la
       mappa collassi. */
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 18px 16px 18px;
        /* Nessun limite di larghezza qui: lo vuole solo l'ELENCO delle
           campagne, che è testo da leggere. La mappa va larga quanto lo
           schermo. */
        width: 100%;
        margin: 0 auto;
    }
    /* L'elenco delle campagne resta di larghezza leggibile e centrato. */
    #sceltaCampagna { width: 100%; max-width: 1100px; margin: 0 auto; }

    /* --- Scelta della campagna ------------------------------------ */
    .campagne { display: grid; gap: 14px; }
    .campagna {
        display: flex; align-items: center; gap: 14px;
        text-align: left; width: 100%;
        padding: 16px;
        border-radius: 18px;
        border: 1px solid rgba(247, 215, 116, 0.28);
        background: rgba(0, 0, 0, 0.35);
        color: inherit; font: inherit; cursor: pointer;
    }
    .campagna:hover { border-color: rgba(247, 215, 116, 0.6); }
    .campagna--bloccata { opacity: 0.5; cursor: default; }
    .campagna-icona {
        flex: none; width: 58px; height: 58px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.7rem;
        background: linear-gradient(150deg, rgba(40, 32, 20, 0.92), rgba(18, 16, 22, 0.95));
        border: 2px solid rgba(247, 215, 116, 0.4);
    }
    .campagna-testo { min-width: 0; }
    .campagna-nome { font-size: 1.1rem; font-weight: 900; color: var(--gold); }
    .campagna-sottotitolo { font-size: 0.72rem; opacity: 0.7; font-style: italic; margin-bottom: 4px; }
    .campagna-desc { font-size: 0.82rem; line-height: 1.4; opacity: 0.85; }
    .campagna-stato { font-size: 0.7rem; margin-top: 6px; color: var(--gold); letter-spacing: 1px; }

    /* --- Mappa della campagna ------------------------------------- */
    .mappa-intestazione {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .mappa-titolo { font-size: 1.05rem; font-weight: 900; color: var(--gold); }
    .mappa-capitolo { font-size: 0.72rem; opacity: 0.75; letter-spacing: 1.5px; text-transform: uppercase; }
    /* La riga qui sopra dice DOVE sei ("Capitolo 4 di 7"), questa dice di
       cosa si tratta. Tono diverso apposta — niente maiuscoletto, niente
       spaziatura allargata — perché si legge come una frase e non come
       un'etichetta. Larghezza limitata per restare leggibile: una riga di
       prosa lunga quanto uno schermo desktop si segue male. */
    .mappa-capitolo-testo {
        margin-top: 6px;
        max-width: 56ch;
        font-size: 0.86rem;
        line-height: 1.5;
        opacity: 0.85;
    }
    /* La mappa si prende tutta l'altezza rimasta sotto l'intestazione e
       la striscia dei capitoli, invece di una frazione fissa dello
       schermo: era 62vh, cioè quasi sempre una finestrella con parecchio
       vuoto sotto. `min-height` è la rete di sicurezza per gli schermi
       molto bassi, dove ciò che avanza non basterebbe. */
    #vistaMappa { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    /* SERVE, non è ridondante: la regola qui sopra è un selettore di id,
       quindi batte per specificità il `display: none` che il browser dà
       da sé a [hidden]. Senza questa riga la vista mappa non si nasconde
       MAI, e sull'elenco delle campagne restavano appesi in fondo i suoi
       pezzi statici — i pulsanti "← Campagne"/"Ricomincia" e la barra
       dell'avanzamento — sotto le schede delle storie. */
    #vistaMappa[hidden] { display: none; }
    #mappaViewport { flex: 1; min-height: 300px; }

    /* Il riassunto che apre e chiude il resto: esiste SOLO su schermi
       stretti (vedi il @media in fondo). Su desktop lo spazio non manca e
       nascondere le informazioni sarebbe solo un clic in più. */
    .mappa-toggle { display: none; }
    .mappa-toggle-freccia { transition: transform 0.2s ease; }
    .mappa-toggle[aria-expanded="true"] .mappa-toggle-freccia { transform: rotate(180deg); }

    /* Striscia dei capitoli: scorre in orizzontale su schermi stretti
       invece di andare a capo, così resta una riga sola e si capisce che
       è una sequenza. */
    .capitoli {
        display: flex; gap: 8px; margin-bottom: 8px;
        overflow-x: auto; padding-bottom: 4px;
        scrollbar-width: thin;
    }
    .cap {
        flex: none; display: flex; align-items: center; gap: 7px;
        padding: 6px 11px; border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(0, 0, 0, 0.3);
        font-size: 0.7rem; opacity: 0.55;
    }
    .cap--fatto { opacity: 0.85; border-color: rgba(247, 215, 116, 0.35); }
    .cap--corrente {
        opacity: 1;
        border-color: var(--gold);
        background: rgba(247, 215, 116, 0.12);
        box-shadow: 0 0 14px rgba(247, 215, 116, 0.2);
    }
    .cap-nome { font-weight: 800; white-space: nowrap; }
    .cap--corrente .cap-nome { color: var(--gold); }
    .cap-conta { font-size: 0.64rem; opacity: 0.8; font-variant-numeric: tabular-nums; }

    .avanzamento { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avanzamento-barra {
        flex: 1; height: 5px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.1); overflow: hidden;
    }
    .avanzamento-riempi {
        display: block; height: 100%; width: 0;
        background: linear-gradient(90deg, var(--gold-strong), var(--gold));
        transition: width 0.7s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    .avanzamento-testo { font-size: 0.68rem; opacity: 0.75; font-variant-numeric: tabular-nums; }

    /* L'elenco delle carte che una campagna non accetta: e' la parte
       utile del divieto, quindi si legge senza fatica. */
    .fuori-tema {
        list-style: none;
        margin: 10px 0 4px;
        max-height: 40vh;
        overflow-y: auto;
    }
    .fuori-tema li {
        font-size: 0.82rem;
        line-height: 1.45;
        padding: 5px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .barra-azioni { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn {
        padding: 9px 16px; border-radius: 999px;
        border: 1px solid rgba(247, 215, 116, 0.45);
        background: rgba(247, 215, 116, 0.08);
        color: var(--gold); font-weight: 800; font-size: 0.78rem;
        cursor: pointer;
    }
    .btn:hover { background: rgba(247, 215, 116, 0.18); }
    .btn--spento { border-color: rgba(255, 255, 255, 0.18); color: #cfc8b6; background: rgba(0, 0, 0, 0.3); }

    /* --- Riquadri di servizio ------------------------------------------
       Le SCENE della storia non stanno più qui: sono intermezzi a
       dialoghi a piena schermata (js/ui/story-cutscene.*). Queste regole
       restano per i due riquadri che non sono racconto ma avvisi — il
       mazzo fuori tema e le ricompense di fine campagna — e che devono
       leggersi come il resto dell'interfaccia, non come una scena. */
    .scena-fondo {
        position: fixed; inset: 0; z-index: 60;
        background: rgba(4, 5, 10, 0.92);
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
    }
    .scena {
        max-width: 620px; width: 100%;
        border-radius: 20px; padding: 24px;
        border: 1px solid rgba(247, 215, 116, 0.35);
        background: linear-gradient(160deg, rgba(28, 24, 18, 0.96), rgba(12, 12, 18, 0.98));
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .scena-chi { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
    .scena-riga { font-size: 0.95rem; line-height: 1.6; margin-bottom: 10px; }
    .scena .btn { margin-top: 10px; }

    /* --- Messaggi -------------------------------------------------- */
    .avviso {
        margin-bottom: 14px; padding: 11px 14px; border-radius: 14px;
        font-size: 0.84rem; line-height: 1.4;
        border: 1px solid rgba(247, 215, 116, 0.3);
        background: rgba(247, 215, 116, 0.08);
    }
    .avviso--perso { border-color: rgba(220, 90, 90, 0.4); background: rgba(220, 90, 90, 0.1); }

    /* Schermi stretti O BASSI. La seconda condizione non è un di più: un
       telefono ruotato in orizzontale è largo 852px — quindi fuori dal
       primo limite — ma alto 393, e lì l'intestazione si mangiava quasi
       tutto lo schermo lasciando alla mappa una striscia di 150px.
       Misurato, non temuto. */
    @media (max-width: 700px), (max-height: 560px) {
        .main { padding: 10px 10px 12px; }
        /* Su schermi stretti la mappa continua a prendersi tutto lo
           spazio rimasto (vedi il flex più sopra): qui basta abbassare la
           rete di sicurezza, perché su un telefono in orizzontale 300px
           sarebbero già quasi tutta la finestra. */
        #mappaViewport { min-height: 220px; }

        /* Tutto ciò che sta SOPRA la mappa si stringe, perché ogni pixel
           che non usa lo prende la mappa. Su un telefono da 852px di
           altezza l'intestazione ne occupava 306 — più di un terzo dello
           schermo per del testo che si legge una volta. */
        .mappa-intestazione { gap: 8px; margin-bottom: 8px; }
        .mappa-titolo { font-size: 0.98rem; }
        .mappa-capitolo-testo {
            margin-top: 4px;
            font-size: 0.78rem;
            line-height: 1.4;
            /* Due righe e poi basta: la descrizione del capitolo è un
               invito, non un testo da studiare, e più in basso c'è la
               mappa. */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .capitoli { gap: 6px; margin-bottom: 6px; }
        .cap { padding: 5px 9px; }
        .avanzamento { gap: 8px; margin-bottom: 8px; }

        /* IL COLLAPSE. Chiuso resta solo questa riga, e tutto il resto
           dello schermo è mappa. */
        .mappa-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            /* 44px pieni: è una cosa che si tocca spesso. */
            min-height: 44px;
            padding: 8px 14px;
            margin-bottom: 8px;
            border-radius: 14px;
            border: 1px solid rgba(247, 215, 116, 0.3);
            background: rgba(247, 215, 116, 0.07);
            color: var(--gold);
            font: 800 0.8rem/1.3 inherit;
            text-align: left;
            cursor: pointer;
        }
        .mappa-toggle:active { transform: scale(0.99); }
        .mappa-toggle-testo { min-width: 0; }
        #vistaMappa.compatto .mappa-dettagli { display: none; }
    }
</style>
</head>
<body>
<script src="js/ui/page-loader.js"></script>
<div id="topbarMount"></div>

<main class="main">
    <div id="avvisoMount"></div>

    <!-- Scelta della campagna: unica cosa visibile finché non se ne apre una. -->
    <section id="sceltaCampagna">
        <div class="campagne" id="campagneLista"></div>
    </section>

    <!-- Mappa della campagna aperta. -->
    <section id="vistaMappa" hidden>
        <!-- Solo su schermi stretti: una riga sola che riassume dove sei e
             apre/chiude tutto il resto. Su un telefono quelle informazioni
             occupavano un terzo dello schermo per del testo che si legge
             una volta, mentre la mappa è la cosa con cui si interagisce. -->
        <button type="button" class="mappa-toggle" id="mappaToggle" aria-expanded="false" aria-controls="mappaDettagli">
            <span class="mappa-toggle-testo" id="mappaToggleTesto"></span>
            <span class="mappa-toggle-freccia" aria-hidden="true">▾</span>
        </button>

        <div class="mappa-dettagli" id="mappaDettagli">
        <div class="mappa-intestazione">
            <div>
                <div class="mappa-titolo" id="mappaTitolo"></div>
                <div class="mappa-capitolo" id="mappaCapitolo"></div>
                <!-- Di cosa parla il capitolo in corso. Vuoto (e nascosto)
                     se quel capitolo non lo dichiara: il campo `testo` del
                     catalogo è facoltativo. -->
                <div class="mappa-capitolo-testo" id="mappaCapitoloTesto" hidden></div>
            </div>
            <div class="barra-azioni">
                <button type="button" class="btn btn--spento" id="btnIndietro">← Campagne</button>
                <button type="button" class="btn btn--spento" id="btnRicomincia">Ricomincia</button>
            </div>
        </div>
        <!-- Striscia dei capitoli + avanzamento complessivo: dove sei e
             quanto manca, senza dover contare i pallini sulla mappa. -->
        <div class="capitoli" id="capitoliMount"></div>
        <div class="avanzamento">
            <span class="avanzamento-barra"><span class="avanzamento-riempi" id="avanzamentoRiempi"></span></span>
            <span class="avanzamento-testo" id="avanzamentoTesto"></span>
        </div>
        </div><!-- /.mappa-dettagli -->
        <div id="mappaViewport"></div>
    </section>
</main>

<div id="scenaMount"></div>

<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<script src="js/save-manager.js"></script>
<script src="js/economy/rewards.js"></script>
<!-- Il database carte serve a controllare che il mazzo attivo sia in tema
     con la campagna (vedi carteAmmesse in js/data/story-campaigns.js):
     senza, la Storia non saprebbe da quale set viene una carta. Il
     generato va PRIMA di cards-db.js, che contiene solo le funzioni di
     supporto — stesso ordine di cartoteca.html. -->
<script src="js/data/cards-data.generated.js"></script>
<script src="js/data/cards-db.js"></script>
<!-- Serve solo a NOMINARE il mazzo consigliato di una campagna quando il
     mazzo attivo è fuori tema (vedi mazzoConsigliato). -->
<script src="js/data/starter-structure-decks.js"></script>
<!-- Il roster serve ai ritratti e ai nomi veri sui nodi della mappa: una
     campagna dichiara CHI si affronta, non che faccia abbia. -->
<script src="js/data/characters-db.js"></script>
<script src="js/data/story-campaigns.js"></script>
<script src="js/story/story-progress.js"></script>
<script src="js/ui/node-map.js"></script>
<!-- Il livello di Dettagli video: la polvere dorata nelle scene e sulla
     mappa si accende solo su "Alti", come gli ologrammi in duello. Va
     PRIMA di chi la interroga. -->
<script src="js/ui/video-quality.js"></script>
<!-- Le scene a dialoghi. characters-db.js è già caricato più sopra: è da
     lì che il componente prende nome e ritratto di chi parla. -->
<script src="js/ui/story-cutscene.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/deck-box.js"></script>
<script src="js/ui/deck-switcher.js"></script>
<script src="js/ui/topbar.js"></script>
<!-- ⚠️ TEMPORANEO, DA RIMUOVERE: scorciatoie per provare la Storia senza
     giocare ventisei duelli. Inerte senza ?test=1 nell'URL. Vedi
     l'intestazione di js/dev/test-shortcuts.js. -->
<script src="js/dev/test-shortcuts.js"></script>
<script>
    // `deck: true`: da qui si entra in un duello, quindi serve vedere (e
    // poter cambiare) il mazzo — come in Tornei e Duello Libero.
    PageTopbar.render('#topbarMount', { icon: 'story', title: 'Storia', deck: true });
    // La colonna sonora si decide PRIMA di avviare l'audio, non dopo:
    // partire dal tema del menu per poi cambiarlo farebbe scaricare due
    // brani e sentire mezzo secondo di quello sbagliato. Il cambio in
    // corsa resta comunque possibile (musicaDellaCampagna, più sotto),
    // perché è quello che serve tornando all'elenco delle campagne.
    (function () {
        const aperta = new URLSearchParams(location.search).get('campaign');
        const campagna = aperta && window.StoryProgress ? StoryProgress.getCampaign(aperta) : null;
        initAudioManager(campagna && campagna.musica
            ? { trackSrc: 'audio/soundtracks/' + campagna.musica }
            : undefined);
    })();
    Icons.hydrate();

    // Quale campagna si sta guardando. Vive nell'URL (?campaign=...) e non
    // in una variabile: tornando da un duello si rientra esattamente dove
    // si era, senza doverlo ricordare da qualche parte.
    const params = new URLSearchParams(location.search);
    let campagnaAperta = params.get('campaign');
    // Quale TORNEO si sta giocando dentro la campagna, se si è entrati in
    // uno (kind: 'torneo'). Come la campagna, vive nell'URL: tornando da
    // un duello si rientra dentro il torneo e non sulla mappa grande, e
    // il tasto Indietro del telefono ne esce come ci si aspetta.
    let torneoAperto = params.get('torneo');

    function mostraAvviso(testo, classe) {
        const mount = document.getElementById('avvisoMount');
        mount.innerHTML = '';
        if (!testo) return;
        const el = document.createElement('div');
        el.className = 'avviso' + (classe ? ' ' + classe : '');
        el.textContent = testo;
        mount.appendChild(el);
    }

    // ================================================================
    // Elenco delle campagne
    // ================================================================
    function renderCampagne() {
        const lista = document.getElementById('campagneLista');
        lista.innerHTML = '';
        StoryProgress.getCampaigns().forEach((campagna) => {
            const tappe = StoryProgress.getTappe(campagna.id);
            const disponibile = tappe.length > 0;
            const progress = StoryProgress.getProgress(campagna.id);

            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'campagna' + (disponibile ? '' : ' campagna--bloccata');
            card.disabled = !disponibile;

            const icona = document.createElement('div');
            icona.className = 'campagna-icona';
            icona.textContent = disponibile ? campagna.icona : '🔒';

            const testo = document.createElement('div');
            testo.className = 'campagna-testo';
            const nome = document.createElement('div');
            nome.className = 'campagna-nome';
            nome.textContent = campagna.nome;
            const sotto = document.createElement('div');
            sotto.className = 'campagna-sottotitolo';
            sotto.textContent = campagna.sottotitolo || '';
            const desc = document.createElement('div');
            desc.className = 'campagna-desc';
            desc.textContent = campagna.descrizione || '';
            const stato = document.createElement('div');
            stato.className = 'campagna-stato';
            stato.textContent = !disponibile ? 'In arrivo'
                : (progress.finita ? `✅ Completata · ${tappe.length} tappe`
                    : `${progress.completate}/${tappe.length} tappe`);
            testo.append(nome, sotto, desc, stato);

            card.append(icona, testo);
            if (disponibile) {
                card.addEventListener('click', () => {
                    // Si cambia l'URL invece di nascondere e mostrare al
                    // volo: così il tasto Indietro del telefono torna
                    // all'elenco, che è quello che uno si aspetta.
                    location.href = 'storia.html?campaign=' + encodeURIComponent(campagna.id);
                });
            }
            lista.appendChild(card);
        });
    }

    // ================================================================
    // Mappa di una campagna
    // ================================================================
    function renderMappa(campaignId) {
        const campagna = StoryProgress.getCampaign(campaignId);
        if (!campagna) { campagnaAperta = null; renderTutto(); return; }

        document.getElementById('sceltaCampagna').hidden = true;
        document.getElementById('vistaMappa').hidden = false;
        // I due pulsanti tornano quelli della campagna: dentro un torneo
        // renderTorneo li cambia (vedi lì).
        document.getElementById('btnIndietro').textContent = '← Campagne';
        document.getElementById('btnRicomincia').hidden = false;

        const tappe = StoryProgress.getTappeConStato(campaignId);
        const corrente = tappe.find((t) => t.stato === 'corrente');
        const capitoli = StoryProgress.getCapitoliConStato(campaignId);
        document.getElementById('mappaTitolo').textContent = campagna.nome;
        document.getElementById('mappaCapitolo').textContent = corrente
            ? `Capitolo ${corrente.capitoloIndice + 1} di ${capitoli.length} · ${corrente.capitoloNome}`
            : 'Campagna completata';
        // Solo il capitolo IN CORSO racconta di cosa parla: mostrare anche
        // quelli successivi vorrebbe dire anticipare la storia a chi non
        // ci è ancora arrivato.
        const descrizione = document.getElementById('mappaCapitoloTesto');
        const testoCapitolo = corrente ? corrente.capitoloTesto : '';
        descrizione.textContent = testoCapitolo || '';
        descrizione.hidden = !testoCapitolo;
        renderCapitoli(capitoli, tappe);
        aggiornaRiassunto(campagna, corrente, capitoli,
            tappe.filter((t) => t.stato === 'fatta').length, tappe.length);
        applicaDettagli(dettagliAperti());

        NodeMap.render('#mappaViewport', {
            nodi: tappe.map((t) => ({
                id: t.id, x: t.x, y: t.y, icona: t.icona,
                // Su un nodo di duello l'etichetta è il nome VERO
                // dell'avversario quando il roster lo conosce: il campo
                // `label` del catalogo resta il ripiego, non la fonte.
                label: (t.kind === 'duel' && t.nomeAvversario) || t.label,
                // Quando il nome dell'avversario ha preso il posto del
                // `label`, quel `label` scende sotto come LUOGO. Su una
                // mappa geografica serve davvero: lo stesso avversario
                // torna in capitoli diversi, e senza il posto i suoi nodi
                // sono identici fra loro.
                sottotitolo: (t.kind === 'duel' && t.nomeAvversario && t.label) ? t.label : '',
                immagine: t.immagine,
                stato: t.stato, tappa: t
            })),
            larghezza: campagna.larghezza,
            altezza: campagna.altezza,
            sfondo: campagna.sfondo,
            // Anche le tappe già superate si aprono: una scena si rilegge,
            // un duello si RIGIOCA. In entrambi i casi la storia non
            // avanza — la tappa successiva si sblocca solo giocandola.
            cliccabili: ['corrente', 'fatta'],
            onSelect: (nodo) => apriTappa(campaignId, nodo.tappa)
        });
    }

    // ================================================================
    // Mappa di un TORNEO dentro la campagna (kind: 'torneo')
    // ================================================================
    /**
     * Stessa mappa a nodi della campagna, ma con le prove del torneo e la
     * sua immagine. Il componente è lo stesso: da qui in giù un torneo è
     * solo un altro elenco di tappe da disegnare.
     *
     * Non c'è una striscia di capitoli — un torneo è un capitolo solo —
     * quindi al suo posto va il nome del torneo e quanti incontri
     * restano.
     */
    function renderTorneo(campaignId, torneoId) {
        const campagna = StoryProgress.getCampaign(campaignId);
        const torneo = StoryProgress.getTorneo(campaignId, torneoId);
        // Torneo inesistente, o campagna che non c'è più: si ricade sulla
        // mappa della campagna invece di restare su una schermata vuota.
        if (!campagna || !torneo) { torneoAperto = null; renderTutto(); return; }
        // Torneo GIÀ VINTO (la campagna è andata oltre quella tappa): ci
        // si rientra e lo si rifà, come ogni altra tappa già superata.
        // L'unica cosa da evitare è il vicolo cieco — un tabellone tutto
        // pieno, con ogni incontro superato e nessuno da giocare — quindi
        // lo si riazzera nel momento in cui ci si entra. Non è una
        // scorciatoia per il caso "rigioco": è la stessa riga che rende
        // impossibile il vicolo cieco anche arrivandoci per URL.
        const tappaTorneo = StoryProgress.getTappeConStato(campaignId).find((t) => t.id === torneoId);
        const rigiocato = !!(tappaTorneo && tappaTorneo.stato === 'fatta');
        if (rigiocato && StoryProgress.getProgressoTorneo(campaignId, torneoId) >= (torneo.tappe || []).length) {
            StoryProgress.azzeraTorneo(campaignId, torneoId);
        }

        document.getElementById('sceltaCampagna').hidden = true;
        document.getElementById('vistaMappa').hidden = false;

        const prove = StoryProgress.getProveConStato(campaignId, torneoId);
        const fatte = prove.filter((p) => p.stato === 'fatta').length;
        // Dentro un torneo i due pulsanti cambiano mestiere: "Indietro"
        // riporta alla campagna (vedi il suo gestore) e "Ricomincia" non
        // ha senso — ricomincerebbe l'intera campagna da dentro un
        // torneo, che è l'ultima cosa che uno si aspetta premendolo qui.
        document.getElementById('btnIndietro').textContent = '← ' + campagna.nome;
        document.getElementById('btnRicomincia').hidden = true;
        document.getElementById('mappaTitolo').textContent = torneo.nome || torneo.label;
        document.getElementById('mappaCapitolo').textContent =
            `${campagna.nome} · Incontro ${Math.min(fatte + 1, prove.length)} di ${prove.length}`;
        const descrizione = document.getElementById('mappaCapitoloTesto');
        descrizione.textContent = torneo.testo || '';
        descrizione.hidden = !torneo.testo;

        // La striscia dei capitoli diventa il tabellone: un segnaposto per
        // incontro, così si vede a colpo d'occhio quanto si è saliti — ed
        // è la stessa cosa che si perde perdendo.
        const mount = document.getElementById('capitoliMount');
        mount.innerHTML = '';
        prove.forEach((prova, i) => {
            const el = document.createElement('div');
            el.className = 'cap' + (prova.stato === 'fatta' ? ' cap--fatto' : '')
                + (prova.stato === 'corrente' ? ' cap--corrente' : '');
            const nome = document.createElement('span');
            nome.className = 'cap-nome';
            // Un incontro non ancora raggiunto non svela chi c'è: in un
            // torneo lo si scopre salendo.
            nome.textContent = prova.stato === 'bloccata'
                ? `Incontro ${i + 1}`
                : (prova.nomeAvversario || prova.label);
            const conta = document.createElement('span');
            conta.className = 'cap-conta';
            conta.textContent = prova.stato === 'fatta' ? '✓' : (i + 1);
            el.append(nome, conta);
            mount.appendChild(el);
        });

        const barra = document.getElementById('avanzamentoRiempi');
        if (barra) {
            const frazione = prove.length ? fatte / prove.length : 0;
            requestAnimationFrame(() => requestAnimationFrame(() => {
                barra.style.width = (frazione * 100) + '%';
            }));
        }
        const testo = document.getElementById('avanzamentoTesto');
        if (testo) testo.textContent = `${fatte}/${prove.length} incontri`;

        const riassunto = document.getElementById('mappaToggleTesto');
        if (riassunto) riassunto.textContent = `${torneo.nome || torneo.label} · ${fatte}/${prove.length} incontri`;
        applicaDettagli(dettagliAperti());

        const mappa = torneo.mappa || {};
        NodeMap.render('#mappaViewport', {
            nodi: prove.map((p) => ({
                id: p.id, x: p.x, y: p.y, icona: p.icona,
                label: p.stato === 'bloccata' ? '' : ((p.kind === 'duel' && p.nomeAvversario) || p.label),
                sottotitolo: (p.kind === 'duel' && p.nomeAvversario && p.label) ? p.label : '',
                immagine: p.stato === 'bloccata' ? null : p.immagine,
                stato: p.stato, tappa: p
            })),
            larghezza: mappa.larghezza,
            altezza: mappa.altezza,
            sfondo: mappa.sfondo,
            // Un incontro già superato NON si rigioca: qui rigiocare non
            // avrebbe senso, perché il tabellone si azzera perdendo e
            // risalire è tutto il gioco. Solo la prova corrente si apre.
            cliccabili: ['corrente'],
            onSelect: (nodo) => apriProva(campaignId, torneoId, nodo.tappa, rigiocato)
        });
    }

    /**
     * Una prova del torneo: come una tappa, ma l'esito va al torneo.
     *
     * `rigiocato` viaggia fino al duello e torna indietro nella
     * breadcrolla, perché è l'unico modo che ha il ritorno di sapere che
     * questo tabellone è già stato vinto una volta e la campagna non
     * deve rifare il suo passo.
     */
    function apriProva(campaignId, torneoId, prova, rigiocato) {
        if (prova.kind === 'scene') { mostraScena(campaignId, prova, false, torneoId); return; }
        const fuoriTema = mazzoFuoriTema(campaignId);
        if (fuoriTema.length > 0) { mostraMazzoFuoriTema(campaignId, fuoriTema); return; }
        conDialogo(prova, campaignId, () => {
            location.href = StoryProgress.urlDuello(campaignId, prova,
                { torneoId: torneoId, rigiocata: rigiocato === true });
        });
    }

    /**
     * La conversazione che precede un duello, quando la tappa ne dichiara
     * una (`dialogo` nel catalogo). Se non c'è, si va dritti: il duello
     * non deve mai dipendere dall'esistenza di due righe di testo.
     */
    /**
     * Dà nome e faccia alle battute del PROTAGONISTA.
     *
     * Nel catalogo una battuta del giocatore si marca con `io: true` e
     * basta: chi sia, come si chiami e che faccia abbia lo decide la
     * campagna (campo `protagonista`, vedi js/data/story-campaigns.js).
     * Prima quelle battute portavano il nome scritto a mano dentro ogni
     * singola riga ("Il Principe", "Il Regio Esercito") e non avevano
     * ritratto: un cerchio vuoto col sigillo, mentre l'avversario davanti
     * aveva la sua fotografia. E soprattutto erano centocinquanta copie
     * della stessa informazione, che cambiando idea sul nome andavano
     * corrette una per una.
     *
     * Una campagna che non dichiara un protagonista lascia la battuta
     * esattamente com'era: `io` diventa un campo inerte, non un buco.
     */
    function vociDelProtagonista(campaignId, battute, tappa) {
        // Il protagonista della TAPPA quando c'è (già risolto dal capitolo
        // alla campagna in js/story/story-progress.js), la campagna come
        // ripiego per chi chiama senza una tappa in mano. Serve perché
        // dentro una sola storia si cambia panni: in Memorie Proibite sei
        // Atem, ma nel capitolo del presente sei Yugi Muto.
        const campagna = StoryProgress.getCampaign(campaignId);
        const p = (tappa && tappa.protagonista) || (campagna && campagna.protagonista);
        if (!p) return battute;
        return battute.map((b) => (b.io !== true ? b : Object.assign({}, b, {
            nome: p.name,
            ritratto: p.image,
            icona: p.icon || b.icona
        })));
    }

    function conDialogo(tappa, campaignId, poi) {
        const battute = vociDelProtagonista(campaignId, tappa.dialogo || [], tappa);
        if (!battute.length) { poi(); return; }
        const pg = tappa.characterId ? StoryProgress.getPersonaggio(tappa.characterId) : null;
        StoryCutscene.play(battute, {
            titolo: (pg && pg.name) || tappa.label || '',
            sottotitolo: (pg && pg.title) || '',
            sfondo: [tappa.field]
        }).then(poi);
    }

    /**
     * La striscia dei capitoli: dove sei, quanto manca, e quanto hai
     * già fatto. Su una mappa alta duemila pixel contare i pallini non è
     * un'informazione che si possa chiedere a nessuno.
     */
    function renderCapitoli(capitoli, tappe) {
        const mount = document.getElementById('capitoliMount');
        mount.innerHTML = '';
        capitoli.forEach((cap) => {
            const el = document.createElement('div');
            el.className = 'cap' + (cap.completo ? ' cap--fatto' : '') + (cap.corrente ? ' cap--corrente' : '');
            const nome = document.createElement('span');
            nome.className = 'cap-nome';
            nome.textContent = cap.nome;
            const conta = document.createElement('span');
            conta.className = 'cap-conta';
            conta.textContent = cap.completo ? '✓' : `${cap.fatte}/${cap.totali}`;
            el.append(nome, conta);
            mount.appendChild(el);
        });
        const fatte = tappe.filter((t) => t.stato === 'fatta').length;
        const barra = document.getElementById('avanzamentoRiempi');
        if (barra) {
            const frazione = tappe.length ? fatte / tappe.length : 0;
            requestAnimationFrame(() => requestAnimationFrame(() => {
                barra.style.width = (frazione * 100) + '%';
            }));
        }
        const testo = document.getElementById('avanzamentoTesto');
        if (testo) testo.textContent = `${fatte}/${tappe.length} tappe`;
    }

    // ================================================================
    // Il riassunto pieghevole (solo su schermi stretti)
    // ================================================================
    const CHIAVE_DETTAGLI = 'ygoStoriaDettagliAperti';

    /**
     * Le informazioni sulla campagna restano chiuse di default su
     * telefono: occupavano un terzo dello schermo per del testo che si
     * legge una volta, mentre la mappa è la cosa con cui si interagisce.
     * La scelta si ricorda, perché è una preferenza di come si guarda il
     * gioco e non un'impostazione della partita — stesso motivo per cui
     * i Dettagli video vivono in localStorage e non nel salvataggio.
     */
    function dettagliAperti() {
        try { return localStorage.getItem(CHIAVE_DETTAGLI) === '1'; } catch (e) { return false; }
    }

    function applicaDettagli(aperti) {
        const sezione = document.getElementById('vistaMappa');
        const bottone = document.getElementById('mappaToggle');
        if (!sezione || !bottone) return;
        sezione.classList.toggle('compatto', !aperti);
        bottone.setAttribute('aria-expanded', aperti ? 'true' : 'false');
        try { localStorage.setItem(CHIAVE_DETTAGLI, aperti ? '1' : '0'); } catch (e) { /* si perde la preferenza, non la pagina */ }
    }

    /** Il riassunto in una riga: dove sei e quanto manca. */
    function aggiornaRiassunto(campagna, corrente, capitoli, fatte, totali) {
        const el = document.getElementById('mappaToggleTesto');
        if (!el) return;
        const dove = corrente
            ? `Cap. ${corrente.capitoloIndice + 1}/${capitoli.length} · ${corrente.capitoloNome}`
            : 'Completata';
        el.textContent = `${campagna.nome} — ${dove} · ${fatte}/${totali}`;
    }

    document.getElementById('mappaToggle').addEventListener('click', () => {
        if (window.NativeHaptics) NativeHaptics.light();
        applicaDettagli(document.getElementById('vistaMappa').classList.contains('compatto'));
    });

    /**
     * Una scena si legge e si va avanti; un duello porta via dalla
     * pagina. Sono gli unici due modi di superare una tappa, e stanno
     * qui insieme perché è la stessa domanda: "cosa succede quando
     * clicco il pallino acceso?".
     */
    function apriTappa(campaignId, tappa) {
        // Una tappa già superata si può rifare, ma non fa avanzare niente:
        // una scena si rilegge, un duello si rigioca come un Duello Libero
        // contro quell'avversario — premi compresi — mentre la storia
        // resta dov'è (vedi `rigiocata` in js/story/story-progress.js).
        const rifatta = tappa.stato === 'fatta';
        if (tappa.kind === 'scene') { mostraScena(campaignId, tappa, rifatta); return; }
        // Una tappa-torneo non è un duello: si entra nel suo percorso.
        // Si cambia l'URL invece di scambiare le viste al volo, così il
        // tasto Indietro ne esce e tornando da un duello si rientra qui.
        if (tappa.kind === 'torneo') {
            location.href = 'storia.html?campaign=' + encodeURIComponent(campaignId)
                + '&torneo=' + encodeURIComponent(tappa.id);
            return;
        }
        // Il mazzo dev'essere in tema con la campagna. Il controllo sta
        // QUI, prima di lasciare la pagina: scoprirlo dentro il duello
        // vorrebbe dire scoprirlo quando non si può più cambiare nulla.
        const fuoriTema = mazzoFuoriTema(campaignId);
        if (fuoriTema.length > 0) { mostraMazzoFuoriTema(campaignId, fuoriTema); return; }
        conDialogo(tappa, campaignId, () => {
            location.href = StoryProgress.urlDuello(campaignId, tappa, { rigiocata: rifatta });
        });
    }

    /** Le carte del mazzo attivo che questa campagna non accetta. */
    function mazzoFuoriTema(campaignId) {
        if (!window.SaveManager || !SaveManager.getActiveDeck) return [];
        const deck = SaveManager.getActiveDeck();
        return deck ? StoryProgress.carteNonAmmesse(campaignId, deck) : [];
    }

    function mostraMazzoFuoriTema(campaignId, carte) {
        const mount = document.getElementById('scenaMount');
        mount.innerHTML = '';
        const fondo = document.createElement('div');
        fondo.className = 'scena-fondo';
        const scena = document.createElement('div');
        scena.className = 'scena';

        const titolo = document.createElement('div');
        titolo.className = 'scena-chi';
        titolo.textContent = '🚫 Mazzo fuori tema';
        const regola = document.createElement('p');
        regola.className = 'scena-riga';
        regola.textContent = StoryProgress.descriviCarteAmmesse(campaignId)
            || 'Questa campagna accetta solo alcune carte.';
        scena.append(titolo, regola);

        // L'elenco e' il punto: "non puoi giocare" senza dire cosa
        // togliere lascerebbe a indovinare su quaranta carte.
        const elenco = document.createElement('ul');
        elenco.className = 'fuori-tema';
        carte.slice(0, 12).forEach((c) => {
            const li = document.createElement('li');
            li.textContent = `${c.nome}${c.copie > 1 ? ' ×' + c.copie : ''} — ${c.motivo}`;
            elenco.appendChild(li);
        });
        if (carte.length > 12) {
            const li = document.createElement('li');
            li.textContent = `…e altre ${carte.length - 12}`;
            elenco.appendChild(li);
        }
        scena.appendChild(elenco);

        // Se la campagna dice con quale mazzo si gioca, lo si dice: per la
        // Grande Guerra nessun giocatore ha per caso un mazzo di soli
        // Bersaglieri, e mandarlo a "cambiare mazzo" senza altro sarebbe
        // mandarlo a cercare una cosa che non ha.
        const campagna = StoryProgress.getCampaign(campaignId);
        const suggerito = campagna && campagna.mazzoConsigliato
            && typeof getStarterStructureDeck === 'function'
            && getStarterStructureDeck(campagna.mazzoConsigliato);
        if (suggerito) {
            const consiglio = document.createElement('p');
            consiglio.className = 'scena-riga';
            consiglio.textContent = `Mazzo consigliato: "${suggerito.name}". Lo trovi in Creazione Deck.`;
            scena.appendChild(consiglio);
        }

        const azioni = document.createElement('div');
        azioni.className = 'barra-azioni';
        const vaiAlDeck = document.createElement('button');
        vaiAlDeck.type = 'button';
        vaiAlDeck.className = 'btn';
        vaiAlDeck.textContent = 'Cambia mazzo';
        vaiAlDeck.addEventListener('click', () => { location.href = 'creazione-deck.html'; });
        const chiudi = document.createElement('button');
        chiudi.type = 'button';
        chiudi.className = 'btn btn--spento';
        chiudi.textContent = 'Torna alla mappa';
        chiudi.addEventListener('click', () => { mount.innerHTML = ''; });
        azioni.append(vaiAlDeck, chiudi);
        scena.appendChild(azioni);

        fondo.appendChild(scena);
        mount.appendChild(fondo);
    }

    /**
     * Le scene sono intermezzi a dialoghi, gli stessi dei tornei
     * (js/ui/story-cutscene.js): fondo con il LUOGO della scena, ritratto
     * di chi parla, testo che si scrive una riga alla volta e avanza al
     * tocco. Prima erano un riquadro fermo con tutto il testo insieme e
     * un pulsante "Avanti": si leggeva come una finestra di dialogo del
     * sistema operativo, non come un racconto.
     *
     * Ogni riga del catalogo diventa una BATTUTA a sé, e non è un
     * dettaglio: è ciò che rende la scena interattiva invece che passiva
     * — si scopre una frase per volta, al proprio ritmo, come in un
     * qualunque gioco a dialoghi.
     */
    function mostraScena(campaignId, tappa, rilettura, torneoId) {
        const campagna = StoryProgress.getCampaign(campaignId);
        const righe = [].concat(tappa.testo || []);
        const battute = vociDelProtagonista(campaignId, righe.map((testo) => ({
            // `io: true` sulla tappa: a parlare è il protagonista della
            // campagna, e nome/ritratto li dà lei (vedi più sotto).
            io: tappa.io === true,
            // `chiId` aggancia la voce al roster (nome vero e ritratto);
            // `chi` è il nome scritto nel catalogo, che vale anche per chi
            // nel roster non c'è affatto ("Il Bollettino", "La troupe").
            chi: tappa.chiId || undefined,
            nome: tappa.chi || undefined,
            // Il simbolo del sigillo quando il ritratto manca: quello
            // della tappa, che è già scelto a tema (🌊 per il mare, ⛰️
            // per la montagna).
            icona: tappa.icona,
            testo: testo
        })), tappa);

        StoryCutscene.play(battute, {
            titolo: tappa.label || '',
            sottotitolo: tappa.capitoloNome || '',
            // Il luogo: quello dichiarato dalla tappa, altrimenti lo
            // sfondo della campagna. Il componente prova i candidati in
            // ordine e usa il primo che esiste davvero.
            sfondo: [tappa.field, campagna && campagna.sfondo]
        }).then(() => {
            // Una rilettura non tocca il progresso: si chiude la scena e
            // si resta esattamente dov'eravamo.
            if (rilettura) return;
            // Una scena DENTRO un torneo fa salire il torneo, non la
            // campagna: è una sua prova come le altre.
            if (torneoId) {
                const salita = StoryProgress.avanzaTorneo(campaignId, torneoId);
                if (salita.torneoVinto) { tornaDalTorneo(campaignId, salita); return; }
                renderTorneo(campaignId, torneoId);
                return;
            }
            const esito = StoryProgress.avanza(campaignId);
            return cartelloSeNuovoCapitolo(campaignId).then(() => {
                if (esito.appenaFinita) festeggiaFine(campaignId);
                renderMappa(campaignId);
            });
        });
    }

    /**
     * Il cartello di un capitolo appena cominciato.
     *
     * Sta qui e non dentro la mappa perché è un MOMENTO, non
     * un'informazione: la riga sotto il titolo dice sempre in che
     * capitolo sei, questo si vede una volta sola, quando ci entri.
     * Riusa l'intermezzo a dialoghi invece di inventare una schermata
     * nuova: il cartello con titolo e filo dorato che si apre esiste già
     * lì dentro, e la descrizione del capitolo diventa la voce narrante.
     *
     * Torna sempre una Promise, anche quando non c'è niente da mostrare,
     * così chi chiama può incatenarci il resto senza controllare nulla.
     *
     * Un capitolo SENZA descrizione non mostra il cartello: l'intermezzo
     * ha bisogno di almeno una battuta, e un cartello con un titolo e poi
     * il vuoto sarebbe peggio di nessun cartello. Oggi tutti e ventuno i
     * capitoli la dichiarano; se un domani ne nascesse uno senza, il
     * passaggio resta semplicemente muto invece di rompersi.
     */
    function cartelloSeNuovoCapitolo(campaignId) {
        const tappe = StoryProgress.getTappeConStato(campaignId);
        const corrente = tappe.find((t) => t.stato === 'corrente');
        if (!corrente) return Promise.resolve();
        // La tappa appena superata. Se la corrente è la prima in assoluto
        // non c'è nessun "capitolo precedente", e il cartello ci vuole
        // comunque: è l'inizio della campagna.
        const precedente = tappe[corrente.indice - 1];
        if (precedente && precedente.capitoloId === corrente.capitoloId) return Promise.resolve();

        const campagna = StoryProgress.getCampaign(campaignId);
        const capitoli = StoryProgress.getCapitoliConStato(campaignId);
        return StoryCutscene.play([{ testo: corrente.capitoloTesto || '' }], {
            titolo: corrente.capitoloNome,
            sottotitolo: `Capitolo ${corrente.capitoloIndice + 1} di ${capitoli.length}`,
            sfondo: [campagna && campagna.sfondo]
        });
    }

    /**
     * Campagna finita: si paga il premio (una volta sola, ci pensa
     * StoryProgress) e lo si MOSTRA con la sua spiegazione, come ogni
     * altro premio del gioco.
     */
    function festeggiaFine(campaignId) {
        const campagna = StoryProgress.getCampaign(campaignId);
        // Prima il momento, poi il conto. Arrivare in fondo a ventisei
        // tappe e vedersi comparire un pannello di ricompense e basta
        // liquida la cosa come un acquisto riuscito: il cartello a piena
        // schermata col nome della campagna è il punto fermo del
        // racconto, e il premio viene dopo, dove sta bene.
        StoryCutscene.play([
            { testo: `Qui finisce ${campagna ? campagna.nome : 'la campagna'}.` }
        ], {
            titolo: 'Campagna completata',
            sottotitolo: campagna ? campagna.nome : '',
            sfondo: [campagna && campagna.sfondo]
        }).then(() => mostraPremioFinale(campaignId));
    }

    /** Il pannello delle ricompense, dopo il cartello di chiusura. */
    function mostraPremioFinale(campaignId) {
        const voci = StoryProgress.riscuotiPremioFinale(campaignId);
        const campagna = StoryProgress.getCampaign(campaignId);
        const mount = document.getElementById('scenaMount');
        mount.innerHTML = '';
        const fondo = document.createElement('div');
        fondo.className = 'scena-fondo';
        const scena = document.createElement('div');
        scena.className = 'scena';
        const titolo = document.createElement('div');
        titolo.className = 'scena-chi';
        titolo.textContent = '👑 Campagna completata';
        const riga = document.createElement('p');
        riga.className = 'scena-riga';
        riga.textContent = `Hai portato a termine "${campagna.nome}".`;
        scena.append(titolo, riga);
        if (voci.length > 0 && window.Rewards) {
            // innerHTML sicuro: summaryHtml compone solo testo scritto in
            // js/economy/rewards.js, mai input dell'utente.
            const premi = document.createElement('div');
            premi.innerHTML = Rewards.summaryHtml(voci, 'Ricompense');
            scena.appendChild(premi);
        }
        const chiudi = document.createElement('button');
        chiudi.type = 'button';
        chiudi.className = 'btn';
        chiudi.textContent = 'Continua';
        chiudi.addEventListener('click', () => { mount.innerHTML = ''; renderMappa(campaignId); });
        scena.appendChild(chiudi);
        fondo.appendChild(scena);
        mount.appendChild(fondo);
    }

    document.getElementById('btnIndietro').addEventListener('click', () => {
        // Da dentro un torneo si esce sulla mappa della campagna, non
        // all'elenco: il tabellone resta dov'è e ci si può rientrare —
        // si perde la scalata perdendo un incontro, non uscendo.
        location.href = torneoAperto
            ? 'storia.html?campaign=' + encodeURIComponent(campagnaAperta)
            : 'storia.html';
    });
    /**
     * Una domanda a cui si può rispondere di no, nello stesso riquadro
     * che la pagina usa già per il mazzo fuori tema e per il premio
     * finale. Torna una Promise che si risolve con true/false: chi chiama
     * non deve sapere nient'altro.
     *
     * Serve perché qui si distruggono progressi, e i tornei una conferma
     * ce l'hanno già ("Perderai tutti i progressi..."): non c'era motivo
     * perché la Storia fosse l'unica a cancellare quaranta tappe al primo
     * tocco sbagliato.
     */
    function chiediConferma(titolo, testo, etichettaConferma) {
        return new Promise((risolvi) => {
            const mount = document.getElementById('scenaMount');
            mount.innerHTML = '';
            const fondo = document.createElement('div');
            fondo.className = 'scena-fondo';
            const scena = document.createElement('div');
            scena.className = 'scena';

            const t = document.createElement('div');
            t.className = 'scena-chi';
            t.textContent = titolo;
            const p = document.createElement('p');
            p.className = 'scena-riga';
            p.textContent = testo;
            scena.append(t, p);

            const azioni = document.createElement('div');
            azioni.className = 'barra-azioni';
            const chiudi = (esito) => { mount.innerHTML = ''; risolvi(esito); };

            const annulla = document.createElement('button');
            annulla.type = 'button';
            annulla.className = 'btn btn--spento';
            annulla.textContent = 'Annulla';
            annulla.addEventListener('click', () => chiudi(false));

            const conferma = document.createElement('button');
            conferma.type = 'button';
            conferma.className = 'btn';
            conferma.textContent = etichettaConferma;
            conferma.addEventListener('click', () => chiudi(true));

            // "Annulla" per primo e già a fuoco: la risposta prudente
            // dev'essere quella che si dà per sbaglio.
            azioni.append(annulla, conferma);
            scena.appendChild(azioni);
            fondo.appendChild(scena);
            mount.appendChild(fondo);
            annulla.focus();
        });
    }

    document.getElementById('btnRicomincia').addEventListener('click', () => {
        if (!campagnaAperta) return;
        const campagna = StoryProgress.getCampaign(campagnaAperta);
        const progress = StoryProgress.getProgress(campagnaAperta);
        const totali = StoryProgress.getTappe(campagnaAperta).length;
        // Niente da perdere, niente da chiedere: a campagna mai iniziata
        // la conferma sarebbe solo un clic in più.
        if (!progress.completate) return;
        chiediConferma(
            '↺ Ricominciare da capo?',
            `Perderai le ${progress.completate} tappe di "${campagna ? campagna.nome : 'questa campagna'}" su ${totali} e ripartirai dalla prima. `
                + 'Le carte e i premi che hai già ottenuto restano tuoi.',
            'Ricomincia'
        ).then((sicuro) => {
            if (!sicuro) return;
            StoryProgress.ricomincia(campagnaAperta);
            mostraAvviso('Campagna ricominciata da capo.');
            renderMappa(campagnaAperta);
        });
    });

    /**
     * Torneo vinto: si esce dalla sua mappa e si torna su quella della
     * campagna, che nel frattempo è avanzata di quella tappa. Passa dal
     * cartello del capitolo come qualunque altra vittoria, così il
     * ritorno non è un salto secco.
     */
    function tornaDalTorneo(campaignId, esito) {
        torneoAperto = null;
        // Via il torneo anche dall'URL, non solo dalla variabile:
        // altrimenti un ricaricamento rientrerebbe in un tabellone finito,
        // con ogni incontro già superato e nessuno cliccabile — un vicolo
        // cieco da cui si esce solo col pulsante Indietro.
        try {
            history.replaceState(null, '', 'storia.html?campaign=' + encodeURIComponent(campaignId));
        } catch (e) { /* su file:// può non essere permesso: pazienza */ }
        const torneo = esito.torneoId ? StoryProgress.getTorneo(campaignId, esito.torneoId) : null;
        const nome = torneo ? (torneo.nome || torneo.label) : 'il torneo';
        // Rifarlo da capo è permesso, ma va detto che la storia resta
        // dov'è: vincere un intero tabellone e vedere la mappa ferma
        // sembrerebbe un difetto, mentre è il comportamento voluto —
        // stesso principio di una tappa qualunque rigiocata.
        mostraAvviso(esito.rigiocata
            ? `Hai rifatto ${nome} e l'hai rivinto. La storia resta dov'era: l'avevi già superato.`
            : `Hai vinto ${nome}. La storia riprende da dove l'avevi lasciata.`);
        renderMappa(campaignId);
        cartelloSeNuovoCapitolo(campaignId).then(() => {
            if (esito.appenaFinita) festeggiaFine(campaignId);
        });
    }

    // ================================================================
    // Avvio
    // ================================================================
    /**
     * La colonna sonora della campagna aperta, se ne ha una (campo
     * `musica`, vedi js/data/story-campaigns.js). Sull'elenco delle
     * campagne, e per ogni campagna che non ne dichiara una, si torna al
     * tema del menu — altrimenti un canto del Piave resterebbe addosso
     * anche a Memorie Proibite, che non c'entra nulla.
     *
     * Va chiamata ad ogni render, non solo all'apertura: questa pagina
     * passa dall'elenco alla mappa e viceversa senza ricaricarsi, quindi
     * non c'è un momento "di ingresso" a cui appendersi una volta sola.
     */
    function musicaDellaCampagna() {
        if (!window.DuelMusic) return;
        const campagna = campagnaAperta ? StoryProgress.getCampaign(campagnaAperta) : null;
        DuelMusic.setTrack(campagna && campagna.musica
            ? 'audio/soundtracks/' + campagna.musica
            : 'audio/soundtracks/mainTheme.mp3');
    }

    function renderTutto() {
        musicaDellaCampagna();
        if (!campagnaAperta) {
            document.getElementById('sceltaCampagna').hidden = false;
            document.getElementById('vistaMappa').hidden = true;
            renderCampagne();
            return;
        }
        // L'esito dell'ultimo duello si consuma PRIMA di disegnare, così
        // la mappa si apre già con la tappa superata alle spalle.
        const esito = StoryProgress.consumaEsitoDuello(campagnaAperta);

        // --- Si sta giocando un TORNEO dentro la campagna -------------
        if (esito.torneoId || torneoAperto) {
            const idTorneo = esito.torneoId || torneoAperto;
            if (esito.torneoVinto) { tornaDalTorneo(campagnaAperta, esito); return; }
            if (esito.perso) {
                const pg = esito.opponentId ? StoryProgress.getPersonaggio(esito.opponentId) : null;
                const chi = pg ? pg.name : 'quel duello';
                mostraAvviso(esito.torneoAzzerato
                    ? `${chi} ti ha eliminato dopo ${esito.torneoAzzerato} ${esito.torneoAzzerato === 1 ? 'incontro' : 'incontri'}. Il tabellone riparte dal primo.`
                    : `${chi} ti ha eliminato al primo incontro. Si ricomincia.`, 'avviso--perso');
            } else if (esito.avanzato) {
                const pg = esito.opponentId ? StoryProgress.getPersonaggio(esito.opponentId) : null;
                mostraAvviso(pg ? `Hai battuto ${pg.name}. Avanti nel tabellone.` : 'Incontro vinto. Avanti nel tabellone.');
            }
            torneoAperto = idTorneo;
            renderTorneo(campagnaAperta, idTorneo);
            return;
        }

        if (esito.rigiocata) {
            // Va detto: aver rivinto e vedere la mappa ferma sembrerebbe
            // un difetto, mentre è il comportamento voluto — la tappa
            // successiva si sblocca giocandola, non rigiocando la
            // precedente.
            const pg = esito.opponentId ? StoryProgress.getPersonaggio(esito.opponentId) : null;
            const chi = pg ? pg.name : 'quel duello';
            mostraAvviso(esito.vinta
                ? `Hai rigiocato e battuto ${chi}. La storia resta dov'era: era una tappa già superata.`
                : `Hai rigiocato ${chi} e perso. Nella storia non cambia nulla: era una tappa già superata.`);
        } else if (esito.perso) {
            mostraAvviso('Hai perso questo duello. La tappa resta lì: riprova quando vuoi.', 'avviso--perso');
        } else if (esito.avanzato) {
            // Vincere e ritrovarsi la mappa senza una parola sembra che
            // non sia successo niente. Il nome di chi si è appena battuto
            // lo si prende dal roster, non dall'esito.
            const pg = esito.opponentId ? StoryProgress.getPersonaggio(esito.opponentId) : null;
            mostraAvviso(pg ? `Hai battuto ${pg.name}. La storia va avanti.` : 'Duello vinto. La storia va avanti.');
        }
        renderMappa(campagnaAperta);
        // Dopo una vittoria si può essere entrati in un capitolo nuovo:
        // è il passaggio più frequente (l'altro è la fine di una scena,
        // gestito in mostraScena). La mappa è già disegnata sotto, così
        // chiudendo il cartello si è già dove si deve essere.
        if (esito.avanzato) {
            cartelloSeNuovoCapitolo(campagnaAperta).then(() => {
                if (esito.appenaFinita) festeggiaFine(campagnaAperta);
            });
        } else if (esito.appenaFinita) {
            festeggiaFine(campagnaAperta);
        }
    }

    renderTutto();
</script>
</body>
</html>
