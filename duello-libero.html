<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Opt-in STATICO alla View Transitions API — deve stare qui, non iniettato via JS in ritardo (vedi js/audio/audio-manager.js per la storia completa del bug che questo risolve). -->

<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<!-- Sfondo scuro applicato SUBITO, prima che gli script auth-gate/supabase
     sotto finiscano di scaricare (bloccanti) — evita un flash bianco
     prima del nero dell'overlay di auth-gate.js, vedi il commento
     completo in cartoteca.html dove è stato diagnosticato. -->
<style>html, body { background: #0b0d14; }</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel Arena">

     rimanda a index.html se non c'è una sessione approvata. -->

<link rel="stylesheet" href="js/ui/topbar.css">
<!-- Selettore di mazzo/arena/musica della modale di difficoltà, condiviso
     con la Sala d'Attesa del Multiplayer, più le scatole 3D dei mazzi. -->
<link rel="stylesheet" href="js/ui/deck-box.css">
<link rel="stylesheet" href="js/ui/duel-setup.css">
<link rel="stylesheet" href="js/ui/sfida-libera.css">
<link rel="stylesheet" href="js/ui/deck-switcher.css">
<title>Yu-Gi-Oh! Duel Arena — Duello Libero</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Niente selezione di testo/pressione lunga sul contenuto del gioco (nomi
       carte, personaggi, pulsanti...): su mobile un tocco prolungato apriva
       il menu di sistema "Cerca su Google"/copia invece di far scattare
       l'interazione del gioco. input/textarea/select restano selezionabili
       normalmente, altrimenti non si potrebbe più scrivere nei campi.
       -webkit-tap-highlight-color: via anche il rettangolo azzurrino che
       il browser mobile dipinge sopra QUALUNQUE elemento toccato —
       segnalato dall'utente tenendo premuto. Non toglie alcun riscontro
       al tocco: i pulsanti del gioco hanno il proprio stato ":active",
       che quel rettangolo si limitava a coprire con un colore di sistema
       estraneo alla tavolozza. Il contorno di messa a fuoco da tastiera
       resta intatto: quello NON passa da questa proprietà.
       overscroll-behavior: niente rimbalzo elastico quando si trascina
       la pagina oltre il bordo, e niente "tira per ricaricare" — su una
       pagina di gioco quel gesto e' a un dito di distanza dal ricaricare
       tutto a meta' duello. */
    html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overscroll-behavior-y: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14;
        min-height: 100vh;
    }
    /* Fondale sullo strato FISSO insieme alla sfumatura, non sul
       background di body: con `html, body { background }` (toppa
       anti-flash) la propagazione alla canvas si disattiva e il
       background di body resta ritagliato dentro il suo box, alto un
       solo viewport (height: 100%) — scorrendo comparirebbe una fascia
       nera sotto l'immagine. Un elemento position:fixed copre sempre il
       viewport, qualunque sia l'altezza del contenuto. */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
            linear-gradient(180deg, rgba(6,7,12,0.45) 0%, rgba(6,7,12,0.55) 60%, rgba(4,5,8,0.65) 100%),
            url('images/background/obelisco.jpg') center/cover no-repeat;
        pointer-events: none;
    }

    :root {
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --red: #e74c3c;
        --cube-w: 190px;
    }

    /* ============================================================
       Topbar: markup/CSS generati da js/ui/topbar.js + js/ui/topbar.css.
       ============================================================ */

    /* ============================================================
       Griglia dei "cubi" personaggio
       ============================================================ */
    .main {
        position: relative;
        z-index: 1;
        padding: 30px 22px 60px;
        max-width: 1400px;
        margin: 0 auto;
    }
    .intro-line {
        text-align: center;
        color: #9aa5bd;
        font-size: 0.88rem;
        margin-bottom: 26px;
        letter-spacing: 0.02em;
    }
    .cube-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--cube-w), 1fr));
        gap: 26px;
        justify-items: center;
        perspective: 900px;
    }
    .series-section { margin-bottom: 38px; }
    .series-section:last-child { margin-bottom: 0; }
    .series-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: var(--gold);
        margin-bottom: 16px;
    }
    .series-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, rgba(247,215,116,0.4), transparent);
    }
    .series-count {
        font-size: 0.72rem;
        font-weight: 700;
        color: #9aa5bd;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        padding: 2px 9px;
        border-radius: 999px;
        letter-spacing: normal;
    }

    .cube {
        width: var(--cube-w);
        cursor: pointer;
        border-radius: 14px;
        border: 2px solid rgba(247,215,116,0.35);
        background: linear-gradient(150deg, rgba(40,32,20,0.9), rgba(18,16,22,0.92));
        overflow: hidden;
        box-shadow: 0 10px 26px rgba(0,0,0,0.4);
        transition: transform 0.3s cubic-bezier(0.16,0.84,0.44,1), box-shadow 0.3s ease, border-color 0.3s ease;
        transform-style: preserve-3d;
    }
    .cube:hover {
        /* Rilievo invece di zoom: la carta si solleva (solo translateY,
           niente scale/rotate) e un'ombra "a gradino" sotto di lei
           suggerisce lo spessore, come un tasto premuto in fuori — più il
           tocco fisico di una carta reale che l'ingrandimento di
           un'anteprima. */
        transform: translateY(-6px);
        border-color: var(--gold-strong);
        box-shadow: 0 5px 0 rgba(0,0,0,0.4), 0 18px 34px rgba(0,0,0,0.5), 0 0 22px rgba(243,156,18,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .cube-portrait {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: linear-gradient(150deg, #3a2f22, #1c1620);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .cube-portrait img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .cube-portrait-fallback {
        font-size: 3.4rem;
        opacity: 0.55;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    }
    .cube-portrait::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 45%, rgba(10,8,6,0.88) 100%);
        pointer-events: none;
    }
    .cube-name {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 8px;
        font-weight: 900;
        font-size: 0.95rem;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0,0,0,0.7);
        z-index: 2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .cube-info {
        padding: 10px 12px 14px;
    }
    /* Una sola riga con ellissi (non più min-height a 2 righe): un
       sottotitolo che va a capo raddoppia l'altezza di testo sotto un
       ritratto già piccolo su mobile, e la card sembra "schiacciata"
       anche se l'immagine resta perfettamente quadrata — il problema
       era il testo, non la griglia. */
    .cube-title {
        font-size: 0.7rem;
        color: #9aa5bd;
        margin-bottom: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .cube-record {
        display: flex;
        gap: 8px;
        font-size: 0.72rem;
        font-weight: 800;
    }
    .cube-record .wins { color: #6fe08a; }
    .cube-record .losses { color: #ff8a7a; }
    .cube-record .sep { color: rgba(255,255,255,0.25); }

    /* Duellante ancora bloccato: si vede chi è, non lo si può sfidare.
       Il ritratto resta, spento e in ombra, con il lucchetto sopra —
       una sagoma riconoscibile dice cosa si sta per guadagnare, una
       casella vuota no. */
    .cube--bloccato { cursor: help; }
    .cube--bloccato:hover { transform: none; }
    .cube--bloccato .cube-portrait img { filter: grayscale(1) brightness(0.4); }
    .cube--bloccato .cube-name { color: rgba(255,255,255,0.7); }
    .cube--bloccato .cube-portrait::before {
        content: '🔒';
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 1.9rem;
        /* Sopra il ritratto ma sotto il nome, che resta la cosa da
           leggere per prima. */
        z-index: 2;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .cube-locked {
        font-size: 0.68rem;
        font-weight: 700;
        line-height: 1.25;
        color: rgba(255,255,255,0.5);
    }

    /* ============================================================
    .toast {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translate(-50%, 16px);
        z-index: 250;
        padding: 12px 22px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(20,20,30,0.96), rgba(35,30,20,0.94));
        border: 1px solid rgba(247,215,116,0.45);
        box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        font-weight: 700;
        font-size: 0.9rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    /* ============================================================
       Telefono — QUESTO blocco deve restare l'ULTIMA cosa nel foglio
       di stile: ogni regola qui sopra (.cube-grid, .cube-name,
       .cube-info...) è definita PRIMA, quindi a parità di
       specificità vince chi arriva DOPO nel sorgente. Un blocco mobile
       messo in cima al file (come accadeva qui prima) viene sovrascritto
       in silenzio dalle regole base sottostanti — bug reale trovato in
       questa pagina: il --cube-w si applicava (il suo :root base era
       sopra), ma gap/padding/font restavano quelli desktop, e le card
       (già strette) sembravano "schiacciate" dal testo desktop-size che
       non ci stava. Occhio a non spezzare mai questo blocco in due.

       Due query separate: (max-width) per i telefoni in verticale,
       (max-height + orientation:landscape) per QUALUNQUE telefono
       ruotato in orizzontale — la larghezza da sola non lo cattura
       (un telefono orizzontale è spesso >480px di larghezza ma solo
       ~350-420px di altezza, quindi restava con le dimensioni desktop).
       ============================================================ */
    @media (max-width: 480px) {
        .main { padding: 14px 8px 40px; }
        .intro-line { font-size: 0.74rem; margin-bottom: 16px; }
        /* 2 per riga (non 3): auto-fill con --cube-w piccolo dava 3 colonne
           strette invece di 2 comode — grid-template-columns esplicito
           forza sempre 2 colonne indipendentemente da quanto ci
           starebbe in teoria, --cube-w sale di conseguenza per riempirle. */
        :root { --cube-w: 150px; }
        .cube-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .cube-name { font-size: 0.82rem; left: 8px; right: 8px; bottom: 7px; }
        .cube-info { padding: 8px 9px 10px; }
        .cube-title { font-size: 0.7rem; margin-bottom: 6px; }
        .cube-record { font-size: 0.72rem; gap: 6px; }
        .series-title { font-size: 0.82rem; margin-bottom: 10px; }
    }

    /* Telefono ruotato in orizzontale (poca altezza, larghezza spesso
       >480px quindi la query sopra non scatta): stessa idea, valori
       intermedi — meno colonne da comprimere ma una topbar/modale che
       devono restare bassi per non mangiare la poca altezza disponibile. */
    @media (max-height: 500px) and (orientation: landscape) {
        .main { padding: 10px 14px 20px; }
        .intro-line { font-size: 0.7rem; margin-bottom: 10px; }
        :root { --cube-w: 118px; }
        .cube-grid { gap: 10px; }
        .series-title { font-size: 0.82rem; margin-bottom: 8px; }
    }

</style>
</head>
<body>
    <script src="js/ui/page-loader.js"></script>
    <div id="topbarMount"></div>

    <main class="main">
        <div id="cubeGrid"></div>
    </main>

    <!-- La finestra "prepara la sfida" la costruisce js/ui/sfida-libera.js,
         la stessa usata dalla vista Duello Libero dentro index.html. -->

    <div class="toast" id="toast"></div>

<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<script src="js/save-manager.js"></script>
<!-- cards-db.js serve solo per CARD_ORIGIN_LABELS (selettore "Carte
     ammesse"): non ha istruzioni eseguite al caricamento e non richiede
     il database carte completo, quindi si può includere da solo. -->
<script src="js/data/cards-db.js"></script>
<script src="js/data/custom-taxonomy.js"></script>
<!-- Controllo "il mio mazzo rispetta le Carte ammesse?" prima di entrare
     nell'arena: gli bastano le 50 carte non standard (file generato,
     ~5 KB) e le carte inventate dal giocatore, non l'intera anagrafica. -->
<script src="js/data/custom-cards.js"></script>
<script src="js/data/card-origins.generated.js"></script>
<script src="js/data/deck-legality.js"></script>
<script src="js/data/characters-db.js"></script>
<script src="js/data/character-unlocks.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/topbar.js"></script>
<script src="js/ui/deck-box.js"></script>
<script src="js/data/arena-options.js"></script>
<script src="js/ui/duel-setup.js"></script>
<script src="js/ui/sfida-libera.js"></script>
<script src="js/ui/deck-switcher.js"></script>
<script>
    // Nessun onBack: il genitore logico di questa pagina è sempre il menu
    // principale, che è già il backHref di default di PageTopbar.render
    // ('index.html') — anche quando si torna qui da un duello appena
    // concluso (js/duel-session.js#goBack), che non ha più bisogno di
    // alcun flag per "aggirare" il pulsante Indietro (vedi la sua stessa
    // funzione goBack: non imposta più ygoSkipReferrerBack).
    // `deck: true` — ritratto (porta al profilo) E mazzo corrente (apre il
    // selettore a scorrimento) in fondo alla barra: qui si sta per
    // duellare, quindi il mazzo è l'informazione giusta da avere sotto gli
    // occhi. Li monta PageTopbar, vedi lì.
    PageTopbar.render('#topbarMount', { icon: 'freeDuel', title: 'Duello Libero', subtitle: 'Scegli un duellante da sfidare', deck: true });

    initAudioManager();
    Icons.hydrate();

    let toastTimeout = null;
    function showToast(text) {
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function createCube(character) {
        const record = getCharacterRecord(character.id);
        // Duellante ancora da guadagnare (js/data/character-unlocks.js):
        // resta VISIBILE, in ombra e con il lucchetto, invece di sparire
        // dalla griglia. Un elenco che si allunga da solo non dice niente
        // su cosa manchi; una fila di sagome bloccate sì, ed è anche il
        // motivo per cui vale la pena andare avanti nella Storia.
        const bloccato = !!(window.CharacterUnlocks && !CharacterUnlocks.sbloccato(character.id));
        const cube = document.createElement('div');
        cube.className = 'cube' + (bloccato ? ' cube--bloccato' : '');
        cube.innerHTML = `
            <div class="cube-portrait">
                <span class="cube-portrait-fallback">🧑‍🎤</span>
                <div class="cube-name">${character.name}</div>
            </div>
            <div class="cube-info">
                <div class="cube-title">${character.title || ''}</div>
                ${bloccato ? '<div class="cube-locked">Si sblocca in Torneo o nella Storia</div>' : `
                <div class="cube-record">
                    <span class="wins">${record.wins}V</span>
                    <span class="sep">•</span>
                    <span class="losses">${record.losses}S</span>
                </div>`}
            </div>
        `;

        const img = document.createElement('img');
        img.alt = character.name;
        img.loading = 'lazy';
        img.onload = () => {
            const fallback = cube.querySelector('.cube-portrait-fallback');
            if (fallback) fallback.remove();
        };
        img.onerror = () => img.remove();
        img.src = character.image;
        cube.querySelector('.cube-portrait').insertBefore(img, cube.querySelector('.cube-name'));

        cube.onclick = () => {
            if (bloccato) { showToast('🔒 ' + CharacterUnlocks.comeSbloccare(character)); return; }
            openDifficultyModal(character);
        };
        return cube;
    }

    // Ordine e nome leggibile di ogni "series" (vedi il campo series di
    // ogni personaggio in js/characters-db.js). Un id non presente qui
    // finirebbe comunque in fondo con il proprio nome grezzo come titolo,
    // invece di sparire — così una futura series dimenticata qui resta
    // visibile invece di scomparire silenziosamente dalla lista.
    const SERIES_ORDER = ['main', 'forbiddenMemories', 'extra', 'special'];
    const SERIES_LABELS = {
        main: 'Serie Principale',
        forbiddenMemories: 'Forbidden Memories',
        extra: 'Extra',
        special: 'Speciali'
    };

    function renderCubes() {
        const container = document.getElementById('cubeGrid');
        container.innerHTML = '';

        const bySeries = new Map();
        characterDatabase.forEach((character) => {
            const key = character.series || 'main';
            if (!bySeries.has(key)) bySeries.set(key, []);
            bySeries.get(key).push(character);
        });

        // SERIES_ORDER prima, poi qualunque series imprevista rimasta
        // (mai perdere silenziosamente un personaggio da un id dimenticato).
        const orderedKeys = [...SERIES_ORDER, ...[...bySeries.keys()].filter(k => !SERIES_ORDER.includes(k))];

        orderedKeys.forEach((key) => {
            const characters = bySeries.get(key);
            if (!characters || characters.length === 0) return;

            const section = document.createElement('div');
            section.className = 'series-section';

            const title = document.createElement('div');
            title.className = 'series-title';
            title.innerHTML = `<span>${SERIES_LABELS[key] || key}</span><span class="series-count">${characters.length}</span>`;
            section.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'cube-grid';
            characters.forEach((character) => grid.appendChild(createCube(character)));
            section.appendChild(grid);

            container.appendChild(section);
        });
    }

    // La finestra "prepara la sfida" (arena, musica, carte ammesse, livello
    // e l'avvio del duello) è js/ui/sfida-libera.js, condivisa con la vista
    // Duello Libero di index.html: due copie scritte a mano si erano già
    // separate una volta.
    function openDifficultyModal(character) {
        SfidaLibera.apri(character, { toast: showToast });
    }

    renderCubes();
    // Un amministratore vede tutti i Duellanti, ma `CloudSync.isAdmin()`
    // può ancora rispondere "no" al primo istante (il profilo arriva dal
    // database in modo asincrono). Si ridisegna una volta quando la
    // sessione è nota: per tutti gli altri è un secondo render identico
    // al primo, e costa un pugno di millisecondi.
    if (window.CloudSync && typeof CloudSync.waitForUser === 'function') {
        CloudSync.waitForUser().then(() => renderCubes()).catch(() => {});
    }
</script>
</body>
</html>
