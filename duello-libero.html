<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel Arena">
<script src="js/ui/error-recovery.js"></script>
<script src="js/pwa-register.js"></script>
<link rel="preload" href="audio/soundtracks/mainTheme.mp3" as="audio">
<link rel="stylesheet" href="js/ui/topbar.css">
<title>Yu-Gi-Oh! Duel Arena — Duello Libero</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Niente selezione di testo/pressione lunga sul contenuto del gioco (nomi
       carte, personaggi, pulsanti...): su mobile un tocco prolungato apriva
       il menu di sistema "Cerca su Google"/copia invece di far scattare
       l'interazione del gioco. input/textarea/select restano selezionabili
       normalmente, altrimenti non si potrebbe più scrivere nei campi. */
    html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/obelisco.jpg') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.45) 0%, rgba(6,7,12,0.55) 60%, rgba(4,5,8,0.65) 100%);
        pointer-events: none;
    }

    :root {
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --red: #e74c3c;
        --cube-w: 190px;
    }

    /* ============================================================
       Topbar: markup/CSS generati da js/ui/topbar.js + js/ui/topbar.css.
       ============================================================ */

    /* ============================================================
       Griglia dei "cubi" personaggio
       ============================================================ */
    .main {
        position: relative;
        z-index: 1;
        padding: 30px 22px 60px;
        max-width: 1400px;
        margin: 0 auto;
    }
    .intro-line {
        text-align: center;
        color: #9aa5bd;
        font-size: 0.88rem;
        margin-bottom: 26px;
        letter-spacing: 0.02em;
    }
    .cube-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--cube-w), 1fr));
        gap: 26px;
        justify-items: center;
        perspective: 900px;
    }
    .series-section { margin-bottom: 38px; }
    .series-section:last-child { margin-bottom: 0; }
    .series-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: var(--gold);
        margin-bottom: 16px;
    }
    .series-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, rgba(247,215,116,0.4), transparent);
    }
    .series-count {
        font-size: 0.72rem;
        font-weight: 700;
        color: #9aa5bd;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        padding: 2px 9px;
        border-radius: 999px;
        letter-spacing: normal;
    }

    .cube {
        width: var(--cube-w);
        cursor: pointer;
        border-radius: 14px;
        border: 2px solid rgba(247,215,116,0.35);
        background: linear-gradient(150deg, rgba(40,32,20,0.9), rgba(18,16,22,0.92));
        overflow: hidden;
        box-shadow: 0 10px 26px rgba(0,0,0,0.4);
        transition: transform 0.3s cubic-bezier(0.16,0.84,0.44,1), box-shadow 0.3s ease, border-color 0.3s ease;
        transform-style: preserve-3d;
    }
    .cube:hover {
        /* Rilievo invece di zoom: la carta si solleva (solo translateY,
           niente scale/rotate) e un'ombra "a gradino" sotto di lei
           suggerisce lo spessore, come un tasto premuto in fuori — più il
           tocco fisico di una carta reale che l'ingrandimento di
           un'anteprima. */
        transform: translateY(-6px);
        border-color: var(--gold-strong);
        box-shadow: 0 5px 0 rgba(0,0,0,0.4), 0 18px 34px rgba(0,0,0,0.5), 0 0 22px rgba(243,156,18,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .cube-portrait {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: linear-gradient(150deg, #3a2f22, #1c1620);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .cube-portrait img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .cube-portrait-fallback {
        font-size: 3.4rem;
        opacity: 0.55;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    }
    .cube-portrait::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 45%, rgba(10,8,6,0.88) 100%);
        pointer-events: none;
    }
    .cube-name {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 8px;
        font-weight: 900;
        font-size: 0.95rem;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0,0,0,0.7);
        z-index: 2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .cube-info {
        padding: 10px 12px 14px;
    }
    /* Una sola riga con ellissi (non più min-height a 2 righe): un
       sottotitolo che va a capo raddoppia l'altezza di testo sotto un
       ritratto già piccolo su mobile, e la card sembra "schiacciata"
       anche se l'immagine resta perfettamente quadrata — il problema
       era il testo, non la griglia. */
    .cube-title {
        font-size: 0.7rem;
        color: #9aa5bd;
        margin-bottom: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .cube-record {
        display: flex;
        gap: 8px;
        font-size: 0.72rem;
        font-weight: 800;
    }
    .cube-record .wins { color: #6fe08a; }
    .cube-record .losses { color: #ff8a7a; }
    .cube-record .sep { color: rgba(255,255,255,0.25); }

    /* ============================================================
       Modale selezione difficoltà
       ============================================================ */
    .diff-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.78);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
    }
    .diff-modal-backdrop.open { display: flex; }
    .diff-modal {
        width: min(94vw, 420px);
        background: linear-gradient(145deg, #1f2a44, #2a2032);
        border: 2px solid var(--gold-strong);
        border-radius: 20px;
        padding: 26px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .diff-modal-portrait {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        margin: 0 auto 14px;
        overflow: hidden;
        border: 2px solid rgba(247,215,116,0.5);
        background: linear-gradient(150deg, #3a2f22, #1c1620);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
    }
    .diff-modal-portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .diff-modal-name {
        font-size: 1.25rem;
        font-weight: 900;
        margin-bottom: 2px;
    }
    .diff-modal-title {
        font-size: 0.8rem;
        color: #9aa5bd;
        margin-bottom: 8px;
    }
    .diff-modal-record {
        font-size: 0.78rem;
        font-weight: 700;
        margin-bottom: 18px;
    }
    .diff-modal-record .wins { color: #6fe08a; }
    .diff-modal-record .losses { color: #ff8a7a; }
    .diff-modal-prompt {
        color: #dbe6ff;
        font-size: 0.9rem;
        margin-bottom: 16px;
    }
    .diff-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .diff-btn {
        border: none;
        border-radius: 12px;
        padding: 13px;
        font-weight: 800;
        font-size: 0.95rem;
        cursor: pointer;
        font-family: inherit;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .diff-btn:hover { transform: translateY(-2px); }
    /* Vetro scuro + bordo/bagliore luminoso (stessa lingua di .gate-btn in
       index.html) invece del pieno piatto — l'emoji 🟠/🔴 nell'etichetta
       porta già il codice colore "semaforo", il bordo lo rinforza senza
       bisogno di un riempimento piatto. */
    .diff-btn.medium {
        background: linear-gradient(145deg, #3a2c10, #201705);
        border: 1px solid rgba(243,156,18,0.6);
        box-shadow: 0 0 12px rgba(243,156,18,0.28), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .diff-btn.medium:hover { box-shadow: 0 0 20px rgba(243,156,18,0.5), inset 0 1px 0 rgba(255,255,255,0.1); }
    .diff-btn.hard {
        background: linear-gradient(145deg, #3a1410, #1f0906);
        border: 1px solid rgba(255,99,99,0.6);
        box-shadow: 0 0 12px rgba(255,99,99,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .diff-btn.hard:hover { box-shadow: 0 0 20px rgba(255,99,99,0.5), inset 0 1px 0 rgba(255,255,255,0.1); }
    .diff-cancel {
        margin-top: 14px;
        background: none;
        border: none;
        color: #9aa5bd;
        font-size: 0.82rem;
        cursor: pointer;
        font-family: inherit;
        text-decoration: underline;
    }
    .diff-cancel:hover { color: #fff; }

    /* Toast "in arrivo" */
    .toast {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translate(-50%, 16px);
        z-index: 250;
        padding: 12px 22px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(20,20,30,0.96), rgba(35,30,20,0.94));
        border: 1px solid rgba(247,215,116,0.45);
        box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        font-weight: 700;
        font-size: 0.9rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .custom-duel-options {
        background: rgba(0, 0, 0, 0.3);
        padding: 15px;
        border-radius: 10px;
        margin: 15px 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .opt-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }
    .opt-group label {
        font-size: 0.8rem;
        color: #f1c40f;
        margin-bottom: 4px;
        font-weight: bold;
    }
    .opt-group select {
        width: 100%;
        padding: 8px;
        background: #1a253d;
        border: 1px solid #f39c12;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }

    /* ============================================================
       Telefono — QUESTO blocco deve restare l'ULTIMA cosa nel foglio
       di stile: ogni regola qui sopra (.cube-grid, .cube-name,
       .diff-modal, .opt-group...) è definita PRIMA, quindi a parità di
       specificità vince chi arriva DOPO nel sorgente. Un blocco mobile
       messo in cima al file (come accadeva qui prima) viene sovrascritto
       in silenzio dalle regole base sottostanti — bug reale trovato in
       questa pagina: il --cube-w si applicava (il suo :root base era
       sopra), ma gap/padding/font restavano quelli desktop, e le card
       (già strette) sembravano "schiacciate" dal testo desktop-size che
       non ci stava. Occhio a non spezzare mai questo blocco in due.

       Due query separate: (max-width) per i telefoni in verticale,
       (max-height + orientation:landscape) per QUALUNQUE telefono
       ruotato in orizzontale — la larghezza da sola non lo cattura
       (un telefono orizzontale è spesso >480px di larghezza ma solo
       ~350-420px di altezza, quindi restava con le dimensioni desktop).
       ============================================================ */
    @media (max-width: 480px) {
        .main { padding: 14px 8px 40px; }
        .intro-line { font-size: 0.74rem; margin-bottom: 16px; }
        /* 2 per riga (non 3): auto-fill con --cube-w piccolo dava 3 colonne
           strette invece di 2 comode — grid-template-columns esplicito
           forza sempre 2 colonne indipendentemente da quanto ci
           starebbe in teoria, --cube-w sale di conseguenza per riempirle. */
        :root { --cube-w: 150px; }
        .cube-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .cube-name { font-size: 0.82rem; left: 8px; right: 8px; bottom: 7px; }
        .cube-info { padding: 8px 9px 10px; }
        .cube-title { font-size: 0.7rem; margin-bottom: 6px; }
        .cube-record { font-size: 0.72rem; gap: 6px; }
        .series-title { font-size: 0.82rem; margin-bottom: 10px; }
        .diff-modal-backdrop { padding: 10px; }
        .diff-modal { padding: 16px; max-height: 92vh; overflow-y: auto; }
        .diff-modal-portrait { width: 56px; height: 56px; font-size: 1.4rem; margin-bottom: 8px; }
        .diff-modal-name { font-size: 1.02rem; }
        .diff-modal-title { font-size: 0.7rem; margin-bottom: 4px; }
        .diff-modal-record { font-size: 0.68rem; margin-bottom: 10px; }
        .custom-duel-options { padding: 10px; margin: 10px 0; gap: 8px; }
        .opt-group label { font-size: 0.7rem; margin-bottom: 2px; }
        .opt-group select { padding: 6px; font-size: 0.8rem; }
        .diff-modal-prompt { font-size: 0.78rem; margin-bottom: 10px; }
        .diff-options { gap: 7px; }
        .diff-btn { padding: 10px; font-size: 0.82rem; }
        .diff-cancel { margin-top: 10px; font-size: 0.74rem; }
    }

    /* Telefono ruotato in orizzontale (poca altezza, larghezza spesso
       >480px quindi la query sopra non scatta): stessa idea, valori
       intermedi — meno colonne da comprimere ma una topbar/modale che
       devono restare bassi per non mangiare la poca altezza disponibile. */
    @media (max-height: 500px) and (orientation: landscape) {
        .main { padding: 10px 14px 20px; }
        .intro-line { font-size: 0.7rem; margin-bottom: 10px; }
        :root { --cube-w: 118px; }
        .cube-grid { gap: 10px; }
        .series-title { font-size: 0.82rem; margin-bottom: 8px; }
        .diff-modal-backdrop { padding: 6px; align-items: flex-start; }
        .diff-modal { padding: 10px 14px; max-height: 96vh; overflow-y: auto; margin-top: 2vh; }
        .diff-modal-portrait { width: 34px; height: 34px; font-size: 1rem; margin-bottom: 3px; }
        .diff-modal-name { font-size: 0.85rem; }
        .diff-modal-title { font-size: 0.62rem; margin-bottom: 2px; }
        .diff-modal-record { font-size: 0.6rem; margin-bottom: 4px; }
        .custom-duel-options { padding: 6px; margin: 6px 0; gap: 4px; }
        .opt-group label { font-size: 0.66rem; margin-bottom: 1px; }
        .opt-group select { padding: 4px; font-size: 0.72rem; }
        .diff-modal-prompt { font-size: 0.68rem; margin-bottom: 4px; }
        .diff-options { gap: 4px; }
        .diff-btn { padding: 6px; font-size: 0.72rem; }
        .diff-cancel { margin-top: 4px; font-size: 0.66rem; }
    }
</style>
</head>
<body>
    <div id="topbarMount"></div>

    <main class="main">
        <div id="cubeGrid"></div>
    </main>

    <div class="diff-modal-backdrop" id="diffModal">
        <div class="diff-modal">
            <div class="diff-modal-portrait" id="diffPortrait">🂠</div>
            <div class="diff-modal-name" id="diffName"></div>
            <div class="diff-modal-title" id="diffTitle"></div>
            <div class="diff-modal-record" id="diffRecord"></div>
            <div class="custom-duel-options">
                <div class="opt-group">
                    <label for="fieldSelect">🏟️ Campo:</label>
                    <select id="fieldSelect">
                        <option value="random">🎲 Casuale</option>
                        <option value="dirigibileKaiba.jpg">Dirigibile Kaiba</option>
                        <option value="kaibaStadium_1.jpg">Arena Kaiba</option>
                        <option value="rovine_1.jpg">Regno dei Duellanti</option>
                        <option value="anticoEgittoGiorno_1.jpg">Antico Egitto (giorno)</option>
                        <option value="anticoEgittoNotte_1.jpg">Antico Egitto (notte)</option>
                    </select>
                </div>
                <div class="opt-group">
                    <label for="musicSelect">🎵 Musica:</label>
                    <select id="musicSelect">
                        <option value="random">🎲 Casuale</option>
                        <option value="39. Free Duel.mp3">Free Duel</option>
                        <option value="42. Egyptian Duel (3D).mp3">Egyptian Duel</option>
                        <option value="31. Finals.mp3">Finals</option>
                        <option value="34. Mages Duel.mp3">Mages Duel</option>
                        <option value="35. High Mages.mp3">High Duel</option>
                        <option value="37. Seto.mp3">High Duel</option>
                        <option value="43. Darknite-Nitemare (3D).mp3">Darknite-Nitemare Duel</option>
                        <option value="32. Seto Kaiba (Tournament Final) HD.mp3">Seto Kaiba (Tournament Final)</option>
                        <option value="mainTheme.mp3">Yu gi oh: Battle for the millennium</option>
                    </select>
                </div>
            </div>
            <p class="diff-modal-prompt">Scegli la difficoltà del duello:</p>
            <div class="diff-options">
                <button type="button" class="diff-btn medium" data-difficulty="Medio">🟠 Medio</button>
                <button type="button" class="diff-btn hard" data-difficulty="Difficile">🔴 Difficile</button>
            </div>
            <button type="button" class="diff-cancel" id="diffCancelBtn">Annulla</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

<script src="js/audio/audio-manager.js"></script>
<script src="js/native/app-back-button.js"></script>
<script src="js/native/haptics.js"></script>
<script src="js/native/native-save-backup.js"></script>
<script src="js/save-manager.js"></script>
<script src="js/data/characters-db.js"></script>
<script src="js/ui/icon-library.js"></script>
<script src="js/ui/topbar.js"></script>
<script>
    // Nessun onBack: il genitore logico di questa pagina è sempre il menu
    // principale, che è già il backHref di default di PageTopbar.render
    // ('index.html') — anche quando si torna qui da un duello appena
    // concluso (js/duel-session.js#goBack), che non ha più bisogno di
    // alcun flag per "aggirare" il pulsante Indietro (vedi la sua stessa
    // funzione goBack: non imposta più ygoSkipReferrerBack).
    PageTopbar.render('#topbarMount', { icon: 'freeDuel', title: 'Duello Libero', subtitle: 'Scegli un duellante da sfidare' });

    initAudioManager();
    Icons.hydrate();

    let toastTimeout = null;
    function showToast(text) {
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function createCube(character) {
        const record = getCharacterRecord(character.id);
        const cube = document.createElement('div');
        cube.className = 'cube';
        cube.innerHTML = `
            <div class="cube-portrait">
                <span class="cube-portrait-fallback">🧑‍🎤</span>
                <div class="cube-name">${character.name}</div>
            </div>
            <div class="cube-info">
                <div class="cube-title">${character.title || ''}</div>
                <div class="cube-record">
                    <span class="wins">${record.wins}V</span>
                    <span class="sep">•</span>
                    <span class="losses">${record.losses}S</span>
                </div>
            </div>
        `;

        const img = document.createElement('img');
        img.alt = character.name;
        img.loading = 'lazy';
        img.onload = () => {
            const fallback = cube.querySelector('.cube-portrait-fallback');
            if (fallback) fallback.remove();
        };
        img.onerror = () => img.remove();
        img.src = character.image;
        cube.querySelector('.cube-portrait').insertBefore(img, cube.querySelector('.cube-name'));

        cube.onclick = () => openDifficultyModal(character);
        return cube;
    }

    // Ordine e nome leggibile di ogni "series" (vedi il campo series di
    // ogni personaggio in js/characters-db.js). Un id non presente qui
    // finirebbe comunque in fondo con il proprio nome grezzo come titolo,
    // invece di sparire — così una futura series dimenticata qui resta
    // visibile invece di scomparire silenziosamente dalla lista.
    const SERIES_ORDER = ['main', 'forbiddenMemories', 'extra', 'special'];
    const SERIES_LABELS = {
        main: 'Serie Principale',
        forbiddenMemories: 'Forbidden Memories',
        extra: 'Extra',
        special: 'Speciali'
    };

    function renderCubes() {
        const container = document.getElementById('cubeGrid');
        container.innerHTML = '';

        const bySeries = new Map();
        characterDatabase.forEach((character) => {
            const key = character.series || 'main';
            if (!bySeries.has(key)) bySeries.set(key, []);
            bySeries.get(key).push(character);
        });

        // SERIES_ORDER prima, poi qualunque series imprevista rimasta
        // (mai perdere silenziosamente un personaggio da un id dimenticato).
        const orderedKeys = [...SERIES_ORDER, ...[...bySeries.keys()].filter(k => !SERIES_ORDER.includes(k))];

        orderedKeys.forEach((key) => {
            const characters = bySeries.get(key);
            if (!characters || characters.length === 0) return;

            const section = document.createElement('div');
            section.className = 'series-section';

            const title = document.createElement('div');
            title.className = 'series-title';
            title.innerHTML = `<span>${SERIES_LABELS[key] || key}</span><span class="series-count">${characters.length}</span>`;
            section.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'cube-grid';
            characters.forEach((character) => grid.appendChild(createCube(character)));
            section.appendChild(grid);

            container.appendChild(section);
        });
    }

    function openDifficultyModal(character) {
        const modal = document.getElementById('diffModal');
        const record = getCharacterRecord(character.id);

        document.getElementById('diffName').textContent = character.name;
        document.getElementById('diffTitle').textContent = character.title || '';
        document.getElementById('diffRecord').innerHTML =
            `<span class="wins">${record.wins} Vittorie</span> &nbsp;·&nbsp; <span class="losses">${record.losses} Sconfitte</span>`;

        const portraitEl = document.getElementById('diffPortrait');
        portraitEl.innerHTML = '🂠';
        const img = document.createElement('img');
        img.alt = character.name;
        img.onerror = () => { portraitEl.innerHTML = '🂠'; };
        img.onload = () => { portraitEl.innerHTML = ''; portraitEl.appendChild(img); };
        img.src = character.image;

        modal.dataset.characterId = character.id;
        modal.dataset.characterName = character.name;
        modal.classList.add('open');
    }

    function closeDifficultyModal() {
        document.getElementById('diffModal').classList.remove('open');
    }

    document.getElementById('diffCancelBtn').onclick = closeDifficultyModal;
    document.getElementById('diffModal').addEventListener('click', (event) => {
        if (event.target.id === 'diffModal') closeDifficultyModal();
    });

    // Il duello vero si combatte in duelMonstersCore.html, che è l'arena unica
    // di tutte le modalità: le passiamo nell'URL chi è l'avversario e con
    // quale difficoltà, e ci penserà js/duel-session.js a leggerli.
    // A fine duello il pulsante "Continua" riporta proprio qui.
    document.querySelectorAll('.diff-btn').forEach((btn) => {
        btn.onclick = () => {
            const modal = document.getElementById('diffModal');
            const characterId = modal.dataset.characterId;
            const name = modal.dataset.characterName;
            const difficulty = btn.dataset.difficulty;

              const getRandomOption = (selectId) => {
                const select = document.getElementById(selectId);
                // Trasformiamo le opzioni in array, filtrando via quella "random"
                const validOptions = Array.from(select.options).filter(opt => opt.value !== 'random');
                const randomIndex = Math.floor(Math.random() * validOptions.length);
                return validOptions[randomIndex].value;
            };

            let selectedField = document.getElementById('fieldSelect').value;
            let selectedMusic = document.getElementById('musicSelect').value;

            // Se è stato scelto casuale, estraiamo un valore vero
            if (selectedField === 'random') {
                selectedField = getRandomOption('fieldSelect');
            }
            if (selectedMusic === 'random') {
                selectedMusic = getRandomOption('musicSelect');
            }
            // ------------------------------------------------

            closeDifficultyModal();
            showToast(`⚔️ Duello contro ${name} (${difficulty})...`);

            // ADD parametri &field e &music all'URL
            const url = 'duelMonstersCore.html?mode=free'
                + '&character=' + encodeURIComponent(characterId)
                + '&difficulty=' + encodeURIComponent(difficulty)
                + '&field=' + encodeURIComponent(selectedField)   // <--- AGGIUNTO
                + '&music=' + encodeURIComponent(selectedMusic);  // <--- AGGIUNTO

            setTimeout(() => { window.location.href = url; }, 450);
        };
    });

    renderCubes();
</script>
</body>
</html>
