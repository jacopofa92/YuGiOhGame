<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel Arena">
<script src="js/pwa-register.js"></script>
<link rel="preload" href="audio/soundtracks/mainTheme.mp3" as="audio">
<title>Yu-Gi-Oh! Duel Arena — Cartoteca</title>
<link rel="stylesheet" href="js/ui/card.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Niente selezione di testo/pressione lunga sul contenuto del gioco (nomi
       carte, personaggi, pulsanti...): su mobile un tocco prolungato apriva
       il menu di sistema "Cerca su Google"/copia invece di far scattare
       l'interazione del gioco. input/textarea/select restano selezionabili
       normalmente, altrimenti non si potrebbe più scrivere nei campi. */
    html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    html, body { height: 100%; }
    body {
        font-family: 'Arial', sans-serif;
        color: #fff;
        background: #0b0d14 url('images/background/backgroundMenu.png') center/cover fixed no-repeat;
        min-height: 100vh;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(6,7,12,0.45) 0%, rgba(6,7,12,0.55) 60%, rgba(4,5,8,0.65) 100%);
        pointer-events: none;
    }

    :root {
        --card-w: 168px;
        --card-h: calc(var(--card-w) / 0.685);
        --gold: #f7d774;
        --gold-strong: #f39c12;
        --blue: #3498db;
        --red: #e74c3c;
    }

    /* ============================================================
       Topbar
       ============================================================ */
    .cartoteca-topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 22px;
        background: linear-gradient(135deg, rgba(15,15,22,0.92), rgba(28,24,16,0.9));
        border-bottom: 2px solid rgba(247,215,116,0.35);
        box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .back-btn {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(20,20,30,0.85), rgba(35,30,20,0.75));
        border: 1px solid rgba(247,215,116,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold);
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: 900;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .back-btn:hover { transform: scale(1.08); box-shadow: 0 8px 20px rgba(243,156,18,0.4); }
    .cartoteca-title {
        font-size: clamp(1.2rem, 2.4vw, 1.7rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        background: linear-gradient(180deg, #fff6dc 0%, #f7d774 40%, #f39c12 75%, #c9770a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 20px rgba(243,156,18,0.35);
    }
    .cartoteca-count {
        margin-left: auto;
        font-size: 0.85rem;
        font-weight: 700;
        color: #cdd6ea;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        padding: 6px 14px;
        border-radius: 999px;
        white-space: nowrap;
    }
    .cartoteca-legend {
        text-align: center;
        font-size: 0.72rem;
        color: #8b96b3;
        padding: 4px 16px 0;
    }

    /* ============================================================
       Filtri
       ============================================================ */
    .cartoteca-filters {
        position: sticky;
        top: 69px;
        z-index: 25;
        background: linear-gradient(180deg, rgba(14,14,20,0.96), rgba(14,14,20,0.9));
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 14px 22px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
    /* Barra sempre visibile: ricerca + ordinamento + interruttore filtri.
       I filtri veri e propri (chip di tipo/livello/razza/...) stanno nel
       pannello sotto, chiuso di default — prima erano SEMPRE aperti e
       occupavano una fetta enorme di schermo ad ogni apertura pagina. */
    .filter-bar-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
    }
    .filter-sort {
        flex-shrink: 0;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.06);
        color: #dfe7f7;
        font-family: inherit;
        font-size: 0.83rem;
        outline: none;
        cursor: pointer;
    }
    .filter-sort:focus { border-color: var(--gold-strong); }
    .filter-toggle-btn {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.06);
        color: #dfe7f7;
        font-family: inherit;
        font-size: 0.83rem;
        font-weight: 700;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
    }
    .filter-toggle-btn:hover { border-color: rgba(247,215,116,0.5); }
    .filter-toggle-btn.has-active {
        border-color: var(--gold-strong);
        background: rgba(243,156,18,0.15);
    }
    .filter-toggle-badge {
        display: none;
        background: var(--gold-strong);
        color: #1a1408;
        font-size: 0.68rem;
        font-weight: 800;
        padding: 1px 7px;
        border-radius: 999px;
    }
    .filter-toggle-badge.show { display: inline-block; }
    .filter-toggle-arrow { font-size: 0.65rem; opacity: 0.7; transition: transform 0.25s ease; }
    .filter-toggle-btn.open .filter-toggle-arrow { transform: rotate(180deg); }

    /* Pannello filtri: chiuso di default (max-height:0), si apre solo su
       richiesta. max-height (non height:auto) perché è l'unico modo per
       animare in CSS puro un contenuto di altezza non nota a priori. */
    .filter-panel {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height 0.3s cubic-bezier(0.16,0.84,0.44,1), opacity 0.25s ease, margin-top 0.3s ease;
    }
    .filter-panel.open {
        max-height: 1000px;
        opacity: 1;
        margin-top: 14px;
    }
    .filter-search {
        position: relative;
        flex: 1 1 240px;
        max-width: 480px;
    }
    .filter-search input {
        width: 100%;
        padding: 11px 16px 11px 40px;
        border-radius: 999px;
        border: 1px solid rgba(247,215,116,0.35);
        background: rgba(255,255,255,0.06);
        color: #fff;
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .filter-search input::placeholder { color: rgba(255,255,255,0.45); }
    .filter-search input:focus {
        border-color: var(--gold-strong);
        box-shadow: 0 0 0 3px rgba(243,156,18,0.18);
    }
    .filter-search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.6;
        pointer-events: none;
    }

    .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: flex-start;
    }
    .filter-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .filter-group-label {
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9aa5bd;
        font-weight: 700;
    }
    .filter-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 480px;
    }
    .chip {
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.06);
        color: #dfe7f7;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
        white-space: nowrap;
    }
    .chip:hover { transform: translateY(-1px); border-color: rgba(247,215,116,0.5); }
    .chip.active {
        background: linear-gradient(135deg, rgba(243,156,18,0.9), rgba(192,57,43,0.6));
        border-color: var(--gold-strong);
        color: #1a1408;
        box-shadow: 0 0 14px rgba(243,156,18,0.4);
    }
    .chip.attr-luce.active { background: linear-gradient(135deg, #fff6dc, #f7d774); color: #4a3a0a; }
    .chip.attr-oscurità.active { background: linear-gradient(135deg, #6c4a9c, #3d2560); color: #f0e6ff; }
    .chip.attr-terra.active { background: linear-gradient(135deg, #a97b3e, #6b4a1f); color: #fff3df; }
    .chip.attr-vento.active { background: linear-gradient(135deg, #52c9a4, #1f8f72); color: #06251c; }
    .chip.attr-acqua.active { background: linear-gradient(135deg, #4fa8e0, #1b6fb8); color: #06202f; }
    .chip.attr-fuoco.active { background: linear-gradient(135deg, #f0793c, #c0392b); color: #2c0800; }
    .chip.attr-divino.active { background: linear-gradient(135deg, #fff6c8, #f7d774, #f39c12); color: #402b00; }

    .filter-range {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .filter-range input {
        width: 74px;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.06);
        color: #fff;
        font-family: inherit;
        font-size: 0.85rem;
        outline: none;
    }
    .filter-range input:focus { border-color: var(--gold-strong); }
    .filter-range span { color: #9aa5bd; font-size: 0.8rem; }

    .filter-reset {
        align-self: flex-start;
        margin-left: auto;
        border: 1px solid rgba(231,76,60,0.4);
        background: rgba(231,76,60,0.12);
        color: #ffb3ab;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        white-space: nowrap;
    }
    .filter-reset:hover { transform: translateY(-1px); box-shadow: 0 0 14px rgba(231,76,60,0.3); }

    /* ============================================================
       Griglia carte
       ============================================================ */
    .cartoteca-main {
        position: relative;
        z-index: 1;
        padding: 26px 22px 60px;
        max-width: 1500px;
        margin: 0 auto;
    }
    .cartoteca-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
        gap: 22px;
        justify-items: center;
    }
    /* js/card.css mette touch-action:none su .card per il trascinamento
       nel duello (duelMonstersCore.html) — qui le carte non si trascinano mai,
       e quella regola bloccava anche lo scroll verticale col dito quando
       il tocco iniziava sopra una carta. */
    .cartoteca-grid .card,
    .card-modal-preview .card {
        touch-action: pan-y;
    }
    .cartoteca-empty {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        color: #9aa5bd;
        font-size: 1.05rem;
    }

    /* L'aspetto della carta (.card/.card-frame/...) vive in js/card.css,
       condiviso da tutte le pagine — qui restano solo dimensione/hover
       specifici di questa griglia. */
    .card:hover { transform: translateY(-8px) scale(1.045); box-shadow: 0 16px 34px rgba(0,0,0,0.4); }

    /* ============================================================
       Modale dettaglio carta
       ============================================================ */
    .card-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.78);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
    }
    .card-modal-backdrop.open { display: flex; }
    .card-modal {
        background: linear-gradient(145deg, #1f2a44, #2a2032);
        border: 2px solid var(--gold-strong);
        border-radius: 20px;
        width: min(94vw, 720px);
        max-height: 92vh;
        overflow-y: auto;
        padding: clamp(18px, 3vw, 32px);
        box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        display: flex;
        gap: clamp(16px, 3vw, 30px);
        flex-wrap: wrap;
        justify-content: center;
    }
    .card-modal-preview { flex: 0 0 auto; margin: 0 auto; }
    .card-modal-preview .card { width: min(46vh, clamp(180px, 26vw, 280px)); height: calc(min(46vh, clamp(180px, 26vw, 280px)) / 0.685); cursor: default; }
    .card-modal-preview .card:hover { transform: none; }
    .card-modal-info { flex: 1 1 260px; min-width: 220px; }
    .card-modal-name { font-size: 1.4rem; font-weight: 900; color: #fff; margin-bottom: 6px; }
    .card-modal-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
    }
    .card-modal-tag {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.1);
        color: #dfe7f7;
        border: 1px solid rgba(255,255,255,0.14);
    }
    .card-modal-stats { display: flex; gap: 16px; margin-bottom: 14px; }
    .card-modal-stat { font-size: 0.95rem; font-weight: 800; }
    .card-modal-stat.atk { color: #ff8a7a; }
    .card-modal-stat.def { color: #7dd3fc; }
    .card-modal-effect { color: #dbe6ff; line-height: 1.5; font-size: 0.92rem; }
    .card-modal-close {
        position: absolute;
        top: 14px;
        right: 16px;
        background: none;
        border: none;
        color: #cdd6ea;
        font-size: 1.4rem;
        cursor: pointer;
        line-height: 1;
    }
    .card-modal-close:hover { color: #fff; }
    .card-modal { position: relative; }

    /* ============================================================
       Telefono: la topbar/filtri restavano dimensionati per desktop
       (padding 14px 22px, icona 40px, carte minime 168px) — su uno
       schermo stretto (~360px) questo lascia spazio per UNA sola carta
       gigante per riga invece di una griglia vera. Qui si restringe
       tutto e si aggiorna di conseguenza l'offset "top" della barra
       filtri (che deve restare appena sotto la topbar, mai sovrapposta
       né staccata).
       ============================================================ */
    @media (max-width: 480px) {
        .cartoteca-topbar { padding: 8px 10px; gap: 8px; }
        .back-btn { width: 28px; height: 28px; font-size: 0.8rem; }
        .cartoteca-title { font-size: 0.88rem; letter-spacing: 0.04em; }
        .cartoteca-count { font-size: 0.62rem; padding: 3px 8px; }
        .cartoteca-filters { top: 45px; padding: 8px 10px; }
        .filter-sort, .filter-toggle-btn { padding: 7px 10px; font-size: 0.72rem; }
        .filter-search input { padding: 8px 12px 8px 34px; font-size: 0.82rem; }
        .cartoteca-main { padding: 12px 8px 40px; }
        :root { --card-w: 82px; }
        .cartoteca-grid { gap: 8px; }
    }

    /* Telefono ruotato in orizzontale: poca altezza (spesso <500px) ma
       larghezza sopra i 480px, quindi la query sopra non scatta e senza
       questa la pagina resta dimensionata per desktop — topbar/filtri
       enormi rispetto alla poca altezza disponibile. */
    @media (max-height: 500px) and (orientation: landscape) {
        .cartoteca-topbar { padding: 6px 14px; gap: 8px; }
        .back-btn { width: 26px; height: 26px; font-size: 0.75rem; }
        .cartoteca-title { font-size: 0.85rem; }
        .cartoteca-count { font-size: 0.65rem; padding: 3px 9px; }
        .cartoteca-filters { top: 41px; padding: 6px 14px; }
        .filter-bar-top { gap: 6px; }
        .filter-sort, .filter-toggle-btn { padding: 5px 10px; font-size: 0.7rem; }
        .filter-search input { padding: 6px 12px 6px 32px; font-size: 0.78rem; }
        .cartoteca-main { padding: 8px 14px 30px; }
        :root { --card-w: 96px; }
        .cartoteca-grid { gap: 8px; }
    }
</style>
</head>
<body>
    <div class="cartoteca-topbar">
        <a href="index.html" class="back-btn" title="Indietro" onclick="if (document.referrer) { location.href = document.referrer; return false; }">‹</a>
        <div class="cartoteca-title"><span data-icon="collection"></span> Cartoteca</div>
        <div class="cartoteca-count" id="resultCount">40 carte</div>
    </div>
    <div class="cartoteca-legend">⛔ effetto non implementato &nbsp;·&nbsp; 🟡 effetto implementato parzialmente</div>

    <div class="cartoteca-filters">
        <div class="filter-bar-top">
            <div class="filter-search">
                <span class="filter-search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Cerca una carta per nome..." autocomplete="off">
            </div>
            <select class="filter-sort" id="sortSelect">
                <option value="default">Ordina per…</option>
                <option value="name-asc">Nome (A→Z)</option>
                <option value="name-desc">Nome (Z→A)</option>
                <option value="atk-desc">ATK (alto→basso)</option>
                <option value="atk-asc">ATK (basso→alto)</option>
                <option value="def-desc">DEF (alto→basso)</option>
                <option value="def-asc">DEF (basso→alto)</option>
                <option value="level-desc">Livello (alto→basso)</option>
                <option value="level-asc">Livello (basso→alto)</option>
            </select>
            <button type="button" class="filter-toggle-btn" id="filterToggleBtn">
                <span>🔧 Filtri</span>
                <span class="filter-toggle-badge" id="filterToggleBadge"></span>
                <span class="filter-toggle-arrow">▾</span>
            </button>
        </div>

        <div class="filter-panel" id="filterPanel">
            <div class="filter-row">
                <div class="filter-group">
                    <span class="filter-group-label">Tipo Carta</span>
                    <div class="filter-chips" id="typeChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Livello</span>
                    <div class="filter-chips" id="levelChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Categoria Mostro</span>
                    <div class="filter-chips" id="categoryChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Tipo Mostro</span>
                    <div class="filter-chips" id="raceChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Attributo</span>
                    <div class="filter-chips" id="attributeChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Sottotipo Magia</span>
                    <div class="filter-chips" id="spellSubtypeChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Sottotipo Trappola</span>
                    <div class="filter-chips" id="trapSubtypeChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">Provenienza</span>
                    <div class="filter-chips" id="originChips"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">ATK</span>
                    <div class="filter-range">
                        <input type="number" id="atkMin" placeholder="Min" min="0">
                        <span>—</span>
                        <input type="number" id="atkMax" placeholder="Max" min="0">
                    </div>
                </div>
                <div class="filter-group">
                    <span class="filter-group-label">DEF</span>
                    <div class="filter-range">
                        <input type="number" id="defMin" placeholder="Min" min="0">
                        <span>—</span>
                        <input type="number" id="defMax" placeholder="Max" min="0">
                    </div>
                </div>
                <button class="filter-reset" id="resetBtn">✖ Azzera filtri</button>
            </div>
        </div>
    </div>

    <main class="cartoteca-main">
        <div class="cartoteca-grid" id="cartotecaGrid"></div>
    </main>

    <div class="card-modal-backdrop" id="cardModal">
        <div class="card-modal">
            <button class="card-modal-close" id="cardModalClose">✕</button>
            <div class="card-modal-preview" id="cardModalPreview"></div>
            <div class="card-modal-info" id="cardModalInfo"></div>
        </div>
    </div>

<script src="js/audio/audio-manager.js"></script>
<!-- Anagrafica carte generata da data/cards.json (vedi scripts/build-cards-data.js):
     va caricata PRIMA di cards-db.js, che ora contiene solo le funzioni di supporto. -->
<script src="js/data/cards-data.generated.js"></script>
<script src="js/data/cards-db.js"></script>
<script src="js/data/custom-cards.js"></script>
<script src="js/engine/duel-engine.js"></script>
<script src="js/engine/effect-templates.js"></script>
<script src="js/engine/card-effects.js"></script>
<script src="js/ui/card-renderer.js"></script>
<script src="js/ui/icon-library.js"></script>
<script>
    initAudioManager();
    Icons.hydrate();

    const state = {
        text: '',
        types: new Set(),
        levels: new Set(),
        categories: new Set(),
        races: new Set(),
        attributes: new Set(),
        spellSubtypes: new Set(),
        trapSubtypes: new Set(),
        origins: new Set(),
        atkMin: null,
        atkMax: null,
        defMin: null,
        defMax: null,
        sort: 'default'
    };

    const TYPE_LABELS = { monster: 'Mostro', spell: 'Magia', trap: 'Trappola' };
    const TYPE_ICON = { monster: '👑', spell: '✨', trap: '🌀' };

    function normalize(str) {
        return (str || '').toString().toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function uniqueSorted(arr) {
        return [...new Set(arr)].sort((a, b) => a - b);
    }

    function buildChipGroup(container, values, formatLabel, stateSet, extraClassFn) {
        container.innerHTML = '';
        values.forEach((val) => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip' + (extraClassFn ? ' ' + extraClassFn(val) : '');
            chip.textContent = formatLabel(val);
            chip.dataset.value = val;
            chip.onclick = () => {
                if (stateSet.has(val)) {
                    stateSet.delete(val);
                    chip.classList.remove('active');
                } else {
                    stateSet.add(val);
                    chip.classList.add('active');
                }
                renderGrid();
            };
            container.appendChild(chip);
        });
    }

    function initFilters() {
        // Tipo carta
        buildChipGroup(
            document.getElementById('typeChips'),
            ['monster', 'spell', 'trap'],
            (v) => TYPE_ICON[v] + ' ' + TYPE_LABELS[v],
            state.types
        );

        // Livello (solo mostri)
        const levels = uniqueSorted(cardDatabase.filter(c => c.type === 'monster').map(c => c.level));
        buildChipGroup(
            document.getElementById('levelChips'),
            levels,
            (v) => `⭐ ${v}`,
            state.levels
        );

        // Categoria mostro (normale / con effetto / fusione / rituale)
        buildChipGroup(
            document.getElementById('categoryChips'),
            ['normal', 'effect', 'fusion', 'ritual'],
            (v) => MONSTER_CATEGORY_LABELS[v],
            state.categories
        );

        // Tipo mostro (razza) — elenco FISSO (MONSTER_RACES, in cards-db.js),
        // non derivato dalle sole carte presenti: mostra sempre tutti i tipi
        // ufficiali del gioco, anche quelli senza ancora nessuna carta qui.
        buildChipGroup(
            document.getElementById('raceChips'),
            MONSTER_RACES,
            (v) => v,
            state.races
        );

        // Attributo
        const attributes = [...new Set(cardDatabase.filter(c => c.attribute).map(c => c.attribute))];
        const attrOrder = ['LUCE', 'OSCURITÀ', 'TERRA', 'ACQUA', 'FUOCO', 'VENTO', 'DIVINO'];
        attributes.sort((a, b) => attrOrder.indexOf(a) - attrOrder.indexOf(b));
        buildChipGroup(
            document.getElementById('attributeChips'),
            attributes,
            (v) => v,
            state.attributes,
            (v) => 'attr-' + normalize(v)
        );

        // Sottotipo Magia (Normale/Continua/Veloce/Rituale/Campo/Equip) — elenco
        // fisso da SPELL_SUBTYPE_LABELS, stesso spirito di MONSTER_RACES sopra.
        buildChipGroup(
            document.getElementById('spellSubtypeChips'),
            Object.keys(SPELL_SUBTYPE_LABELS),
            (v) => SPELL_SUBTYPE_LABELS[v],
            state.spellSubtypes
        );

        // Sottotipo Trappola (Normale/Continua/Contatore)
        buildChipGroup(
            document.getElementById('trapSubtypeChips'),
            Object.keys(TRAP_SUBTYPE_LABELS),
            (v) => TRAP_SUBTYPE_LABELS[v],
            state.trapSubtypes
        );

        // Provenienza — elenco FISSO da CARD_ORIGIN_LABELS (in cards-db.js),
        // stesso spirito di MONSTER_RACES: mostra sempre Yu-Gi-Oh!/Fanmade/
        // WW1/WW2 come opzioni, anche per le provenienze senza ancora
        // nessuna carta qui dentro.
        buildChipGroup(
            document.getElementById('originChips'),
            Object.keys(CARD_ORIGIN_LABELS),
            (v) => CARD_ORIGIN_LABELS[v] || v,
            state.origins
        );

        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.text = normalize(e.target.value);
            renderGrid();
        });
        ['atkMin', 'atkMax', 'defMin', 'defMax'].forEach((id) => {
            document.getElementById(id).addEventListener('input', (e) => {
                const val = e.target.value === '' ? null : Number(e.target.value);
                state[id] = val;
                renderGrid();
            });
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            state.sort = e.target.value;
            renderGrid();
        });

        // Pannello filtri: chiuso di default ("meno invasivo" di prima, quando
        // erano sempre tutti aperti) — un tocco/click sul pulsante lo apre o
        // chiude, con un badge che segna quanti filtri sono già attivi anche
        // a pannello chiuso.
        const filterToggleBtn = document.getElementById('filterToggleBtn');
        const filterPanel = document.getElementById('filterPanel');
        filterToggleBtn.onclick = () => {
            const isOpen = filterPanel.classList.toggle('open');
            filterToggleBtn.classList.toggle('open', isOpen);
        };

        document.getElementById('resetBtn').onclick = () => {
            state.text = '';
            state.types.clear();
            state.levels.clear();
            state.categories.clear();
            state.races.clear();
            state.attributes.clear();
            state.spellSubtypes.clear();
            state.trapSubtypes.clear();
            state.origins.clear();
            state.atkMin = null;
            state.atkMax = null;
            state.defMin = null;
            state.defMax = null;
            document.getElementById('searchInput').value = '';
            ['atkMin', 'atkMax', 'defMin', 'defMax'].forEach(id => document.getElementById(id).value = '');
            document.querySelectorAll('.chip.active').forEach(c => c.classList.remove('active'));
            renderGrid();
        };
    }

    function cardMatchesFilters(card) {
        if (state.text) {
            const haystack = normalize(card.name) + ' ' + normalize(card.effect || '');
            if (!haystack.includes(state.text)) return false;
        }
        if (state.types.size > 0 && !state.types.has(card.type)) return false;
        if (state.levels.size > 0 && !(card.type === 'monster' && state.levels.has(card.level))) return false;
        if (state.categories.size > 0 && !(card.type === 'monster' && state.categories.has(getMonsterFilterCategory(card)))) return false;
        if (state.races.size > 0 && !(card.race && state.races.has(card.race))) return false;
        if (state.attributes.size > 0 && !(card.attribute && state.attributes.has(card.attribute))) return false;
        if (state.spellSubtypes.size > 0 && !(card.type === 'spell' && state.spellSubtypes.has(card.subtype))) return false;
        if (state.trapSubtypes.size > 0 && !(card.type === 'trap' && state.trapSubtypes.has(card.subtype))) return false;
        if (state.origins.size > 0 && !(card.origin && state.origins.has(card.origin))) return false;
        if (state.atkMin !== null && !(card.type === 'monster' && card.attack >= state.atkMin)) return false;
        if (state.atkMax !== null && !(card.type === 'monster' && card.attack <= state.atkMax)) return false;
        if (state.defMin !== null && !(card.type === 'monster' && card.defense >= state.defMin)) return false;
        if (state.defMax !== null && !(card.type === 'monster' && card.defense <= state.defMax)) return false;
        return true;
    }

    const nameCollator = new Intl.Collator('it');
    /** Ordina una lista di carte già filtrata secondo state.sort, senza toccare l'originale. */
    function sortCards(cards, sortKey) {
        if (!sortKey || sortKey === 'default') return cards;
        const sorted = [...cards];
        const byName = (a, b) => nameCollator.compare(a.name, b.name);
        const numKey = (card, field) => (typeof card[field] === 'number' ? card[field] : -1);
        const cmp = {
            'name-asc': byName,
            'name-desc': (a, b) => byName(b, a),
            'atk-desc': (a, b) => numKey(b, 'attack') - numKey(a, 'attack') || byName(a, b),
            'atk-asc': (a, b) => numKey(a, 'attack') - numKey(b, 'attack') || byName(a, b),
            'def-desc': (a, b) => numKey(b, 'defense') - numKey(a, 'defense') || byName(a, b),
            'def-asc': (a, b) => numKey(a, 'defense') - numKey(b, 'defense') || byName(a, b),
            'level-desc': (a, b) => numKey(b, 'level') - numKey(a, 'level') || byName(a, b),
            'level-asc': (a, b) => numKey(a, 'level') - numKey(b, 'level') || byName(a, b)
        }[sortKey];
        if (cmp) sorted.sort(cmp);
        return sorted;
    }

    /** Numero di filtri attivi in questo momento, per il badge sul pulsante "Filtri". */
    function countActiveFilters() {
        return state.types.size + state.levels.size + state.categories.size + state.races.size +
            state.attributes.size + state.spellSubtypes.size + state.trapSubtypes.size + state.origins.size +
            (state.atkMin !== null ? 1 : 0) + (state.atkMax !== null ? 1 : 0) +
            (state.defMin !== null ? 1 : 0) + (state.defMax !== null ? 1 : 0);
    }

    function updateFilterToggleBadge() {
        const count = countActiveFilters();
        const badge = document.getElementById('filterToggleBadge');
        const btn = document.getElementById('filterToggleBtn');
        badge.textContent = count;
        badge.classList.toggle('show', count > 0);
        btn.classList.toggle('has-active', count > 0);
    }

    function createCardTile(card) {
        const el = createCardElement(card);
        el.onclick = () => openCardModal(card);
        return el;
    }

    function renderGrid() {
        const grid = document.getElementById('cartotecaGrid');
        const results = sortCards(cardDatabase.filter(cardMatchesFilters), state.sort);
        updateFilterToggleBadge();
        grid.innerHTML = '';
        if (results.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'cartoteca-empty';
            empty.textContent = '🔍 Nessuna carta corrisponde ai filtri selezionati.';
            grid.appendChild(empty);
        } else {
            results.forEach(card => grid.appendChild(createCardTile(card)));
        }
        document.getElementById('resultCount').textContent = `${results.length} cart${results.length === 1 ? 'a' : 'e'}`;
    }

    function openCardModal(card) {
        const modal = document.getElementById('cardModal');
        const preview = document.getElementById('cardModalPreview');
        const info = document.getElementById('cardModalInfo');

        preview.innerHTML = '';
        preview.appendChild(createCardTile(card));
        preview.querySelector('.card').onclick = null;

        const typeLabel = TYPE_LABELS[card.type];
        const tags = [`${TYPE_ICON[card.type]} ${typeLabel}`];
        if (card.race) tags.push(card.race);
        if (card.attribute) tags.push(card.attribute);
        if (card.type === 'monster' && card.level) tags.push(`⭐ Livello ${card.level}`);

        const tributes = (typeof getTributesRequired === 'function') ? getTributesRequired(card) : 0;
        if (tributes > 0) tags.push(`Richiede ${tributes} Tribut${tributes > 1 ? 'i' : 'o'}`);

        info.innerHTML = `
            <div class="card-modal-name">${card.name}</div>
            <div class="card-modal-meta">${tags.map(t => `<span class="card-modal-tag">${t}</span>`).join('')}</div>
            ${card.type === 'monster' ? `
                <div class="card-modal-stats">
                    <span class="card-modal-stat atk">ATK ${card.attack}</span>
                    <span class="card-modal-stat def">DEF ${card.defense}</span>
                </div>
            ` : ''}
            <p class="card-modal-effect">${card.effect || (card.type === 'monster' ? 'Mostro normale senza effetto speciale.' : 'Questa carta non presenta un effetto scritto.')}</p>
        `;

        modal.classList.add('open');
    }

    function closeCardModal() {
        document.getElementById('cardModal').classList.remove('open');
    }
    document.getElementById('cardModalClose').onclick = closeCardModal;
    document.getElementById('cardModal').addEventListener('click', (e) => {
        if (e.target.id === 'cardModal') closeCardModal();
    });

    initFilters();
    renderGrid();
</script>
</body>
</html>
